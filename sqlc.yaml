version: "2"
sql:
  - engine: sqlite
    schema: internal/server/store/migrations
    queries: internal/server/store/queries.sql
    gen:
      go:
        package: store
        out: internal/server/store
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/agent/store/nodestore/migrations
    queries: internal/agent/store/nodestore/queries.sql
    gen:
      go:
        package: nodestore
        out: internal/agent/store/nodestore
        emit_empty_slices: true
  - engine: sqlite
    schema: internal/agent/store/projectstore/migrations
    queries: internal/agent/store/projectstore/queries.sql
    gen:
      go:
        package: projectstore
        out: internal/agent/store/projectstore
        emit_empty_slices: true