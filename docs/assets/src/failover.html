<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .votes {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 5px;
      }
      .votes i {
        width: 10px;
        height: 10px;
        border: 1px solid var(--line);
        border-radius: 2px;
      }
      .votes i.on {
        border-color: var(--success);
        background: var(--success);
      }
      .rule {
        margin-top: 28px;
        padding: 14px 18px;
        border-left: 2px solid var(--wave);
        background: var(--card);
        font-size: 17px;
        line-height: 1.6;
      }
      .facts {
        display: flex;
        margin-top: 20px;
        font-size: 16px;
        color: var(--muted);
      }
      .facts span {
        padding: 0 22px;
        border-left: 1px solid var(--border);
      }
      .facts span:first-child {
        padding-left: 0;
        border-left: 0;
      }
      .facts b {
        margin-right: 8px;
        font-weight: 400;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <svg viewBox="0 0 32 32"><path d="M6 19c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.4" fill="none" stroke-linecap="round" /><path d="M6 13c3-3 6-3 10 0s7 3 10 0" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55" /></svg>
        Nagi
      </div>
      <h1>节点故障，自动接替</h1>
      <p class="lead">为容器指定一个备用节点。原节点、备用节点和见证人各有一票，获得两票的一方才能运行容器。</p>

      <div class="stage" style="height: 320px">
        <div class="box" id="a" style="left: 24px; top: 0; width: 280px; opacity: 0.55">
          <div class="votes"><i></i><i></i></div>
          <div class="k">原节点</div>
          <div class="t"><i class="dot off"></i>节点 1</div>
          <div class="s">已失联，0 票</div>
        </div>
        <div class="box" id="b" style="left: 584px; top: 0; width: 280px">
          <div class="votes"><i class="on"></i><i class="on"></i></div>
          <div class="k">备用节点</div>
          <div class="t"><i class="dot"></i>节点 2</div>
          <div class="s">自己 + 见证人 = 2 票</div>
        </div>
        <div class="box" id="w" style="left: 304px; top: 206px; width: 280px">
          <div class="k">见证人</div>
          <div class="t"><i class="dot idle"></i>面板</div>
          <div class="s">只投票，不运行容器</div>
        </div>
      </div>

      <div class="notes">
        <div>
          <div class="nt"><span class="n">01</span>平时</div>
          <div class="nd">原节点每&nbsp;10&nbsp;秒向另外两方续约，保持两票，容器持续运行。</div>
        </div>
        <div>
          <div class="nt"><span class="n">02</span>失联</div>
          <div class="nd">原节点续约失败，会在租约（<span style="white-space: nowrap">30 秒</span>）到期前自行停止容器。</div>
        </div>
        <div>
          <div class="nt"><span class="n">03</span>接替</div>
          <div class="nd">租约到期后，见证人改投备用节点；备用节点获得两票后启动容器。</div>
        </div>
      </div>

      <div class="rule">三票中只可能有一方获得两票，因此容器不会在两个节点上同时运行。</div>
      <div class="facts">
        <span><b>备用节点故障</b>不受影响</span>
        <span><b>面板离线</b>不受影响</span>
        <span><b>原节点恢复</b>稳定后自动切回</span>
      </div>
    </div>
    <script src="wires.js"></script>
    <script>
      draw(({ wire }) => {
        wire("#a", "r", "#b", "l", { align: "a", cls: "dead", label: "×", labelCls: "x" });
        wire("#a", "b", "#w", "l", { cls: "dead", label: "×", labelCls: "x" });
        wire("#w", "r", "#b", "b", { cls: "ok", arrow: true, label: "投票", labelCls: "ok" });
      });
    </script>
  </body>
</html>
