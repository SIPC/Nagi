<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <svg viewBox="4 9 24 14" aria-hidden="true"><path d="M6 19c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.4" fill="none" stroke-linecap="round" /><path d="M6 13c3-3 6-3 10 0s7 3 10 0" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55" /></svg>
        Nagi
      </div>
      <h1>一个面板，管理多个节点</h1>
      <p class="lead">每个节点主动连接面板，无需开放端口；节点之间通过 WireGuard 直接通信。</p>

      <div class="stage" style="height: 400px">
        <div class="box" id="panel" style="left: 304px; top: 0; width: 280px">
          <div class="k mono">nagi server</div>
          <div class="t"><i class="dot"></i>面板</div>
          <div class="s">网页控制台</div>
        </div>
        <div class="box ghost" id="standby" style="left: 664px; top: 0; width: 224px">
          <div class="k mono">standby</div>
          <div class="t"><i class="dot idle"></i>备用面板</div>
          <div class="s">随时接替</div>
        </div>

        <div class="box" id="n1" style="left: 0; top: 230px; width: 264px">
          <div class="k mono">nagi agent</div>
          <div class="t"><i class="dot"></i>节点 1</div>
          <div class="s">运行容器</div>
        </div>
        <div class="box" id="n2" style="left: 312px; top: 230px; width: 264px">
          <div class="k mono">nagi agent</div>
          <div class="t"><i class="dot"></i>节点 2</div>
          <div class="s">运行容器</div>
        </div>
        <div class="box" id="n3" style="left: 624px; top: 230px; width: 264px">
          <div class="k mono">nagi agent</div>
          <div class="t"><i class="dot"></i>节点 3</div>
          <div class="s">运行容器</div>
        </div>
      </div>

      <div class="notes">
        <div>
          <div class="nt"><i class="swatch"></i>无需开放端口</div>
          <div class="nd">由节点主动连接面板，位于内网的服务器也可加入。</div>
        </div>
        <div>
          <div class="nt"><i class="swatch wave"></i>节点直接互通</div>
          <div class="nd">节点间组成 WireGuard 网络，不通时由面板中转。</div>
        </div>
        <div>
          <div class="nt">面板离线不影响服务</div>
          <div class="nd">节点缓存配置，面板离线时容器继续运行。</div>
        </div>
      </div>
    </div>
    <script src="wires.js"></script>
    <script>
      draw(({ wire }) => {
        wire("#n1", "t", "#panel", "b", { fb: 0.2, arrow: true });
        wire("#n2", "t", "#panel", "b", { fb: 0.5, arrow: true, label: "主动连接" });
        wire("#n3", "t", "#panel", "b", { fb: 0.8, arrow: true });
        wire("#panel", "r", "#standby", "l", { align: "a", cls: "dash", label: "同步" });
        wire("#n1", "r", "#n2", "l", { align: "a", cls: "wave" });
        wire("#n2", "r", "#n3", "l", { align: "a", cls: "wave" });
        wire("#n1", "b", "#n3", "b", { drop: 44, cls: "wave", label: "WireGuard", labelCls: "wave" });
      });
    </script>
  </body>
</html>
