<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .cols {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .col {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 48px;
      }
      .node {
        display: inline-block;
        margin-top: 10px;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .file {
        font-family: var(--mono);
        font-size: 15px;
        color: var(--fg);
      }
      .inner {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .inner .box {
        padding: 10px 14px;
      }
      .inner .t {
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <svg viewBox="0 0 32 32"><path d="M6 19c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.4" fill="none" stroke-linecap="round" /><path d="M6 13c3-3 6-3 10 0s7 3 10 0" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55" /></svg>
        Nagi
      </div>
      <h1>一个项目，一组容器</h1>
      <p class="lead">前端、后端、数据库放进同一项目，每个容器各自选择节点；现有 compose 可直接导入为容器组。</p>

      <div class="stage">
        <div class="zone" style="padding: 56px 24px 24px">
          <div class="zl">项目<span>shop</span></div>
          <div class="cols">
            <div class="col">
              <div class="box" id="web">
                <div class="k">容器</div>
                <div class="t"><i class="dot"></i>web</div>
                <div class="node">节点 1</div>
              </div>
              <div class="box ghost" id="web-c">
                <div class="file">compose.yml</div>
                <div class="s">由镜像表单生成</div>
              </div>
            </div>
            <div class="col">
              <div class="box" id="api">
                <div class="k">容器</div>
                <div class="t"><i class="dot"></i>api</div>
                <div class="node">节点 2</div>
              </div>
              <div class="box ghost" id="api-c">
                <div class="file">compose.yml</div>
                <div class="s">由镜像表单生成</div>
              </div>
            </div>
            <div class="box">
              <div class="k">容器组 · <span class="mono">compose.yml</span></div>
              <div class="t"><i class="dot"></i>umami</div>
              <div class="node">节点 1</div>
              <div class="inner">
                <div class="box ghost"><div class="k">容器</div><div class="t">app</div></div>
                <div class="box ghost"><div class="k">容器</div><div class="t">db</div></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="notes">
        <div>
          <div class="nt">层级扁平</div>
          <div class="nd">只有容器与容器组两种，容器组展开可见其中的容器。</div>
        </div>
        <div>
          <div class="nt">独立部署</div>
          <div class="nd">每个容器可单独部署、回滚和迁移，互不影响。</div>
        </div>
        <div>
          <div class="nt">随时导出</div>
          <div class="nd">底层均为标准 compose，导出即可独立运行。</div>
        </div>
      </div>
    </div>
    <script src="wires.js"></script>
    <script>
      draw(({ wire }) => {
        wire("#web", "b", "#web-c", "t", { cls: "dash" });
        wire("#api", "b", "#api-c", "t", { cls: "dash" });
      });
    </script>
  </body>
</html>
