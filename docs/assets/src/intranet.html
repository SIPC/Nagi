<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .nodes {
        display: grid;
        grid-template-columns: 372px 372px;
        justify-content: space-between;
      }
      .nodes .zone {
        height: 330px;
      }
      .zone > .box {
        width: 130px;
      }
      .top {
        top: 62px;
        min-height: 108px;
      }
      .bottom {
        top: 214px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <svg viewBox="0 0 32 32"><path d="M6 19c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.4" fill="none" stroke-linecap="round" /><path d="M6 13c3-3 6-3 10 0s7 3 10 0" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55" /></svg>
        Nagi
      </div>
      <h1>跨节点，按名字访问</h1>
      <p class="lead">同一项目的容器即使分布在不同节点上，也可直接通过容器名互相访问，无需额外配置网络。</p>

      <div class="stage nodes">
        <div class="zone">
          <div class="zl">节点 1</div>
          <div class="box top" id="web" style="left: 16px">
            <div class="k">容器</div>
            <div class="t"><i class="dot"></i>web</div>
          </div>
          <div class="box ghost top" id="proxy" style="left: 226px">
            <div class="k">代理</div>
            <div class="t">db</div>
            <div class="s">指向节点 2</div>
          </div>
          <div class="box bottom" id="na" style="left: 226px">
            <div class="k mono">agent</div>
            <div class="t">nagi</div>
          </div>
        </div>
        <div class="zone">
          <div class="zl">节点 2</div>
          <div class="box bottom" id="nb" style="left: 16px">
            <div class="k mono">agent</div>
            <div class="t">nagi</div>
          </div>
          <div class="box top" id="db" style="left: 226px">
            <div class="k">容器</div>
            <div class="t"><i class="dot"></i>db</div>
            <div class="s">postgres</div>
          </div>
        </div>
      </div>

      <div class="notes">
        <div>
          <div class="nt">按名称访问</div>
          <div class="nd">使用容器名即可访问，与容器所在的节点无关。</div>
        </div>
        <div>
          <div class="nt">迁移后不变</div>
          <div class="nd">容器迁移到其他节点后，名称和访问方式不变。</div>
        </div>
        <div>
          <div class="nt">默认隔离</div>
          <div class="nd">不同项目之间默认隔离，可按需连接两个项目。</div>
        </div>
      </div>
    </div>
    <script src="wires.js"></script>
    <script>
      draw(({ wire }) => {
        wire("#web", "r", "#proxy", "l", { align: "a", arrow: true, label: "db:5432", labelCls: "code" });
        wire("#proxy", "b", "#na", "t", { align: "a", arrow: true });
        wire("#na", "r", "#nb", "l", { align: "a", arrow: true, cls: "wave", label: "WireGuard", labelCls: "wave" });
        wire("#nb", "r", "#db", "b", { arrow: true });
      });
    </script>
  </body>
</html>
