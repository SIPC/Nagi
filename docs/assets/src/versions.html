<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .v {
        position: absolute;
        z-index: 2;
        width: 160px;
        transform: translateX(-50%);
        text-align: center;
      }
      .v .vn {
        font-family: var(--mono);
        font-size: 14px;
        color: var(--fg);
      }
      .v .vd {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .v.draft .vn {
        color: var(--muted);
      }
      .pt {
        position: absolute;
        z-index: 2;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%);
        border: 2px solid var(--fg);
        border-radius: 50%;
        background: var(--bg);
      }
      .pt.cur {
        border-color: var(--success);
        background: var(--success);
      }
      .pt.draft {
        border: 1.5px dashed var(--muted);
      }
      .inc {
        position: absolute;
        top: 466px;
        left: 110px;
        font-size: 12.5px;
        color: var(--faint);
      }
      .part {
        position: absolute;
        top: 490px;
        z-index: 1;
        width: 340px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
      }
      .part .pt2 {
        font-size: 15px;
        font-weight: 600;
      }
      .part .pd {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <svg viewBox="0 0 32 32">
          <path d="M6 19c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.4" fill="none" stroke-linecap="round" />
          <path d="M6 13c3-3 6-3 10 0s7 3 10 0" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55" />
        </svg>
        Nagi
      </div>
      <h1>每次部署，都是一个版本</h1>
      <p class="lead">修改先存为草稿，部署时生成新版本；可随时回滚到任一版本，恢复当时的状态。</p>

      <svg class="wires">
        <defs>
          <marker id="arr-wave" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0 1L9 5L0 9z" style="fill: var(--wave)" />
          </marker>
        </defs>
        <path class="wire" d="M120 346H860" />
        <path class="wire dash" d="M860 346H1060" />
        <path class="wire wave" marker-end="url(#arr-wave)" d="M690 334C690 250 350 250 350 333" />
      </svg>

      <div class="tag c wave" style="left: 520px; top: 272px">回滚</div>

      <i class="pt" style="left: 180px; top: 346px"></i>
      <i class="pt" style="left: 350px; top: 346px"></i>
      <i class="pt" style="left: 520px; top: 346px"></i>
      <i class="pt cur" style="left: 690px; top: 346px"></i>
      <i class="pt draft" style="left: 1000px; top: 346px"></i>

      <div class="v" style="left: 180px; top: 368px"><div class="vn">v1</div><div class="vd">首次部署</div></div>
      <div class="v" style="left: 350px; top: 368px"><div class="vn">v2</div><div class="vd">更新镜像</div></div>
      <div class="v" style="left: 520px; top: 368px"><div class="vn">v3</div><div class="vd">上传新代码</div></div>
      <div class="v" style="left: 690px; top: 368px"><div class="vn">v4</div><div class="vd">回滚到 v2</div></div>
      <div class="v draft" style="left: 1000px; top: 368px"><div class="vn">草稿</div><div class="vd">未部署的修改</div></div>

      <div class="inc">每个版本包含</div>
      <div class="part" style="left: 110px">
        <div class="pt2">配置</div>
        <div class="pd">compose、环境变量与密钥</div>
      </div>
      <div class="part" style="left: 470px">
        <div class="pt2">文件</div>
        <div class="pd">部署时的代码与静态文件</div>
      </div>
      <div class="part" style="left: 830px">
        <div class="pt2">镜像</div>
        <div class="pd">按摘要记录，即使使用 latest 也能精确还原</div>
      </div>
    </div>
  </body>
</html>
