<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .hl {
        margin-top: 4px;
        font-size: 15px;
        color: var(--wave);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="mark">
        <svg viewBox="0 0 32 32"><path d="M6 19c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.4" fill="none" stroke-linecap="round" /><path d="M6 13c3-3 6-3 10 0s7 3 10 0" stroke="#e2e8f0" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55" /></svg>
        Nagi
      </div>
      <h1>面板故障，服务不受影响</h1>
      <p class="lead">配置保存在面板，容器与数据位于节点；每个节点另外缓存一份本节点的配置。</p>

      <div class="stage" style="height: 320px">
        <div class="box" id="panel" style="left: 294px; top: 0; width: 300px">
          <div class="k mono">nagi server</div>
          <div class="t"><i class="dot"></i>面板</div>
          <div class="s">项目配置 · 版本记录 · 部署记录</div>
        </div>
        <div class="box" id="n1" style="left: 84px; top: 190px; width: 300px">
          <div class="k mono">nagi agent</div>
          <div class="t"><i class="dot"></i>节点 1</div>
          <div class="s">容器 · 数据 · 快照</div>
          <div class="hl">配置缓存</div>
        </div>
        <div class="box" id="n2" style="left: 504px; top: 190px; width: 300px">
          <div class="k mono">nagi agent</div>
          <div class="t"><i class="dot"></i>节点 2</div>
          <div class="s">容器 · 数据 · 快照</div>
          <div class="hl">配置缓存</div>
        </div>
      </div>

      <div class="notes">
        <div>
          <div class="nt">面板暂时离线</div>
          <div class="nd">容器与快照照常运行，恢复后即可继续管理。</div>
        </div>
        <div>
          <div class="nt">已配置备用面板</div>
          <div class="nd">在备用面板上一键提升为主面板，数据完整。</div>
        </div>
        <div>
          <div class="nt">面板彻底丢失</div>
          <div class="nd">安装新面板后，项目根据各节点的配置缓存自动重建。</div>
        </div>
      </div>
    </div>
    <script src="wires.js"></script>
    <script>
      draw(({ wire, tag }) => {
        const pts = wire("#panel", "b", "#n1", "t", { arrow: true });
        wire("#panel", "b", "#n2", "t", { arrow: true });
        tag(pts[0][0], pts[1][1], "下发配置");
      });
    </script>
  </body>
</html>
