<!doctype html>
<!-- 面板连不上时 Service Worker 显示的页面（见 docs/standby.md#面板不可用时）。不依赖面板的其他文件；脚本单独成文件：面板的 CSP 不允许内联脚本。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Nagi</title>
    <style>
      :root {
        --background: #ffffff;
        --foreground: #0a0a0a;
        --muted: #737373;
        --border: #e5e5e5;
        --accent: #f5f5f5;
        --primary: #171717;
        --primary-foreground: #fafafa;
        --warning: #b45309;
        color-scheme: light;
      }
      .dark {
        --background: #0a0a0a;
        --foreground: #ededed;
        --muted: #a1a1a1;
        --border: rgb(255 255 255 / 0.1);
        --accent: #262626;
        --primary: #e5e5e5;
        --primary-foreground: #171717;
        --warning: #fbbf24;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--foreground);
        font: 14px/1.5 "MiSans", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      main {
        width: 100%;
        max-width: 480px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 20px 0 0;
        padding: 0;
        border-top: 1px solid var(--border);
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .who {
        min-width: 0;
        flex: 1;
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .addr {
        color: var(--muted);
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      button,
      a.button {
        height: 32px;
        padding: 0 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--foreground);
        font: inherit;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover,
      a.button:hover {
        background: var(--accent);
      }
      .primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-foreground);
      }
      .primary:hover {
        background: var(--primary);
        opacity: 0.9;
      }
      .note {
        margin-top: 16px;
        font-size: 13px;
      }
      .actions {
        margin-top: 20px;
        display: flex;
        gap: 8px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="28" height="16" viewBox="0 0 28 16" aria-hidden="true">
        <path d="M2 11c3-3 6-3 10 0s7 3 10 0" stroke="#7dd3fc" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M2 5c3-3 6-3 10 0s7 3 10 0" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".45" />
      </svg>
      <h1 id="title"></h1>
      <p id="text"></p>
      <ul id="list" hidden></ul>
      <p class="note" id="note" hidden></p>
      <div class="actions">
        <button type="button" id="retry"></button>
      </div>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
