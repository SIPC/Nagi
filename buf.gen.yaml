version: v2
plugins:
  - local: protoc-gen-go
    out: internal/proto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/proto
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/proto
    opt: paths=source_relative
  - local: [node, web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: web/src/gen
    opt:
      - target=ts
  # 安卓 App（见 docs/android.md#工程）：protobuf-javalite 和 connect-kotlin。需要 protoc 和 protoc-gen-connect-kotlin 在 PATH 里。
  - protoc_builtin: java
    out: android/core/proto/src/main/java
    opt: lite
  - local: protoc-gen-connect-kotlin
    out: android/core/proto/src/main/kotlin
    opt: generateCallbackMethods=false
