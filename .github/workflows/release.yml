# 推送 v* 标签时发布：编译 linux/amd64、linux/arm64 的 nagi（前端打包在内）和签名的安卓 App，
# 连同面板安装脚本、卸载脚本和 SHA256SUMS 上传到 GitHub Release。
# 安装脚本从 releases/latest/download/ 下载这些文件，文件名不要改。
#
# 预发布版（标签 vX.Y.Z-pre.N，见 docs/development.md#预发布版本）走同一个流程，测试、编译和签名都一样，只是在 GitHub 上标成
# prerelease、不设为 latest：releases/latest 和正式版渠道看不到它。标签的格式和「同一版本号不重新发布」在 tag 任务里检查，
# 规则在 scripts/release-tag.sh（internal/pkg/release 的 TestReleaseTagScript、TestReleaseWorkflow 检查）。
#
# 测试、漏洞检查和两个架构的编译同时进行，都通过后才发布。这里自己跑测试和漏洞检查，不依赖 ci.yml 的结果。
# 测试和漏洞检查用 main 上 ci.yml 存下的 Go 缓存（标签上的流程只能读当前标签和默认分支的缓存，按 restore-keys
# 用 main 上一次的）。产出发布文件的任务（build、android）不恢复任何缓存，从头下载依赖、从头编译：
# 缓存是别的任务写的，发布文件不能建立在它上面。
name: release

on:
  push:
    tags: ["v*"]

# 默认只读，只有最后上传 Release 的任务可写：测试、编译时执行的依赖代码拿不到可写令牌。
# 第三方 action 固定到提交（注释是对应的标签），checkout 不保存凭据。
permissions:
  contents: read

jobs:
  # 先核对标签：格式不对、这个版本已经发布过时停下，不浪费后面的编译。查不到 GitHub 上有没有这个版本时也停下：
  # 发布会覆盖已有 Release 的文件，不能在不确定时继续。
  tag:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>&1); then
            released=$out
          elif printf '%s' "$out" | grep -q 'release not found'; then
            released=""
          else
            echo "::error::无法查询 $GITHUB_REF_NAME 是否已经发布：$out"
            exit 1
          fi
          sh scripts/release-tag.sh "$GITHUB_REF_NAME" "$released" >> "$GITHUB_OUTPUT"

  # mesh 的测试单独一个任务：它的测试并行运行、很占 CPU，和别的包（agent 里按时间判定的端到端测试）挤在一台机器上会互相拖慢。
  test:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [mesh, rest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 用 1.26 的最新补丁版本编译，带上标准库的安全修复；go.mod 里的版本只是最低要求。
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-test-${{ matrix.shard }}-
            go-test-

      # 没写更新日志就别白编译：先检查，正文在 release 里再生成一次。
      - name: Check release notes
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      # web/dist 里有占位文件，测试不用等前端构建。
      - name: Test
        run: |
          if [ "${{ matrix.shard }}" = mesh ]; then
            go test ./internal/pkg/mesh/...
          else
            go test $(go list ./... | grep -v /internal/pkg/mesh)
          fi

  # 依赖和标准库里会被调用到的已知漏洞（和 ci.yml 的一样）。
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      # 不恢复缓存：缓存是别的任务写的，被改过的模块源码可能让检查假通过。
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    # 编译结果的 SHA-256 作为任务输出交给 release 核对：release 按名字下载 artifact，内容和这里算的不一致就不发布。
    # 两个架构各写自己的那一项。
    outputs:
      sha_amd64: ${{ steps.sum.outputs.sha_amd64 }}
      sha_arm64: ${{ steps.sum.outputs.sha_arm64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      # 不恢复 Go 和 pnpm 的缓存（见文件开头的说明）：模块按 go.sum、pnpm-lock.yaml 重新下载并核对。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1

      - name: Build web
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build

      # 证明证书的吊销列表放进面板，连不上 Google 的面板也有一份（见 docs/android.md#吊销列表）。
      - name: Attestation revocation list
        run: sh scripts/attestation-status.sh

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/nagi-linux-${{ matrix.arch }} ./cmd/nagi

      - name: Checksum
        id: sum
        run: echo "sha_${{ matrix.arch }}=$(sha256sum dist/nagi-linux-${{ matrix.arch }} | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nagi-linux-${{ matrix.arch }}
          path: dist/nagi-linux-${{ matrix.arch }}
          retention-days: 1
          # 同名的 artifact 先删掉再传：别的任务抢先用这个名字建的不会挡住真正的产物（内容另由 release 按 SHA-256 核对）。
          overwrite: true

  # 安卓 App（docs/android.md）：和面板同一个版本号，用仓库 Secrets 里的签名密钥签名，产出 nagi-android.apk。
  # App 的自动更新从 releases/latest/download/nagi-android.apk 下载，文件名不要改。
  # 没配签名密钥时跳过（不发未签名的包）；这一步失败也不影响面板发布（见下面 release 的 if）。
  android:
    runs-on: ubuntu-latest
    # APK 的 SHA-256 和签名证书的 SHA-256 作为任务输出交给 release（同 build）。没配签名密钥时两项都为空。
    outputs:
      sha: ${{ steps.apk.outputs.sha }}
      cert: ${{ steps.apk.outputs.cert }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用缓存（见文件开头的说明）：签名的 APK 从头下载依赖、从头编译。
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Build APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.NAGI_KEYSTORE_BASE64 }}
          NAGI_KEYSTORE_PASSWORD: ${{ secrets.NAGI_KEYSTORE_PASSWORD }}
          NAGI_KEY_ALIAS: ${{ secrets.NAGI_KEY_ALIAS }}
          NAGI_KEY_PASSWORD: ${{ secrets.NAGI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::仓库没有配置签名密钥（NAGI_KEYSTORE_BASE64），这次发布不带安卓 App"
            exit 0
          fi
          export NAGI_KEYSTORE_FILE="$RUNNER_TEMP/nagi-release.jks"
          trap 'rm -f "$NAGI_KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$NAGI_KEYSTORE_FILE"
          (cd android && bash ./gradlew --no-daemon :app:assembleRelease -PnagiVersion="$GITHUB_REF_NAME")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/nagi-android.apk
          # 签名证书的 SHA-256 写进发布正文，方便用户核对。
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          cert="$("$apksigner" verify --print-certs dist/nagi-android.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          test -n "$cert"
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum dist/nagi-android.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ steps.apk.outputs.sha != '' }}
        with:
          name: nagi-android
          path: dist/nagi-android.apk
          retention-days: 1
          overwrite: true

  # 面板的测试、漏洞检查和编译都通过才发布。没配签名密钥时不带安卓 App；配了签名密钥时安卓 App 必须编译成功，
  # 否则不发布（App 的自动更新会找不到这个版本的 APK），修好后重新运行。
  release:
    needs: [tag, test, vuln, build, android]
    if: ${{ !cancelled() && needs.tag.result == 'success' && needs.test.result == 'success' && needs.vuln.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 按确切的名字一个一个下载，不按通配符合并：别的任务上传的同类名字的 artifact 进不来。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nagi-linux-amd64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nagi-linux-arm64
          path: dist

      # 安卓任务成功并且产出了 APK 才带上；失败或跳过时不下载，免得用上别处上传的同名 artifact。
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.android.result == 'success' && needs.android.outputs.sha != '' }}
        with:
          name: nagi-android
          path: dist

      # 下载到的文件要和编译任务自己算的 SHA-256 一致，多出来的文件也不行。
      - name: Require APK
        env:
          HAS_KEY: ${{ secrets.NAGI_KEYSTORE_BASE64 != '' }}
          ANDROID_RESULT: ${{ needs.android.result }}
          SHA_APK: ${{ needs.android.outputs.sha }}
        run: |
          if [ "$HAS_KEY" = true ] && { [ "$ANDROID_RESULT" != success ] || [ -z "$SHA_APK" ]; }; then
            echo "::error::已配置签名密钥，但安卓 App 没有编译成功（$ANDROID_RESULT），这次不发布"
            exit 1
          fi

      - name: Verify artifacts
        env:
          SHA_AMD64: ${{ needs.build.outputs.sha_amd64 }}
          SHA_ARM64: ${{ needs.build.outputs.sha_arm64 }}
          SHA_APK: ${{ needs.android.result == 'success' && needs.android.outputs.sha || '' }}
        run: |
          test -n "$SHA_AMD64" && test -n "$SHA_ARM64"
          want="nagi-linux-amd64 nagi-linux-arm64"
          {
            echo "$SHA_AMD64  nagi-linux-amd64"
            echo "$SHA_ARM64  nagi-linux-arm64"
          } > "$RUNNER_TEMP/expected.sha256"
          if [ -n "$SHA_APK" ]; then
            echo "$SHA_APK  nagi-android.apk" >> "$RUNNER_TEMP/expected.sha256"
            want="nagi-android.apk $want"
          fi
          (cd dist && sha256sum -c "$RUNNER_TEMP/expected.sha256")
          actual="$(cd dist && ls -A | sort | xargs)"
          if [ "$actual" != "$want" ]; then
            echo "发布文件和预期不一致：$actual" >&2
            exit 1
          fi

      - name: Checksums
        run: |
          cp scripts/install.sh scripts/uninstall.sh CHANGELOG.md CHANGELOG.en.md dist/
          files="nagi-linux-amd64 nagi-linux-arm64 install.sh uninstall.sh"
          [ -f dist/nagi-android.apk ] && files="$files nagi-android.apk"
          cd dist && sha256sum $files > SHA256SUMS

      # 正文取自 CHANGELOG.md 里这个版本的说明，没写的话发布失败（先补上更新日志再打标签）。
      # 两份更新日志也作为发布文件上传，面板的「关于」按界面语言取，英文的也要写。
      - name: Release notes
        env:
          ANDROID_CERT: ${{ needs.android.outputs.cert }}
        run: |
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          grep -qx "## $GITHUB_REF_NAME" CHANGELOG.en.md || { echo "CHANGELOG.en.md 中没有 $GITHUB_REF_NAME" >&2; exit 1; }
          if [ -f dist/nagi-android.apk ] && [ -n "$ANDROID_CERT" ]; then
            printf '\n\n安卓 App 签名证书 SHA-256：`%s`\n' "$ANDROID_CERT" >> notes.md
          fi

      # 预发布版标成 prerelease、不设为 latest；正式版设为 latest。
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ needs.tag.outputs.prerelease }}
          make_latest: ${{ needs.tag.outputs.prerelease == 'true' && 'false' || 'true' }}
