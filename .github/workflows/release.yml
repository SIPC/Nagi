# 推送 v* 标签时发布：编译 linux/amd64、linux/arm64 的 nagi（前端打包在内）和签名的安卓 App，
# 连同面板安装脚本、卸载脚本和 SHA256SUMS 上传到 GitHub Release。
# 安装脚本从 releases/latest/download/ 下载这些文件，文件名不要改。
#
# 测试、漏洞检查和两个架构的编译同时进行，都通过后才发布。Go 的编译缓存用 main 上 ci.yml 存下的：
# 标签上的流程只能读当前标签和默认分支的缓存（GitHub 的限制），所以缓存要靠 main 预热。
# 发版时 main 和标签一起推，不等 main 上的 ci.yml 跑完：那时它还没存下这次的缓存，按 restore-keys 用 main 上一次的，
# 只多编译改过的包。这里自己跑测试和漏洞检查，不依赖 ci.yml 的结果。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # mesh 的测试单独一个任务：它的测试并行运行、很占 CPU，和别的包（agent 里按时间判定的端到端测试）挤在一台机器上会互相拖慢。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [mesh, rest]
    steps:
      - uses: actions/checkout@v4

      # 用 1.26 的最新补丁版本编译，带上标准库的安全修复；go.mod 里的版本只是最低要求。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-test-${{ matrix.shard }}-
            go-test-

      # 没写更新日志就别白编译：先检查，正文在 release 里再生成一次。
      - name: Check release notes
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      # web/dist 里有占位文件，测试不用等前端构建。
      - name: Test
        run: |
          if [ "${{ matrix.shard }}" = mesh ]; then
            go test ./internal/pkg/mesh/...
          else
            go test $(go list ./... | grep -v /internal/pkg/mesh)
          fi

  # 依赖和标准库里会被调用到的已知漏洞（和 ci.yml 的一样）。
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-rest-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-rest-${{ hashFiles('go.sum') }}-
            go-test-rest-
            go-test-

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-
            go-build-${{ matrix.arch }}-

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build

      # 证明证书的吊销列表放进面板，连不上 Google 的面板也有一份（见 docs/android.md#吊销列表）。
      - name: Attestation revocation list
        run: sh scripts/attestation-status.sh

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/nagi-linux-${{ matrix.arch }} ./cmd/nagi

      - uses: actions/upload-artifact@v4
        with:
          name: nagi-linux-${{ matrix.arch }}
          path: dist/nagi-linux-${{ matrix.arch }}
          retention-days: 1

  # 安卓 App（docs/android.md）：和面板同一个版本号，用仓库 Secrets 里的签名密钥签名，产出 nagi-android.apk。
  # App 的自动更新从 releases/latest/download/nagi-android.apk 下载，文件名不要改。
  # 没配签名密钥时跳过（不发未签名的包）；这一步失败也不影响面板发布（见下面 release 的 if）。
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 只读缓存：标签上存的缓存别的标签用不到，缓存由 main 上的 android.yml 预热。
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.NAGI_KEYSTORE_BASE64 }}
          NAGI_KEYSTORE_PASSWORD: ${{ secrets.NAGI_KEYSTORE_PASSWORD }}
          NAGI_KEY_ALIAS: ${{ secrets.NAGI_KEY_ALIAS }}
          NAGI_KEY_PASSWORD: ${{ secrets.NAGI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::仓库没有配置签名密钥（NAGI_KEYSTORE_BASE64），这次发布不带安卓 App"
            exit 0
          fi
          export NAGI_KEYSTORE_FILE="$RUNNER_TEMP/nagi-release.jks"
          trap 'rm -f "$NAGI_KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE_BASE64" | base64 -d > "$NAGI_KEYSTORE_FILE"
          (cd android && bash ./gradlew --no-daemon :app:assembleRelease -PnagiVersion="$GITHUB_REF_NAME")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/nagi-android.apk
          # 签名证书的 SHA-256 写进发布正文，方便用户核对。
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs dist/nagi-android.apk | sed -n 's/.*SHA-256 digest: //p' | head -1 > dist/android-cert.txt
          test -s dist/android-cert.txt

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/nagi-android.apk') != '' }}
        with:
          name: nagi-android
          path: |
            dist/nagi-android.apk
            dist/android-cert.txt
          retention-days: 1

  # 面板的测试、漏洞检查和编译都通过才发布；安卓 App 成功了就带上，失败或跳过也照常发布面板。
  release:
    needs: [test, vuln, build, android]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.vuln.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nagi-*
          merge-multiple: true

      - name: Checksums
        run: |
          mv dist/android-cert.txt . 2>/dev/null || true
          cp scripts/install.sh scripts/uninstall.sh CHANGELOG.md CHANGELOG.en.md dist/
          files="nagi-linux-amd64 nagi-linux-arm64 install.sh uninstall.sh"
          [ -f dist/nagi-android.apk ] && files="$files nagi-android.apk"
          cd dist && sha256sum $files > SHA256SUMS

      # 正文取自 CHANGELOG.md 里这个版本的说明，没写的话发布失败（先补上更新日志再打标签）。
      # 两份更新日志也作为发布文件上传，面板的「关于」按界面语言取，英文的也要写。
      - name: Release notes
        run: |
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          grep -qx "## $GITHUB_REF_NAME" CHANGELOG.en.md || { echo "CHANGELOG.en.md 中没有 $GITHUB_REF_NAME" >&2; exit 1; }
          if [ -s android-cert.txt ]; then
            printf '\n\n安卓 App 签名证书 SHA-256：`%s`\n' "$(cat android-cert.txt)" >> notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
