# 推送 v* 标签时发布：编译 linux/amd64、linux/arm64 的 nagi（前端打包在内），
# 连同面板安装脚本、卸载脚本和 SHA256SUMS 上传到 GitHub Release。
# 安装脚本从 releases/latest/download/ 下载这些文件，文件名不要改。
#
# 测试和两个架构的编译同时进行，都通过后才发布。Go 的编译缓存用 main 上 ci.yml 存下的：
# 标签上的流程只能读当前标签和默认分支的缓存（GitHub 的限制），所以缓存要靠 main 预热。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用 1.26 的最新补丁版本编译，带上标准库的安全修复；go.mod 里的版本只是最低要求。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ hashFiles('go.sum') }}-
            go-test-

      # 没写更新日志就别白编译：先检查，正文在 release 里再生成一次。
      - name: Check release notes
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      # web/dist 里有占位文件，测试不用等前端构建。
      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ matrix.arch }}-${{ hashFiles('go.sum') }}-
            go-build-${{ matrix.arch }}-

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/nagi-linux-${{ matrix.arch }} ./cmd/nagi

      - uses: actions/upload-artifact@v4
        with:
          name: nagi-linux-${{ matrix.arch }}
          path: dist/nagi-linux-${{ matrix.arch }}
          retention-days: 1

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nagi-linux-*
          merge-multiple: true

      - name: Checksums
        run: |
          cp scripts/install.sh scripts/uninstall.sh CHANGELOG.md CHANGELOG.en.md dist/
          cd dist && sha256sum nagi-linux-amd64 nagi-linux-arm64 install.sh uninstall.sh > SHA256SUMS

      # 正文取自 CHANGELOG.md 里这个版本的说明，没写的话发布失败（先补上更新日志再打标签）。
      # 两份更新日志也作为发布文件上传，面板的「关于」按界面语言取，英文的也要写。
      - name: Release notes
        run: |
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          grep -qx "## $GITHUB_REF_NAME" CHANGELOG.en.md || { echo "CHANGELOG.en.md 中没有 $GITHUB_REF_NAME" >&2; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
