# 安卓 App 有改动时编译 debug 包、跑单元测试，提前发现问题。这里的 Gradle 缓存只给本流程自己用：
# 打标签发布时（release.yml 的 android 任务）不用缓存。
# 和 ci.yml 分开：ci.yml 只看 Go 和网页，安卓只在 android/ 或 proto 改动时才跑。
name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "internal/proto/**/*.proto"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      # 顺带校验 gradle-wrapper.jar 是官方发布的。
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug testDebugUnitTest
