syntax = "proto3";

package nagi.v1;

import "nagi/v1/common.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// PanelService：节点调用面板，走控制连接。
service PanelService {
  // 上报节点信息和所有项目的最新状态，连上时和状态变化时调用。
  rpc Report(ReportRequest) returns (ReportResponse);
  // 节点证书快到期时续期。私钥不变，节点提交新的证书签名请求。
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // 节点直接发送告警失败时，请面板代发到指定的渠道。
  rpc RelayAlert(RelayAlertRequest) returns (RelayAlertResponse);
  // mesh 的 TLS 中转：UDP 不通时，WireGuard 包经控制连接收发。
  rpc MeshRelay(stream MeshPacket) returns (stream MeshPacket);
}

message MeshPacket {
  // 原始发送方和最终接收方的 WireGuard 公钥。
  bytes src = 1;
  bytes dst = 2;
  bytes payload = 3;
}

// MeshInfo 是节点上报的自己的 mesh 信息。
message MeshInfo {
  bytes public_key = 1;
  uint32 port = 2;
  repeated string endpoints = 3;
}

// MeshConfig 是面板告诉节点的 mesh 成员（面板自己和它管理的在线节点）。
message MeshConfig {
  bytes panel_key = 1;
  repeated MeshPeer peers = 2;
}

message RelayAlertRequest {
  Alert alert = 1;
  repeated string channel_ids = 2;
}

message RelayAlertResponse {}

message RenewCertificateRequest {
  bytes csr = 1;
}

message RenewCertificateResponse {
  bytes certificate = 1;
}

message ReportRequest {
  NodeInfo node = 1;
  repeated ProjectSummary projects = 2;
  MeshInfo mesh = 3;
  // 每个项目快照仓库的密码（项目 ID → config/backup.key 的内容）。单独放，不进 Project，不会返回给浏览器。
  map<string, string> backup_keys = 4;
}

message ReportResponse {
  MeshConfig mesh = 1;
}
