syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// Project 是节点上保存的项目。项目数据以节点为准。
message Project {
  // 全局唯一的项目 ID。
  string id = 1;
  // 显示名称，可以重名。
  string name = 2;
  // 项目目录，例如 /mnt/qmt。
  string dir = 3;
  // 修订号：每次保存草稿或部署都加一，用于多面板冲突检测。
  int64 revision = 4;
  // 最新版本号。
  int64 latest_version = 5;
  // 最近一次部署的版本号，0 表示从未部署。
  int64 deployed_version = 6;
  reserved 7;
  google.protobuf.Timestamp created_at = 8;
  // 最新版本的配置。
  ProjectConfig config = 9;
  // 是否有未部署的草稿。
  bool has_draft = 10;
  // 草稿内容，has_draft 为 false 时为空。
  ProjectConfig draft = 11;
  // 项目的 SSH deploy key 公钥，加到 git 仓库的只读 deploy key 里。
  string deploy_key = 12;
  // webhook 令牌：POST 到面板的 /hooks/<令牌> 会拉取并部署。
  string webhook_token = 13;
  // 最近一次拉取到的 git 提交。
  string last_commit = 14;
  // 端口映射（config/routes/ 下的文件）。
  repeated Exposure routes = 15;
  // 实际判定的是否有状态（自动判断或用户指定）。
  bool stateful = 16;
}

// ProjectConfig 是一个版本的完整配置。
message ProjectConfig {
  // compose 原文。用镜像表单创建的项目，由表单生成。
  string compose = 1;
  // 项目级变量：替换 compose 里的 ${变量}。
  repeated EnvVar env = 2;
  // 服务级环境变量：键是服务名，只注入对应服务的容器。
  map<string, EnvList> service_env = 3;
  // 用镜像表单创建的项目才有。有它时 compose 由它生成。
  ImageForm form = 4;
  // 原来的对外开放设置，已移到项目目录的 config/routes/（见 Project.routes）。
  reserved 5;
  // 项目文件的来源。为空表示文件由用户自己放进 data/。
  Source source = 6;
  // 更新文件时保留不动的路径（相对 data/），例如 uploads/。
  // compose 里挂载进容器的 data/ 下的目录会自动保留，不需要写在这里。
  repeated string preserve = 7;
  // 是否有状态。默认自动判断：用了命名 volume 或有保留路径的项目算有状态。
  Stateful stateful = 8;
  // 定时快照间隔（分钟），0 表示默认（60 分钟）。
  uint32 snapshot_interval_minutes = 9;
}

enum Stateful {
  STATEFUL_AUTO = 0;
  STATEFUL_YES = 1;
  STATEFUL_NO = 2;
}

// Version 是一次部署：配置 + 文件 + 镜像摘要。
message Version {
  int64 version = 1;
  google.protobuf.Timestamp created_at = 2;
  // 部署成功的时间，部署失败时为空。
  google.protobuf.Timestamp deployed_at = 3;
  // 服务名 → 部署时实际使用的镜像（带摘要）。
  map<string, string> images = 4;
  // 是否保存了这个版本的文件（data/ 中除保留路径以外的内容）。
  bool has_files = 5;
  // 回滚生成的版本：回滚到的那个版本号。
  int64 rollback_of = 6;
  // 部署时拉取的 git 提交。
  string commit = 7;
}

// Snapshot 是项目的一份快照。
message Snapshot {
  string id = 1;
  // scheduled：定时；manual：手动；predeploy：部署前的数据；version：版本文件。
  string kind = 2;
  google.protobuf.Timestamp time = 3;
  int64 size = 4;
  // predeploy：部署前正在运行的版本；version：所属版本。
  int64 version = 5;
}

message Source {
  // git 仓库地址，支持 SSH（用项目的 deploy key）和 HTTPS（公开仓库）。
  string git_url = 1;
  // 分支或标签，为空时用仓库默认分支。
  string git_ref = 2;
}

// Exposure 是一条端口映射：一个服务端口的对外开放方式。
// 每条映射是项目目录 config/routes/<name>.yml 一个文件，改了立即生效，不需要重新部署。
message Exposure {
  string service = 1;
  // 容器内的端口。
  uint32 target = 2;
  // http、tcp 或 udp。
  string protocol = 3;
  // 节点上对外的端口。tcp/udp 必填；http 没绑域名时必填。
  uint32 published = 4;
  // 绑定的域名，只用于 http。绑了域名后经 80/443 访问，自动申请证书并跳转 HTTPS。
  repeated string domains = 5;
  // 只开 HTTP，不申请证书、不跳转（例如前面还有 CDN 终结 HTTPS）。
  bool http_only = 6;
  // 映射文件名（不含 .yml）。新建时为空，由节点生成。
  string name = 7;
  // 文件无效时的原因，这条映射不会生效。只读。
  string error = 8;
}

message EnvVar {
  string key = 1;
  string value = 2;
  // 密钥：界面上默认隐藏。
  bool secret = 3;
}

message EnvList {
  repeated EnvVar vars = 1;
}

// ImageForm：直接运行一个镜像，文件可选。
message ImageForm {
  string image = 1;
  // 运行命令，为空时使用镜像默认命令。
  string command = 2;
  repeated PortMapping ports = 3;
  // 持久化目录：容器内的路径，数据落到项目目录的 volumes/ 下。
  repeated string volumes = 4;
  // 把项目的 data/ 挂到容器内的这个路径作为工作目录；为空表示不挂载文件。
  string workdir = 5;
  // 环境变量，直接注入容器。
  repeated EnvVar env = 6;
}

message PortMapping {
  // 节点上对外的端口。
  uint32 published = 1;
  // 容器内的端口。
  uint32 target = 2;
  // tcp 或 udp，默认 tcp。
  string protocol = 3;
}

message ServiceStatus {
  string name = 1;
  string container_id = 2;
  string image = 3;
  // 容器状态：running、exited、restarting、paused、created、dead。
  string state = 4;
  // Docker 给出的可读状态，例如 "Up 3 minutes"。
  string status = 5;
  // 健康检查状态：healthy、unhealthy、starting，没有健康检查时为空。
  string health = 6;
}

message ProjectStatus {
  repeated ServiceStatus services = 1;
}

message ProjectSummary {
  Project project = 1;
  ProjectStatus status = 2;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
  string docker_version = 5;
  string compose_version = 6;
}

message LogLine {
  string service = 1;
  // stdout 或 stderr。
  string stream = 2;
  string text = 3;
  google.protobuf.Timestamp time = 4;
}

message DeployEvent {
  oneof event {
    // 部署过程中的一行输出。
    string output = 1;
    DeployResult result = 2;
  }
}

message DeployResult {
  bool success = 1;
  string error = 2;
  int64 version = 3;
}

// MetricSeries 是一条监控序列，times（Unix 秒）和 values 一一对应。
message MetricSeries {
  string name = 1;
  repeated int64 times = 2;
  repeated double values = 3;
}
// AlertChannel 是一个告警渠道。
message AlertChannel {
  string id = 1;
  string name = 2;
  // webhook 或 telegram。
  string type = 3;
  // webhook：POST JSON 的地址。
  string url = 4;
  // telegram：机器人令牌和聊天 ID。
  string telegram_token = 5;
  string telegram_chat_id = 6;
}

// AlertRules 是告警规则的阈值，0 表示用默认值。
message AlertRules {
  // 磁盘使用超过这个百分比，默认 90。
  uint32 disk_percent = 1;
  // 内存使用超过这个百分比并持续 mem_minutes 分钟，默认 90% / 5 分钟。
  uint32 mem_percent = 2;
  uint32 mem_minutes = 3;
  // 容器在 restart_minutes 分钟内重启 restart_count 次，默认 3 次 / 10 分钟。
  uint32 restart_count = 4;
  uint32 restart_minutes = 5;
  // 证书在这么多天内过期，默认 7。
  uint32 cert_days = 6;
  // 节点失联超过这么多秒，默认 60。
  uint32 offline_seconds = 7;
  // 一条 http 规则最近 5 分钟的 5xx 比例超过这个百分比（至少 20 个请求），默认 5。
  uint32 error_percent = 8;
}

message AlertConfig {
  repeated AlertChannel channels = 1;
  AlertRules rules = 2;
}

// Alert 是一条告警或恢复通知。
message Alert {
  // 同一个问题的唯一标识，例如 disk、cert:example.com。
  string key = 1;
  // firing：出现；resolved：已恢复。
  string status = 2;
  string title = 3;
  string message = 4;
  string node = 5;
  string project = 6;
  google.protobuf.Timestamp time = 7;
}
// TrustedPanel 是节点信任列表里的一个面板。
message TrustedPanel {
  string address = 1;
  string fingerprint = 2;
  // 节点当前是否连着这个面板。
  bool connected = 3;
  // 是不是当前操作的这个面板（只由面板接口填写）。
  bool is_self = 4;
}

// MeshPeer 是面板告诉节点的一个 mesh 成员。
message MeshPeer {
  bytes public_key = 1;
  // 可以尝试直连的 UDP 地址（ip:port）。
  repeated string endpoints = 2;
  string name = 3;
  // 节点 ID；面板为空。
  string node_id = 4;
  bool is_panel = 5;
}

// MeshPeerStatus 是到一个 mesh 成员的连接状态。
message MeshPeerStatus {
  bytes public_key = 1;
  string name = 2;
  // mesh 地址（IPv6）。
  string address = 3;
  // direct（UDP 直连）、link（直接经控制连接）、udp-relay（UDP 经面板中转）、tls-relay（经面板的控制连接中转）、none。
  string path = 4;
  // 直连时的对方地址。
  string endpoint = 5;
  // 中转时经过的面板。
  string via = 6;
  double rtt_ms = 7;
  google.protobuf.Timestamp last_handshake = 8;
  uint64 rx_bytes = 9;
  uint64 tx_bytes = 10;
}

message MeshStatus {
  bytes public_key = 1;
  string address = 2;
  uint32 port = 3;
  repeated string endpoints = 4;
  repeated MeshPeerStatus peers = 5;
}

message MeshPingRequest {
  bytes public_key = 1;
}

message MeshPingResponse {
  double rtt_ms = 1;
}
