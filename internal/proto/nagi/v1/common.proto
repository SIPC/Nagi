syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// Project 是节点上保存的项目：一组一起工作的成员，共用项目目录和内网。项目数据以节点为准。
message Project {
  // 全局唯一的项目 ID。
  string id = 1;
  // 显示名称，可以重名。
  string name = 2;
  // 项目目录，例如 /mnt/qmt。
  string dir = 3;
  // 项目设置的修订号：修改名称、共享变量（草稿）、内网、共享网络时加一，用于多面板冲突检测。
  // 成员有自己的修订号（Member.revision）。
  int64 revision = 4;
  reserved 5, 6, 7;
  google.protobuf.Timestamp created_at = 8;
  reserved 9, 10, 11, 12, 13, 14;
  // 端口映射（config/routes/ 下的文件）。
  repeated Exposure routes = 15;
  // 项目是否有状态：只要有一个成员有状态就算。
  bool stateful = 16;
  // 成员，按创建顺序。
  repeated Member members = 17;
  // 项目设置（共享变量是已经部署过的那份）。
  ProjectSettings settings = 18;
  // 共享变量是否有没部署的草稿。
  bool has_shared_env_draft = 19;
  repeated EnvVar shared_env_draft = 20;
}

// ProjectSettings 是项目级的设置。除了共享变量（走草稿）以外，改了立即生效，不进成员的版本。
message ProjectSettings {
  // 共享变量：所有成员的 compose 里都能用 ${变量} 引用，同名时以成员自己的变量为准。
  repeated EnvVar shared_env = 1;
  // 关闭项目内网（默认开启：成员之间用"成员名"或"服务.成员"互相访问）。
  bool intranet_disabled = 2;
  // 加入共享网络时用的网络名（小写字母、数字和 -，本节点唯一）。成员在共享网络里的名字是"成员.网络名"。
  string network_name = 3;
  // 加入的共享网络。
  repeated string shared_networks = 4;
  // 定时快照间隔（分钟），0 表示默认（60 分钟）。
  uint32 snapshot_interval_minutes = 5;
  // 跨节点端口：容器没有声明、但要让相连节点访问的端口，形如"成员:端口"（compose 成员写"服务.成员:端口"）。
  repeated string link_ports = 6;
}

// Member 是项目里独立部署的单位：单容器（镜像表单）或一份 compose。
message Member {
  // 成员名，项目内唯一，创建后不能改。小写字母、数字和 -。
  string name = 1;
  // 修订号：保存这个成员的草稿或部署它时加一。
  int64 revision = 2;
  // 最新版本号。
  int64 latest_version = 3;
  // 最近一次部署的版本号，0 表示从未部署。
  int64 deployed_version = 4;
  google.protobuf.Timestamp created_at = 5;
  // 最新版本的配置。
  MemberConfig config = 6;
  bool has_draft = 7;
  // 草稿内容，has_draft 为 false 时为空。
  MemberConfig draft = 8;
  // 这个成员的 SSH deploy key 公钥，加到 git 仓库的只读 deploy key 里。
  string deploy_key = 9;
  // webhook 令牌：POST 到面板的 /hooks/<令牌> 会拉取并部署这个成员。
  string webhook_token = 10;
  // 最近一次拉取到的 git 提交。
  string last_commit = 11;
  // 实际判定的是否有状态（自动判断或用户指定）。
  bool stateful = 12;
  // 共享变量有更新：这个成员引用的共享变量和它当前版本记的值不一样，下次部署它时用上。
  bool shared_env_outdated = 13;
}

// MemberConfig 是成员一个版本的完整配置。
message MemberConfig {
  // compose 原文。单容器成员由镜像表单生成。
  string compose = 1;
  // 成员级变量：替换这个成员 compose 里的 ${变量}，同名时覆盖项目的共享变量。
  repeated EnvVar env = 2;
  // 服务级环境变量：键是服务名，只注入对应服务的容器。
  map<string, EnvList> service_env = 3;
  // 单容器成员才有。有它时 compose 由它生成，服务名就是成员名。
  ImageForm form = 4;
  reserved 5;
  // 文件来源。为空表示文件由用户自己放进成员的 data/。
  Source source = 6;
  // 更新文件时保留不动的路径（相对成员的 data/），例如 uploads/。
  // compose 里挂载进容器的 data/ 下的目录会自动保留，不需要写在这里。
  repeated string preserve = 7;
  // 是否有状态。默认自动判断：用了命名 volume 或有保留路径的成员算有状态。
  Stateful stateful = 8;
  reserved 9;
  // 一起部署时要先部署的成员（例如后端依赖数据库）。
  repeated string depends_on = 10;
}

enum Stateful {
  STATEFUL_AUTO = 0;
  STATEFUL_YES = 1;
  STATEFUL_NO = 2;
}

// Version 是成员的一次部署：配置 + 文件 + 镜像摘要。
message Version {
  int64 version = 1;
  google.protobuf.Timestamp created_at = 2;
  // 部署成功的时间，部署失败时为空。
  google.protobuf.Timestamp deployed_at = 3;
  // 服务名 → 部署时实际使用的镜像（带摘要）。
  map<string, string> images = 4;
  // 是否保存了这个版本的文件（data/ 中除保留路径以外的内容）。
  bool has_files = 5;
  // 回滚生成的版本：回滚到的那个版本号。
  int64 rollback_of = 6;
  // 部署时拉取的 git 提交。
  string commit = 7;
  string member = 8;
}

// Deployment 是项目的一条部署记录：一次部署（一个或多个成员）完成后所有成员各自的版本。
message Deployment {
  int64 id = 1;
  google.protobuf.Timestamp time = 2;
  // manual（手动）、git（webhook 拉取）、image（镜像更新）、rollback（成员回滚）、
  // shared_env（部署共享变量）、restore（回到某次部署时的状态）。
  string source = 3;
  // 这次部署动到的成员。
  repeated string members = 4;
  // 部署完成后所有成员各自的版本（没部署成功过的成员不在里面）。
  map<string, int64> versions = 5;
  bool success = 6;
  string error = 7;
  // 回到某次部署时的状态：那次部署的 ID。
  int64 restore_of = 8;
}

// SharedNetwork 是节点上的一个共享网络，加入的项目之间可以互相访问。
message SharedNetwork {
  string name = 1;
  string subnet = 2;
  repeated SharedNetworkProject projects = 3;
  // 跨节点连接：和本节点的这个网络相连的节点。
  repeated SharedNetworkPeer peers = 4;
  // 相连节点上的成员，本节点为每个放了一个同名的代理容器。
  repeated SharedNetworkRemote remotes = 5;
}

message SharedNetworkPeer {
  // 节点的 mesh 公钥。
  bytes public_key = 1;
  string name = 2;
  string node_id = 3;
  // 最近一次向它查询成员列表是否成功。
  bool reachable = 4;
  string error = 5;
}

message SharedNetworkRemote {
  // 在网络里的名字，例如 pg.base。
  string alias = 1;
  string node_name = 2;
  string project_name = 3;
  repeated uint32 ports = 4;
}

message SharedNetworkProject {
  string project_id = 1;
  string project_name = 2;
  // 项目的网络名，成员在共享网络里叫"成员.网络名"。
  string network_name = 3;
}

// Snapshot 是项目的一份快照。
message Snapshot {
  string id = 1;
  // scheduled：定时；manual：手动；predeploy：部署前的数据；version：版本文件。
  string kind = 2;
  google.protobuf.Timestamp time = 3;
  int64 size = 4;
  // predeploy：部署前正在运行的版本；version：所属版本。
  int64 version = 5;
  // predeploy、version：所属成员。
  string member = 6;
}

message Source {
  // git 仓库地址，支持 SSH（用项目的 deploy key）和 HTTPS（公开仓库）。
  string git_url = 1;
  // 分支或标签，为空时用仓库默认分支。
  string git_ref = 2;
}

// Exposure 是一条端口映射：一个服务端口的对外开放方式。
// 每条映射是项目目录 config/routes/<name>.yml 一个文件，改了立即生效，不需要重新部署。
message Exposure {
  // 服务名。单容器成员可以不填（服务名就是成员名）。
  string service = 1;
  // 容器内的端口。
  uint32 target = 2;
  // http、tcp 或 udp。
  string protocol = 3;
  // 节点上对外的端口。tcp/udp 必填；http 没绑域名时必填。
  uint32 published = 4;
  // 绑定的域名，只用于 http。绑了域名后经 80/443 访问，自动申请证书并跳转 HTTPS。
  repeated string domains = 5;
  // 只开 HTTP，不申请证书、不跳转（例如前面还有 CDN 终结 HTTPS）。
  bool http_only = 6;
  // 映射文件名（不含 .yml）。新建时为空，由节点生成。
  string name = 7;
  // 文件无效时的原因，这条映射不会生效。只读。
  string error = 8;
  // 成员名。
  string member = 9;
}

message EnvVar {
  string key = 1;
  string value = 2;
  // 密钥：界面上默认隐藏。
  bool secret = 3;
}

message EnvList {
  repeated EnvVar vars = 1;
}

// ImageForm：直接运行一个镜像，文件可选。
message ImageForm {
  string image = 1;
  // 运行命令，为空时使用镜像默认命令。
  string command = 2;
  repeated PortMapping ports = 3;
  // 持久化目录：容器内的路径，数据落到成员目录的 volumes/ 下。
  repeated string volumes = 4;
  // 把成员的 data/ 挂到容器内的这个路径作为工作目录；为空表示不挂载文件。
  string workdir = 5;
  // 环境变量，直接注入容器。
  repeated EnvVar env = 6;
  // 内存上限（MB），0 表示不限制。
  uint32 memory_mb = 7;
  // CPU 上限（核数，可以是小数，例如 0.5），0 表示不限制。
  double cpus = 8;
  // 健康检查命令（在容器里用 sh -c 执行，退出码 0 表示健康），为空表示不检查。
  string health_command = 9;
  // 健康检查间隔（秒），0 表示默认 30 秒。
  uint32 health_interval_seconds = 10;
}

message PortMapping {
  // 节点上对外的端口。
  uint32 published = 1;
  // 容器内的端口。
  uint32 target = 2;
  // tcp 或 udp，默认 tcp。
  string protocol = 3;
}

message ServiceStatus {
  string name = 1;
  string container_id = 2;
  string image = 3;
  // 容器状态：running、exited、restarting、paused、created、dead。
  string state = 4;
  // Docker 给出的可读状态，例如 "Up 3 minutes"。
  string status = 5;
  // 健康检查状态：healthy、unhealthy、starting，没有健康检查时为空。
  string health = 6;
  string member = 7;
}

message ProjectStatus {
  repeated ServiceStatus services = 1;
  // 有新版本的镜像（每天检查一次）。
  repeated ImageUpdate image_updates = 2;
  google.protobuf.Timestamp images_checked_at = 3;
}

// ImageUpdate 是一个服务的镜像有新版本：标签没变，仓库里的摘要变了。
message ImageUpdate {
  string service = 1;
  string image = 2;
  string current_digest = 3;
  string latest_digest = 4;
  string member = 5;
}

message ProjectSummary {
  Project project = 1;
  ProjectStatus status = 2;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
  string docker_version = 5;
  string compose_version = 6;
  // 面板自带的节点（面板绑定域名时由它的 Caddy 反代面板）。
  bool embedded = 7;
}

message LogLine {
  string service = 1;
  // stdout 或 stderr。
  string stream = 2;
  string text = 3;
  google.protobuf.Timestamp time = 4;
  string member = 5;
}

message DeployEvent {
  oneof event {
    // 部署过程中的一行输出。
    string output = 1;
    DeployResult result = 2;
  }
}

message DeployResult {
  bool success = 1;
  string error = 2;
  int64 version = 3;
  // 用配置备份重建时新项目的 ID（项目建好了就有，部署失败也有）。
  string project_id = 4;
}

// MetricSeries 是一条监控序列，times（Unix 秒）和 values 一一对应。
message MetricSeries {
  string name = 1;
  repeated int64 times = 2;
  repeated double values = 3;
}
// AlertChannel 是一个告警渠道。
message AlertChannel {
  string id = 1;
  string name = 2;
  // webhook 或 telegram。
  string type = 3;
  // webhook：POST JSON 的地址。
  string url = 4;
  // telegram：机器人令牌和聊天 ID。
  string telegram_token = 5;
  string telegram_chat_id = 6;
}

// AlertRules 是告警规则的阈值，0 表示用默认值。
message AlertRules {
  // 磁盘使用超过这个百分比，默认 90。
  uint32 disk_percent = 1;
  // 内存使用超过这个百分比并持续 mem_minutes 分钟，默认 90% / 5 分钟。
  uint32 mem_percent = 2;
  uint32 mem_minutes = 3;
  // 容器在 restart_minutes 分钟内重启 restart_count 次，默认 3 次 / 10 分钟。
  uint32 restart_count = 4;
  uint32 restart_minutes = 5;
  // 证书在这么多天内过期，默认 7。
  uint32 cert_days = 6;
  // 节点失联超过这么多秒，默认 60。
  uint32 offline_seconds = 7;
  // 一条 http 规则最近 5 分钟的 5xx 比例超过这个百分比（至少 20 个请求），默认 5。
  uint32 error_percent = 8;
}

message AlertConfig {
  repeated AlertChannel channels = 1;
  AlertRules rules = 2;
}

// Alert 是一条告警或恢复通知。
message Alert {
  // 同一个问题的唯一标识，例如 disk、cert:example.com。
  string key = 1;
  // firing：出现；resolved：已恢复。
  string status = 2;
  string title = 3;
  string message = 4;
  string node = 5;
  string project = 6;
  google.protobuf.Timestamp time = 7;
}
// TrustedPanel 是节点信任列表里的一个面板。
message TrustedPanel {
  string address = 1;
  string fingerprint = 2;
  // 节点当前是否连着这个面板。
  bool connected = 3;
  // 是不是当前操作的这个面板（只由面板接口填写）。
  bool is_self = 4;
}

// MeshPeer 是面板告诉节点的一个 mesh 成员。
message MeshPeer {
  bytes public_key = 1;
  // 可以尝试直连的 UDP 地址（ip:port）。
  repeated string endpoints = 2;
  string name = 3;
  // 节点 ID；面板为空。
  string node_id = 4;
  bool is_panel = 5;
}

// MeshPeerStatus 是到一个 mesh 成员的连接状态。
message MeshPeerStatus {
  bytes public_key = 1;
  string name = 2;
  // mesh 地址（IPv6）。
  string address = 3;
  // direct（UDP 直连）、link（直接经控制连接）、udp-relay（UDP 经面板中转）、tls-relay（经面板的控制连接中转）、none。
  string path = 4;
  // 直连时的对方地址。
  string endpoint = 5;
  // 中转时经过的面板。
  string via = 6;
  double rtt_ms = 7;
  google.protobuf.Timestamp last_handshake = 8;
  uint64 rx_bytes = 9;
  uint64 tx_bytes = 10;
}

message MeshStatus {
  bytes public_key = 1;
  string address = 2;
  uint32 port = 3;
  repeated string endpoints = 4;
  repeated MeshPeerStatus peers = 5;
}

message MeshPingRequest {
  bytes public_key = 1;
}

message MeshPingResponse {
  double rtt_ms = 1;
}

// BackupStatus 是项目同步到备份节点的状态（在源节点上）。
message BackupStatus {
  // 没有设置备份节点时为空。
  string target_node_id = 1;
  string target_name = 2;
  google.protobuf.Timestamp last_sync = 3;
  // 最近一次同步失败的原因，成功时为空。
  string last_error = 4;
  // 正在同步。
  bool syncing = 5;
}

// Replica 是备份节点上保存的一个项目副本。
message Replica {
  string project_id = 1;
  string project_name = 2;
  string source_node_id = 3;
  string source_name = 4;
  google.protobuf.Timestamp last_sync = 5;
  int64 bytes = 6;
}

// FailoverMember 是顶替设置里的一个参与者。
message FailoverMember {
  // mesh 公钥。
  bytes key = 1;
  // 节点 ID；面板为空。
  string node_id = 2;
  string name = 3;
  // 项目在这个节点上的目录（只有 A、B 有）。
  string dir = 4;
}

// FailoverConfig 是项目的顶替设置，A、B 和见证人各存一份，内容相同。
message FailoverConfig {
  string project_id = 1;
  string project_name = 2;
  // 能运行项目的两个节点。设置时 A 是项目所在的节点，B 是顶替节点；之后谁运行由租约决定。
  FailoverMember a = 3;
  FailoverMember b = 4;
  // 见证人：一个面板或另一台节点，只投票。
  FailoverMember witness = 5;
  bool witness_is_panel = 6;
  // 租约时长（秒），默认 30，每 1/3 续约一次。
  uint32 lease_seconds = 7;
  // 有状态项目也自动顶替（接受丢失最后一次快照之后的数据）。默认只告警，等用户确认。
  bool auto_stateful = 8;
}

// FailoverStatus 是某个参与者看到的顶替状态。
message FailoverStatus {
  FailoverConfig config = 1;
  // holder（运行项目）、standby（热备）或 witness（见证人）。
  string role = 2;
  // 当前持有租约的节点。
  string holder_name = 3;
  uint64 epoch = 4;
  // 持有者：租约还剩多久（毫秒），0 表示已经续不上、项目已停止。
  int64 lease_remaining_ms = 5;
  // 热备：持有者失联，等待用户确认顶替（有状态项目）。
  bool pending_confirm = 6;
  // 热备最近一次收到同步的时间（热备上）或最近一次同步给热备的时间（持有者上）。
  google.protobuf.Timestamp last_sync = 7;
  string last_error = 8;
  bool stateful = 9;
  // 当前持有租约的节点的 mesh 公钥。
  bytes holder_key = 10;
}
