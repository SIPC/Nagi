syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// Project 是节点上保存的项目。项目数据以节点为准。
message Project {
  // 全局唯一的项目 ID。
  string id = 1;
  // 显示名称，可以重名。
  string name = 2;
  // 项目目录，例如 /mnt/qmt。
  string dir = 3;
  // 修订号：每次保存草稿或部署都加一，用于多面板冲突检测。
  int64 revision = 4;
  // 最新版本号。
  int64 latest_version = 5;
  // 最近一次部署的版本号，0 表示从未部署。
  int64 deployed_version = 6;
  reserved 7;
  google.protobuf.Timestamp created_at = 8;
  // 最新版本的配置。
  ProjectConfig config = 9;
  // 是否有未部署的草稿。
  bool has_draft = 10;
  // 草稿内容，has_draft 为 false 时为空。
  ProjectConfig draft = 11;
  // 项目的 SSH deploy key 公钥，加到 git 仓库的只读 deploy key 里。
  string deploy_key = 12;
  // webhook 令牌：POST 到面板的 /hooks/<令牌> 会拉取并部署。
  string webhook_token = 13;
  // 最近一次拉取到的 git 提交。
  string last_commit = 14;
  // 端口映射（config/routes/ 下的文件）。
  repeated Exposure routes = 15;
}

// ProjectConfig 是一个版本的完整配置。
message ProjectConfig {
  // compose 原文。用镜像表单创建的项目，由表单生成。
  string compose = 1;
  // 项目级变量：替换 compose 里的 ${变量}。
  repeated EnvVar env = 2;
  // 服务级环境变量：键是服务名，只注入对应服务的容器。
  map<string, EnvList> service_env = 3;
  // 用镜像表单创建的项目才有。有它时 compose 由它生成。
  ImageForm form = 4;
  // 原来的对外开放设置，已移到项目目录的 config/routes/（见 Project.routes）。
  reserved 5;
  // 项目文件的来源。为空表示文件由用户自己放进 data/。
  Source source = 6;
  // 更新文件时保留不动的路径（相对 data/），例如 uploads/。
  // compose 里挂载进容器的 data/ 下的目录会自动保留，不需要写在这里。
  repeated string preserve = 7;
}

message Source {
  // git 仓库地址，支持 SSH（用项目的 deploy key）和 HTTPS（公开仓库）。
  string git_url = 1;
  // 分支或标签，为空时用仓库默认分支。
  string git_ref = 2;
}

// Exposure 是一条端口映射：一个服务端口的对外开放方式。
// 每条映射是项目目录 config/routes/<name>.yml 一个文件，改了立即生效，不需要重新部署。
message Exposure {
  string service = 1;
  // 容器内的端口。
  uint32 target = 2;
  // http、tcp 或 udp。
  string protocol = 3;
  // 节点上对外的端口。tcp/udp 必填；http 没绑域名时必填。
  uint32 published = 4;
  // 绑定的域名，只用于 http。绑了域名后经 80/443 访问，自动申请证书并跳转 HTTPS。
  repeated string domains = 5;
  // 只开 HTTP，不申请证书、不跳转（例如前面还有 CDN 终结 HTTPS）。
  bool http_only = 6;
  // 映射文件名（不含 .yml）。新建时为空，由节点生成。
  string name = 7;
  // 文件无效时的原因，这条映射不会生效。只读。
  string error = 8;
}

message EnvVar {
  string key = 1;
  string value = 2;
  // 密钥：界面上默认隐藏。
  bool secret = 3;
}

message EnvList {
  repeated EnvVar vars = 1;
}

// ImageForm：直接运行一个镜像，文件可选。
message ImageForm {
  string image = 1;
  // 运行命令，为空时使用镜像默认命令。
  string command = 2;
  repeated PortMapping ports = 3;
  // 持久化目录：容器内的路径，数据落到项目目录的 volumes/ 下。
  repeated string volumes = 4;
  // 把项目的 data/ 挂到容器内的这个路径作为工作目录；为空表示不挂载文件。
  string workdir = 5;
  // 环境变量，直接注入容器。
  repeated EnvVar env = 6;
}

message PortMapping {
  // 节点上对外的端口。
  uint32 published = 1;
  // 容器内的端口。
  uint32 target = 2;
  // tcp 或 udp，默认 tcp。
  string protocol = 3;
}

message ServiceStatus {
  string name = 1;
  string container_id = 2;
  string image = 3;
  // 容器状态：running、exited、restarting、paused、created、dead。
  string state = 4;
  // Docker 给出的可读状态，例如 "Up 3 minutes"。
  string status = 5;
  // 健康检查状态：healthy、unhealthy、starting，没有健康检查时为空。
  string health = 6;
}

message ProjectStatus {
  repeated ServiceStatus services = 1;
}

message ProjectSummary {
  Project project = 1;
  ProjectStatus status = 2;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
  string docker_version = 5;
  string compose_version = 6;
}

message LogLine {
  string service = 1;
  // stdout 或 stderr。
  string stream = 2;
  string text = 3;
  google.protobuf.Timestamp time = 4;
}

message DeployEvent {
  oneof event {
    // 部署过程中的一行输出。
    string output = 1;
    DeployResult result = 2;
  }
}

message DeployResult {
  bool success = 1;
  string error = 2;
  int64 version = 3;
}
