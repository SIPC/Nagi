syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// Project 是面板上的项目：一组一起工作的容器。项目不属于哪台机器，每个容器各自指定节点运行。
// 项目和容器的配置、版本记录、部署记录以面板为准（见 docs/panel.md#项目数据）。
message Project {
  // 全局唯一的项目 ID。
  string id = 1;
  // 显示名称，可以重名。
  string name = 2;
  // 网络名：面板上唯一，小写字母、数字和 -。连接本项目的项目用"容器.网络名"访问本项目的容器。
  string network_name = 3;
  // 项目设置的修订号：修改名称、网络名、共享变量（草稿）、设置时加一，用于冲突检测。
  // 容器有自己的修订号（Container.revision）。
  int64 revision = 4;
  google.protobuf.Timestamp created_at = 5;
  // 端口映射（所有容器的）。
  repeated Exposure routes = 6;
  // 项目是否有状态：只要有一个容器有状态就算。
  bool stateful = 7;
  // 容器，按创建顺序。
  repeated Container containers = 8;
  // 项目设置（共享变量是已经部署过的那份）。
  ProjectSettings settings = 9;
  // 共享变量是否有没部署的草稿。
  bool has_shared_env_draft = 10;
  repeated EnvVar shared_env_draft = 11;
  // 已连接的项目（见 docs/agent.md#项目连接）。
  repeated LinkedProject links = 12;
}

message LinkedProject {
  string project_id = 1;
  string name = 2;
  string network_name = 3;
}

// ProjectSettings 是项目级的设置。除了共享变量（走草稿）以外，改了立即生效，不进容器的版本。
message ProjectSettings {
  // 共享变量：所有容器的 compose 里都能用 ${变量} 引用，同名时以容器自己的变量为准。
  repeated EnvVar shared_env = 1;
  // 定时快照间隔（分钟），0 表示默认（60 分钟）。对项目里的所有容器生效。
  uint32 snapshot_interval_minutes = 2;
  // 内部端口：容器没有声明、但要让别的节点上的容器访问的端口，形如"容器:端口"（容器组写"服务.容器组:端口"）。
  repeated string internal_ports = 3;
}

// Container 是项目里独立部署的单位：单个容器（镜像表单），或者容器组（一份 compose，里面有几个容器）。
// 每个容器指定一个节点运行，各自部署、记版本、回滚、快照。
message Container {
  // 容器名，项目内唯一，创建后不能改。小写字母、数字和 -。
  string name = 1;
  // 修订号：保存这个容器的草稿或部署它时加一。
  int64 revision = 2;
  // 最新版本号。
  int64 latest_version = 3;
  // 最近一次部署的版本号，0 表示从未部署。
  int64 deployed_version = 4;
  google.protobuf.Timestamp created_at = 5;
  // 最新版本的配置。
  ContainerConfig config = 6;
  bool has_draft = 7;
  // 草稿内容，has_draft 为 false 时为空。
  ContainerConfig draft = 8;
  // 这个容器的 SSH deploy key 公钥，加到 git 仓库的只读 deploy key 里。
  string deploy_key = 9;
  // webhook 令牌：POST 到面板的 /hooks/<令牌> 会拉取并部署这个容器。
  string webhook_token = 10;
  // 最近一次拉取到的 git 提交。
  string last_commit = 11;
  // 实际判定的是否有状态（自动判断或用户指定）。
  bool stateful = 12;
  // 共享变量有更新：这个容器引用的共享变量和它当前版本记的值不一样，下次部署它时用上。
  bool shared_env_outdated = 13;
  // 不在快照范围内的命名 volume（external 或用了自定义 driver），按最新版本的配置算。
  repeated string unmanaged_volumes = 14;
  // 用 network_mode: host 的服务：不经过 Caddy、不在项目内网里，端口直接对外。
  repeated string host_network_services = 15;
  // single：单个容器（镜像表单）；group：容器组（一份 compose，里面有几个容器）。
  string kind = 16;
  // 容器所在的节点。
  string node_id = 17;
  // 容器在节点上的目录。
  string dir = 18;
  // 备份节点（见 docs/snapshot.md#异地副本），为空表示没有设置。
  string backup_node_id = 19;
  // 同步到备份节点的状态（容器所在节点上报的）。
  BackupStatus backup = 20;
  // 顶替设置（见 docs/failover.md），为空表示没有设置。
  FailoverConfig failover = 21;
  // 持有租约的节点和热备上报的顶替状态（节点不在线时为空）。
  FailoverStatus failover_holder = 22;
  FailoverStatus failover_standby = 23;
}

// ContainerConfig 是容器一个版本的完整配置。
message ContainerConfig {
  // compose 原文。单个容器由镜像表单生成。
  string compose = 1;
  // 容器级变量：替换这个容器 compose 里的 ${变量}，同名时覆盖项目的共享变量。
  repeated EnvVar env = 2;
  // 服务级环境变量：键是服务名，只注入对应服务的容器。
  map<string, EnvList> service_env = 3;
  // 单个容器才有。有它时 compose 由它生成，服务名就是容器名。
  ImageForm form = 4;
  reserved 5;
  // 文件来源。为空表示文件由用户自己放进容器的 data/。
  Source source = 6;
  // 更新文件时保留不动的路径（相对容器的 data/），例如 uploads/。
  // compose 里挂载进容器的 data/ 下的目录会自动保留，不需要写在这里。
  repeated string preserve = 7;
  // 是否有状态。默认自动判断：用了命名 volume 或有保留路径的容器算有状态。
  Stateful stateful = 8;
  reserved 9;
  // 一起部署时要先部署的容器（例如后端依赖数据库）。
  repeated string depends_on = 10;
}

enum Stateful {
  STATEFUL_AUTO = 0;
  STATEFUL_YES = 1;
  STATEFUL_NO = 2;
}

// Version 是容器的一次部署：配置 + 文件 + 镜像摘要。
message Version {
  int64 version = 1;
  google.protobuf.Timestamp created_at = 2;
  // 部署成功的时间，部署失败时为空。
  google.protobuf.Timestamp deployed_at = 3;
  // 服务名 → 部署时实际使用的镜像（带摘要）。
  map<string, string> images = 4;
  // 是否保存了这个版本的文件（data/ 中除保留路径以外的内容）。
  bool has_files = 5;
  // 回滚生成的版本：回滚到的那个版本号。
  int64 rollback_of = 6;
  // 部署时拉取的 git 提交。
  string commit = 7;
  string container = 8;
}

// Deployment 是项目的一条部署记录：一次部署（一个或多个容器）完成后所有容器各自的版本。
message Deployment {
  int64 id = 1;
  google.protobuf.Timestamp time = 2;
  // manual（手动）、git（webhook 拉取）、image（镜像更新）、rollback（容器回滚）、
  // shared_env（部署共享变量）、restore（回到某次部署时的状态）。
  string source = 3;
  // 这次部署动到的容器。
  repeated string containers = 4;
  // 部署完成后所有容器各自的版本（没部署成功过的容器不在里面）。
  map<string, int64> versions = 5;
  bool success = 6;
  string error = 7;
  // 回到某次部署时的状态：那次部署的 ID。
  int64 restore_of = 8;
}

// Snapshot 是容器的一份快照。
message Snapshot {
  string id = 1;
  // scheduled：定时；manual：手动；predeploy：部署前的数据；version：版本文件。
  string kind = 2;
  google.protobuf.Timestamp time = 3;
  int64 size = 4;
  // predeploy：部署前正在运行的版本；version：所属版本。
  int64 version = 5;
  string container = 6;
}

message Source {
  // git 仓库地址，支持 SSH（用项目的 deploy key）和 HTTPS（公开仓库）。
  string git_url = 1;
  // 分支或标签，为空时用仓库默认分支。
  string git_ref = 2;
}

// Exposure 是一条端口映射：一个服务端口的对外开放方式。映射属于容器，开在容器所在的节点上，
// 存在面板上，改了立即生效，不需要重新部署。
message Exposure {
  // 服务名。单个容器可以不填（服务名就是容器名）。
  string service = 1;
  // 容器内的端口。
  uint32 target = 2;
  // http、tcp 或 udp。
  string protocol = 3;
  // 节点上对外的端口。tcp/udp 必填；http 没绑域名时必填。
  uint32 published = 4;
  // 绑定的域名，只用于 http。绑了域名后经 80/443 访问，自动申请证书并跳转 HTTPS。
  repeated string domains = 5;
  // 只开 HTTP，不申请证书、不跳转（例如前面还有 CDN 终结 HTTPS）。
  bool http_only = 6;
  // 映射名，项目内唯一。新建时为空，由面板生成。
  string name = 7;
  // 映射无效时的原因（例如容器已经删除），这条映射不会生效。只读。
  string error = 8;
  // 容器名。
  string container = 9;
}

message EnvVar {
  string key = 1;
  string value = 2;
  // 密钥：界面上默认隐藏。
  bool secret = 3;
}

message EnvList {
  repeated EnvVar vars = 1;
}

// ImageForm：直接运行一个镜像，文件可选。
message ImageForm {
  string image = 1;
  // 运行命令，为空时使用镜像默认命令。
  string command = 2;
  repeated PortMapping ports = 3;
  // 持久化目录：容器内的路径，数据落到容器目录的 volumes/ 下。
  repeated string volumes = 4;
  // 把容器的 data/ 挂到容器内的这个路径作为工作目录；为空表示不挂载文件。
  string workdir = 5;
  // 环境变量，直接注入容器。
  repeated EnvVar env = 6;
  // 内存上限（MB），0 表示不限制。
  uint32 memory_mb = 7;
  // CPU 上限（核数，可以是小数，例如 0.5），0 表示不限制。
  double cpus = 8;
  // 健康检查命令（在容器里用 sh -c 执行，退出码 0 表示健康），为空表示不检查。
  string health_command = 9;
  // 健康检查间隔（秒），0 表示默认 30 秒。
  uint32 health_interval_seconds = 10;
}

message PortMapping {
  // 节点上对外的端口。
  uint32 published = 1;
  // 容器内的端口。
  uint32 target = 2;
  // tcp 或 udp，默认 tcp。
  string protocol = 3;
}

message ServiceStatus {
  string name = 1;
  string container_id = 2;
  string image = 3;
  // 容器状态：running、exited、restarting、paused、created、dead。
  string state = 4;
  // Docker 给出的可读状态，例如 "Up 3 minutes"。
  string status = 5;
  // 健康检查状态：healthy、unhealthy、starting，没有健康检查时为空。
  string health = 6;
  string container = 7;
  // 容器声明的 TCP 端口（镜像的 EXPOSE、compose 的 ports、expose），别的节点上的容器经代理访问时用。
  repeated uint32 ports = 8;
}

message ProjectStatus {
  repeated ServiceStatus services = 1;
  // 有新版本的镜像（每天检查一次）。
  repeated ImageUpdate image_updates = 2;
  google.protobuf.Timestamp images_checked_at = 3;
}

// ImageUpdate 是一个服务的镜像有新版本：标签没变，仓库里的摘要变了。
message ImageUpdate {
  string service = 1;
  string image = 2;
  string current_digest = 3;
  string latest_digest = 4;
  string container = 5;
}

message ProjectSummary {
  Project project = 1;
  ProjectStatus status = 2;
}

// ContainerSpec 是面板下发给节点的一个容器的完整配置，节点照着运行，并缓存在本地：
// 面板不可达时用它重启、恢复、顶替；面板丢失时新面板用它把项目拼回来。
message ContainerSpec {
  string project_id = 1;
  string project_name = 2;
  string network_name = 3;
  string name = 4;
  // 容器在本节点上的目录。
  string dir = 5;
  // 容器的修订号和项目的修订号（缓存按修订号取新的）。
  int64 revision = 6;
  int64 project_revision = 7;
  // 要运行的版本：部署时是新版本，其余时候是当前部署的版本。0 表示还没部署过。
  int64 version = 8;
  ContainerConfig config = 9;
  // 这个版本用的共享变量。
  repeated EnvVar shared_env = 10;
  // 服务名 → 固定使用的镜像（带摘要）。回滚、恢复时用版本记录的摘要；为空时按 compose 里的镜像。
  map<string, string> images = 11;
  // 端口映射（只有这个容器的）。
  repeated Exposure routes = 12;
  // git 用的 deploy key 私钥（OpenSSH 格式）和公钥。
  bytes deploy_key = 13;
  string deploy_key_pub = 14;
  // 项目登录过的私有仓库（docker 的 config.json），为空时用机器全局的配置。
  bytes docker_config = 15;
  // 快照仓库的密码。
  string backup_password = 16;
  // 定时快照间隔（分钟），0 表示默认 60。
  uint32 snapshot_interval_minutes = 17;
  // 是否有状态（面板按配置判定）。
  bool stateful = 18;
  // 备份节点：每次定时快照后把快照仓库同步过去。为空表示没有设置。
  BackupTarget backup = 19;
  // 下发这份配置的面板（公钥指纹）。面板看到节点上的配置是别的面板写的，就知道自己的旧了，以节点的为准。
  string panel = 20;
  // 项目设置里的内部端口（换面板时据此拼回项目设置）。
  repeated string internal_ports = 21;
}

// BackupTarget 是接收副本的节点。
message BackupTarget {
  string node_id = 1;
  string name = 2;
  // mesh 公钥。
  bytes key = 3;
}

// ContainerStatus 是节点上报的一个容器的运行状态。
message ContainerStatus {
  string project_id = 1;
  string name = 2;
  repeated ServiceStatus services = 3;
  // 有新版本的镜像（每天检查一次）。
  repeated ImageUpdate image_updates = 4;
  google.protobuf.Timestamp images_checked_at = 5;
  // 节点上缓存的修订号，面板据此判断要不要补推配置。
  int64 revision = 6;
  int64 project_revision = 7;
  // 读取或运行这个容器出错（例如磁盘满了、目录不见了）。
  string error = 8;
  // 同步到备份节点的状态，没有设置备份节点时为空。
  BackupStatus backup = 9;
  // 缓存的配置是哪个面板下发的（ContainerSpec.panel）。
  string panel = 10;
}

// NodeUsage 是节点当前的资源占用（百分比，0~100）。
message NodeUsage {
  double cpu = 1;
  double memory = 2;
  // 数据目录所在的磁盘。
  double disk = 3;
}

message NodeInfo {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
  string docker_version = 5;
  string compose_version = 6;
  // 面板自带的节点（面板绑定域名时由它的 Caddy 反代面板）。
  bool embedded = 7;
  // 项目根目录：容器目录默认是 <项目根目录>/<项目名的拼音>/<容器名>。
  string projects_root = 8;
}

message LogLine {
  string service = 1;
  // stdout 或 stderr。
  string stream = 2;
  string text = 3;
  google.protobuf.Timestamp time = 4;
  string container = 5;
}

message DeployEvent {
  oneof event {
    // 部署过程中的一行输出。
    string output = 1;
    DeployResult result = 2;
  }
}

message DeployResult {
  bool success = 1;
  string error = 2;
  int64 version = 3;
  reserved 4;
  // 节点部署一个容器后返回：服务名 → 实际使用的镜像（带摘要）、拉取到的 git 提交、是否保存了版本文件。
  map<string, string> images = 5;
  string commit = 6;
  bool has_files = 7;
  // RestoreReplica：容器已经放到了本节点上（文件恢复好了，启动失败也算）。
  bool placed = 8;
}

// MetricSeries 是一条监控序列，times（Unix 秒）和 values 一一对应。
message MetricSeries {
  string name = 1;
  repeated int64 times = 2;
  repeated double values = 3;
}
// AlertChannel 是一个告警渠道。
message AlertChannel {
  string id = 1;
  string name = 2;
  // webhook 或 telegram。
  string type = 3;
  // webhook：POST JSON 的地址。
  string url = 4;
  // telegram：机器人令牌和聊天 ID。
  string telegram_token = 5;
  string telegram_chat_id = 6;
}

// AlertRules 是告警规则的阈值，0 表示用默认值。
message AlertRules {
  // 磁盘使用超过这个百分比，默认 90。
  uint32 disk_percent = 1;
  // 内存使用超过这个百分比并持续 mem_minutes 分钟，默认 90% / 5 分钟。
  uint32 mem_percent = 2;
  uint32 mem_minutes = 3;
  // 容器在 restart_minutes 分钟内重启 restart_count 次，默认 3 次 / 10 分钟。
  uint32 restart_count = 4;
  uint32 restart_minutes = 5;
  // 证书在这么多天内过期，默认 7。
  uint32 cert_days = 6;
  // 节点失联超过这么多秒，默认 60。
  uint32 offline_seconds = 7;
  // 一条 http 规则最近 5 分钟的 5xx 比例超过这个百分比（至少 20 个请求），默认 5。
  uint32 error_percent = 8;
}

message AlertConfig {
  repeated AlertChannel channels = 1;
  AlertRules rules = 2;
}

// Alert 是一条告警或恢复通知。
message Alert {
  // 同一个问题的唯一标识，例如 disk、cert:example.com。
  string key = 1;
  // firing：出现；resolved：已恢复。
  string status = 2;
  string title = 3;
  string message = 4;
  string node = 5;
  string project = 6;
  google.protobuf.Timestamp time = 7;
}
// TrustedPanel 是节点信任列表里的一个面板。
message TrustedPanel {
  string address = 1;
  string fingerprint = 2;
  // 节点当前是否连着这个面板。
  bool connected = 3;
  // 是不是当前操作的这个面板（只由面板接口填写）。
  bool is_self = 4;
  // 主备面板里的角色："primary"、"standby"；不在主备面板里时为空（见 docs/standby.md）。
  string role = 5;
}

// MeshPeer 是面板告诉节点的一个 mesh 成员。
message MeshPeer {
  bytes public_key = 1;
  // 可以尝试直连的 UDP 地址（ip:port）。
  repeated string endpoints = 2;
  string name = 3;
  // 节点 ID；面板为空。
  string node_id = 4;
  bool is_panel = 5;
}

// MeshPeerStatus 是到一个 mesh 成员的连接状态。
message MeshPeerStatus {
  bytes public_key = 1;
  string name = 2;
  // mesh 地址（IPv6）。
  string address = 3;
  // direct（UDP 直连）、link（直接经控制连接）、udp-relay（UDP 经面板中转）、tls-relay（经面板的控制连接中转）、none。
  string path = 4;
  // 直连时的对方地址。
  string endpoint = 5;
  // 中转时经过的面板。
  string via = 6;
  double rtt_ms = 7;
  google.protobuf.Timestamp last_handshake = 8;
  uint64 rx_bytes = 9;
  uint64 tx_bytes = 10;
}

message MeshStatus {
  bytes public_key = 1;
  string address = 2;
  uint32 port = 3;
  repeated string endpoints = 4;
  repeated MeshPeerStatus peers = 5;
}

message MeshPingRequest {
  bytes public_key = 1;
}

message MeshPingResponse {
  double rtt_ms = 1;
}

// BackupStatus 是容器同步到备份节点的状态（在源节点上）。
message BackupStatus {
  string target_node_id = 1;
  string target_name = 2;
  // 最近一次同步成功的时间。
  google.protobuf.Timestamp last_sync = 3;
  // 最近一次同步失败的原因，成功时为空。
  string last_error = 4;
  // 正在同步。
  bool syncing = 5;
}

// Replica 是备份节点上保存的一个容器副本。
message Replica {
  string project_id = 1;
  string container = 7;
  string project_name = 2;
  string source_node_id = 3;
  string source_name = 4;
  google.protobuf.Timestamp last_sync = 5;
  int64 bytes = 6;
}

// FailoverParticipant 是顶替设置里的一个参与者。
message FailoverParticipant {
  // mesh 公钥。
  bytes key = 1;
  // 节点 ID；面板为空。
  string node_id = 2;
  string name = 3;
  // 容器在这个节点上的目录（只有 A、B 有）。
  string dir = 4;
}

// FailoverConfig 是一个容器的顶替设置，A、B 和见证人各存一份，内容相同。
message FailoverConfig {
  string project_id = 1;
  string project_name = 2;
  string container = 10;
  // 能运行容器的两个节点。设置时 A 是容器所在的节点（原节点），B 是顶替节点；之后谁运行由租约决定。
  FailoverParticipant a = 3;
  FailoverParticipant b = 4;
  // 见证人：一个面板或另一台节点，只投票。
  FailoverParticipant witness = 5;
  bool witness_is_panel = 6;
  // 租约时长（秒），默认 30，每 1/3 续约一次。
  uint32 lease_seconds = 7;
  // 有状态项目也自动顶替（接受丢失最后一次快照之后的数据）。默认只告警，等用户确认。
  bool auto_stateful = 8;
  // 原节点（A）恢复并稳定一段时间后，自动把项目切回去：停止项目、同步最后的数据、把租约转给 A，
  // 和手动迁移一样不丢数据，切换时项目短暂停止。
  bool auto_failback = 9;
}

// FailoverStatus 是某个参与者看到的顶替状态。
message FailoverStatus {
  FailoverConfig config = 1;
  // holder（运行项目）、standby（热备）或 witness（见证人）。
  string role = 2;
  // 当前持有租约的节点。
  string holder_name = 3;
  uint64 epoch = 4;
  // 持有者：租约还剩多久（毫秒），0 表示已经续不上、项目已停止。
  int64 lease_remaining_ms = 5;
  // 热备：持有者失联，等待用户确认顶替（有状态项目）。
  bool pending_confirm = 6;
  // 热备最近一次收到同步的时间（热备上）或最近一次同步给热备的时间（持有者上）。
  google.protobuf.Timestamp last_sync = 7;
  string last_error = 8;
  bool stateful = 9;
  // 当前持有租约的节点的 mesh 公钥。
  bytes holder_key = 10;
  // 持有者上：原节点已经恢复，再过多久（毫秒）自动切回；0 表示不会切回（没开、原节点就是本节点或者还没恢复）。
  int64 failback_in_ms = 11;
  // 持有者上：正在切回原节点。
  bool failing_back = 12;
  // 热备上：面板登记副本时给的配置的修订号（容器的、项目的），面板据此补推最新的配置。
  int64 spec_revision = 13;
  int64 spec_project_revision = 14;
}

// LinkPlan 是面板告诉一个节点的代理计划（见 docs/agent.md#项目内网）：本节点要在哪些项目内网里放哪些代理，
// 以及哪些节点可以经 mesh 连进来访问本节点上的容器。节点缓存在本地，面板不在时照旧。
message LinkPlan {
  repeated LinkProxy proxies = 1;
  repeated LinkAllow allows = 2;
}

// LinkProxy 是一个代理：放在 project_id 的项目内网里，名字是 alias，代表 target_project 的容器 target_name。
// 连接时按 nodes 的顺序找：先找所在节点，对方说"不在这里"（例如已经被顶替）再找下一个。
message LinkProxy {
  string project_id = 1;
  string alias = 2;
  string target_project = 3;
  // 目标在它自己的项目内网里的名字：单个容器是"容器名"，容器组里的是"服务.容器组"。
  string target_name = 4;
  repeated uint32 ports = 5;
  repeated LinkNode nodes = 6;
}

message LinkNode {
  // 节点的 mesh 公钥。
  bytes key = 1;
  string name = 2;
}

// LinkAllow：哪些节点可以访问本节点上 project_id 的容器，以及项目设置里补的内部端口。
message LinkAllow {
  string project_id = 1;
  repeated bytes callers = 2;
  repeated string internal_ports = 3;
}
