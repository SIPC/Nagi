syntax = "proto3";

package nagi.v1;

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// MeshService：mesh 成员之间直接调用，走 WireGuard。调用方身份由 WireGuard 公钥确定。
service MeshService {
  rpc Ping(PingRequest) returns (PingResponse);
  // 面板把容器文件的压缩包（zip、tar.gz）传给节点。节点解压后暂存，下次部署（use_upload）时替换 data/。
  // 只接受节点信任的面板。第一条消息带项目和容器。
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  // 备份同步（源节点 → 备份节点）：先取对方已有的文件，再传缺少的，最后提交完整的文件列表。
  // 只接受备份节点登记过的源节点。
  rpc ReplicaManifest(ReplicaManifestRequest) returns (ReplicaManifestResponse);
  rpc ReplicaPut(stream ReplicaChunk) returns (ReplicaPutResponse);
  rpc ReplicaCommit(ReplicaCommitRequest) returns (ReplicaCommitResponse);
  // 顶替的租约投票：调用方请求（或续约）各个容器第 epoch 轮的租约。只接受顶替设置里的 A、B。
  // 同一对成员之间多个容器的投票合并成一次请求，结果按请求的顺序返回。
  rpc LeaseVotes(LeaseVotesRequest) returns (LeaseVotesResponse);
}

message LeaseVoteRequest {
  string project_id = 1;
  string container = 4;
  uint64 epoch = 2;
  // 不为空时是转让：当前的持有者请投票者把票转给这一方（第 epoch 轮），用于切回原节点。
  // 只有票现在投给的那一方本人能转让，epoch 必须正好是当前轮次加一。
  bytes handover_to = 3;
}

message LeaseVotesRequest {
  repeated LeaseVoteRequest votes = 1;
}

message LeaseVotesResponse {
  repeated LeaseVoteResponse votes = 1;
}

message LeaseVoteResponse {
  bool granted = 1;
  // 这个投票者当前投给的一方和轮次。
  bytes holder = 2;
  uint64 epoch = 3;
}

message ReplicaManifestRequest {
  string project_id = 1;
  string container = 2;
}

message ReplicaFile {
  string path = 1;
  int64 size = 2;
}

message ReplicaManifestResponse {
  repeated ReplicaFile files = 1;
}

// ReplicaChunk：path 变了表示开始一个新文件。
message ReplicaChunk {
  // 第一块带上项目和容器。
  string project_id = 1;
  string path = 2;
  bytes data = 3;
  string container = 4;
}

message ReplicaPutResponse {
  uint32 files = 1;
}

message ReplicaCommitRequest {
  string project_id = 1;
  string container = 3;
  // 源节点上现在的完整文件列表，备份节点删除不在列表里的文件。
  repeated string paths = 2;
}

message ReplicaCommitResponse {}

message UploadChunk {
  // 第一块带上项目和容器，之后只有 data。
  string project_id = 1;
  bytes data = 2;
  string container = 3;
}

message UploadResponse {
  uint64 bytes = 1;
  uint32 files = 2;
  // 压缩包里只有一个顶层目录时，自动去掉的这一层目录名。
  string stripped = 3;
}

message PingRequest {}

message PingResponse {
  // 对方看到的调用方公钥。
  bytes caller = 1;
}
