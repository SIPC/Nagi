syntax = "proto3";

package nagi.v1;

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

import "nagi/v1/common.proto";

// MeshService：mesh 成员之间直接调用，走 WireGuard。调用方身份由 WireGuard 公钥确定。
service MeshService {
  rpc Ping(PingRequest) returns (PingResponse);
  // 面板把项目文件的压缩包（zip、tar.gz）传给节点。节点解压后暂存，下次部署（use_upload）时替换 data/。
  // 只接受节点信任的面板。第一条消息带 project_id。
  rpc Upload(stream UploadChunk) returns (UploadResponse);
  // 备份同步（源节点 → 备份节点）：先取对方已有的文件，再传缺少的，最后提交完整的文件列表。
  // 只接受备份节点登记过的源节点。
  rpc ReplicaManifest(ReplicaManifestRequest) returns (ReplicaManifestResponse);
  rpc ReplicaPut(stream ReplicaChunk) returns (ReplicaPutResponse);
  rpc ReplicaCommit(ReplicaCommitRequest) returns (ReplicaCommitResponse);
  // 顶替的租约投票：调用方请求（或续约）第 epoch 轮的租约。只接受顶替设置里的 A、B。
  rpc LeaseVote(LeaseVoteRequest) returns (LeaseVoteResponse);
  // 跨节点连接的共享网络：本节点这个网络里的容器和加入的项目。只接受和这个网络相连的节点。
  rpc SharedNetworkInfo(SharedNetworkInfoRequest) returns (SharedNetworkInfoResponse);
}

message SharedNetworkInfoRequest {
  string name = 1;
}

message SharedNetworkInfoResponse {
  // 正在运行、接入了这个网络的容器。
  repeated LinkEndpoint endpoints = 1;
  // 加入了这个网络的项目（不管是否在运行），用来检查网络名是否重复。
  repeated SharedNetworkProject projects = 2;
}

message LinkEndpoint {
  string alias = 1;
  string project_id = 2;
  string project_name = 3;
  repeated uint32 ports = 4;
}

message LeaseVoteRequest {
  string project_id = 1;
  uint64 epoch = 2;
  // 不为空时是转让：当前的持有者请投票者把票转给这一方（第 epoch 轮），用于切回原节点。
  // 只有票现在投给的那一方本人能转让，epoch 必须正好是当前轮次加一。
  bytes handover_to = 3;
}

message LeaseVoteResponse {
  bool granted = 1;
  // 这个投票者当前投给的一方和轮次。
  bytes holder = 2;
  uint64 epoch = 3;
}

message ReplicaManifestRequest {
  string project_id = 1;
}

message ReplicaFile {
  string path = 1;
  int64 size = 2;
}

message ReplicaManifestResponse {
  repeated ReplicaFile files = 1;
}

// ReplicaChunk：path 变了表示开始一个新文件。
message ReplicaChunk {
  string project_id = 1;
  string path = 2;
  bytes data = 3;
}

message ReplicaPutResponse {
  uint32 files = 1;
}

message ReplicaCommitRequest {
  string project_id = 1;
  // 源节点上现在的完整文件列表，备份节点删除不在列表里的文件。
  repeated string paths = 2;
  string project_name = 3;
}

message ReplicaCommitResponse {}

message UploadChunk {
  // 第一块带上项目和容器，之后只有 data。
  string project_id = 1;
  bytes data = 2;
  string container = 3;
}

message UploadResponse {
  uint64 bytes = 1;
  uint32 files = 2;
  // 压缩包里只有一个顶层目录时，自动去掉的这一层目录名。
  string stripped = 3;
}

message PingRequest {}

message PingResponse {
  // 对方看到的调用方公钥。
  bytes caller = 1;
}
