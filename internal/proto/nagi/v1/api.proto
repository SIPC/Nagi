  // 从 .env 导入的变量名，和其中标为密钥的。值不返回。
  repeated string variables = 4;
  repeated string secret_variables = 5;
  // 原来运行着的 compose 项目和它的容器（「名称 状态」），部署时会被替换。
  string project = 6;
  repeated string containers = 7;
  // 需要注意的地方，例如没有带上的叠加文件、改为引用原卷的命名卷。
  repeated string notes = 8;
  // 建议的容器组名称（目录名）。
  string name = 9;
  // 建议纳入快照的子目录：挂载到常见数据库数据目录的（例如 /var/lib/postgresql/data）。
  repeated string backup_paths = 10;
