message LoginRegistryApiRequest {
  string project_id = 1;
  string registry = 2;
  string username = 3;
  string password = 4;
}

message LogoutRegistryRequest {
  string project_id = 1;
  string registry = 2;
}

message ListProjectEventsRequest {
  string project_id = 1;
  // 为空表示项目里的所有容器。
  string container = 2;
  // 默认 50，最多 200。
  int32 limit = 3;
  // 只要 ID 比它小的（翻页），0 表示从最新的开始。
  int64 before = 4;
  bool failed_only = 5;
}
