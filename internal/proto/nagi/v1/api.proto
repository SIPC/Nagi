syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";
import "nagi/v1/agent.proto";
import "nagi/v1/common.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// 以下服务供浏览器调用（Connect-RPC）。

service SetupService {
  rpc GetSetupState(GetSetupStateRequest) returns (GetSetupStateResponse);
  rpc Setup(SetupRequest) returns (SetupResponse);
}

message GetSetupStateRequest {}

message GetSetupStateResponse {
  bool initialized = 1;
}

message SetupRequest {
  // 启动日志里初始化链接带的一次性令牌。
  string token = 1;
  string username = 2;
  string password = 3;
}

message SetupResponse {}

service AuthService {
  // 开启了两步验证时，没带验证码会返回 failed_precondition，界面据此显示验证码输入框。
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  // 高权限确认：打开节点终端、访问节点文件前再验证一次身份（见 docs/node-access.md#权限）。
  rpc Elevate(ElevateRequest) returns (ElevateResponse);
  // 修改密码。成功后其他地方的登录全部失效。
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // 保存界面语言。浏览器优先用自己记住的选择，没有时（例如换了设备）用这里保存的。
  rpc SetLanguage(SetLanguageRequest) returns (SetLanguageResponse);
  // 保存自己的个人资料（显示名称和头像），整份覆盖。
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // OAuth 授权页（见 docs/mcp.md#oauth）：检查授权请求，返回客户端的名称和回调地址的域名。
  rpc GetOAuthRequest(OAuthRequest) returns (GetOAuthRequestResponse);
  // 成员在授权页上允许或拒绝，返回浏览器要转去的回调地址（带授权码或者错误）。
  rpc ApproveOAuth(ApproveOAuthRequest) returns (ApproveOAuthResponse);
}

// OAuthRequest 是客户端打开授权页时带的参数（/oauth/authorize 的查询参数）。
message OAuthRequest {
  string response_type = 1;
  string client_id = 2;
  string redirect_uri = 3;
  string state = 4;
  string code_challenge = 5;
  string code_challenge_method = 6;
  string scope = 7;
  string resource = 8;
}

message GetOAuthRequestResponse {
  string client_name = 1;
  // 回调地址的域名（本机客户端是 localhost），授权页上醒目显示，防止钓鱼。
  string redirect_host = 2;
  // 当前成员的角色：只读成员没有「可修改」「执行命令」两个选项。
  string role = 3;
}

message ApproveOAuthRequest {
  OAuthRequest request = 1;
  bool allow = 2;
  // 授权的有效期（天），0 表示不过期。
  uint32 days = 3;
  bool allow_write = 4;
  bool allow_exec = 5;
  // 可以在节点上执行命令（MCP 的 node_exec）。只有管理员能勾，要同时勾 allow_exec。
  bool allow_node_exec = 6;
}

message ApproveOAuthResponse {
  string redirect_url = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // 两步验证码（开启了才需要）。
  string totp_code = 3;
}

message ChangePasswordRequest {
  string current = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message LoginResponse {}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  string username = 1;
  bool totp_enabled = 2;
  // 保存的界面语言（"zh-CN"、"en"），空表示没有选过。
  string language = 3;
  // admin、operator、viewer。
  string role = 4;
  // 显示名称，空表示显示用户名。登录仍然用用户名。
  string display_name = 5;
  // 头像图片的内容和类型，没有头像时为空。
  bytes avatar = 6;
  string avatar_type = 7;
  // 高权限确认的有效期。过了这个时间（或者为空）要重新确认。
  google.protobuf.Timestamp elevated_until = 8;
}

message ElevateRequest {
  // 开了两步验证的账号填验证码，没开的填密码。
  string password = 1;
  string totp_code = 2;
}

message ElevateResponse {
  google.protobuf.Timestamp elevated_until = 1;
}

message UpdateProfileRequest {
  // 空表示显示用户名。
  string display_name = 1;
  // 头像图片（PNG、JPEG、WebP），不超过 256 KB；空表示没有头像。
  bytes avatar = 2;
}

message UpdateProfileResponse {}

message SetLanguageRequest {
  // "zh-CN"、"en"；空表示不指定（跟随浏览器）。
  string language = 1;
}

message SetLanguageResponse {}

service NodeService {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // ---- 节点文件（见 docs/node-access.md）：只有管理员，要先做高权限确认 ----
  rpc ListNodeDir(NodeFileRef) returns (ListNodeDirResponse);
  rpc ReadNodeFile(NodeFileRef) returns (ReadNodeFileResponse);
  rpc WriteNodeFile(WriteNodeFileRequest) returns (WriteNodeFileResponse);
  rpc DeleteNodeFile(DeleteNodeFileRequest) returns (NodeFileOpResponse);
  rpc CreateNodeDir(NodeFileRef) returns (NodeFileOpResponse);
  rpc ListNodeFileBackups(NodeFileRef) returns (ListNodeFileBackupsResponse);
  rpc RestoreNodeFileBackup(RestoreNodeFileBackupRequest) returns (WriteNodeFileResponse);
  // 节点信任的面板列表。
  rpc ListNodePanels(ListNodePanelsRequest) returns (ListNodePanelsResponse);
  // 移交（见 docs/control-plane.md）：用另一个面板的接入码，让这些节点加入那个面板，随后把本面板从节点上移除，
  // 忘记这些节点和它们上面的项目。按整个项目：项目相关的节点（容器所在、顶替、备份、见证）必须都在里面。
  rpc HandoverNodes(HandoverNodesRequest) returns (HandoverNodesResponse);
  // 从节点的信任列表移除一个面板。移除的是本面板时，本面板同时忘记这个节点。
  rpc RemoveNodePanel(RemoveNodePanelRequest) returns (RemoveNodePanelResponse);
  // 节点上保存的副本（作为备份节点或热备）。in_use 为 false 的是已经没有容器使用的副本，可以删除。
  rpc ListNodeReplicas(NodeRef) returns (ListNodeReplicasResponse);
  rpc DeleteNodeReplica(DeleteNodeReplicaRequest) returns (DeleteNodeReplicaResponse);
  // 节点的 mesh 状态。
  rpc GetNodeMesh(GetNodeMeshRequest) returns (MeshStatus);
  // 让节点经 mesh 连一下某个成员。
  rpc PingNodeMesh(PingNodeMeshRequest) returns (MeshPingResponse);
  // 让节点经 mesh 和某个成员测速（见 docs/mesh.md#测速）。只有管理员能用。
  rpc TestNodeMeshSpeed(PingNodeMeshRequest) returns (MeshSpeedResponse);
  // 修改节点的组网设置（关闭 QUIC 快速通道）。
  rpc SetNodeMeshOptions(SetNodeMeshOptionsRequest) returns (MeshOptions);
  // 面板自己的 mesh 状态。
  rpc GetPanelMesh(GetPanelMeshRequest) returns (MeshStatus);
  // 把节点升级到面板提供的版本（面板自带的节点随面板升级，不能单独升级）。在后台进行，进度用 GetUpdateStatus 查。
  rpc UpgradeNode(UpgradeNodeRequest) returns (UpgradeResponse);
  // 把所有落后于面板的节点逐个升级到面板的版本：下载阶段失败的记下原因接着升下一个，替换后没回来就停下。
  // 在后台进行，进度用 GetUpdateStatus 查。
  rpc UpgradeAllNodes(UpgradeAllNodesRequest) returns (UpgradeAllNodesResponse);
  // 取消升级：排队的不再升级，下载中的停止下载；已经替换、正在重启的不能取消。
  rpc CancelNodeUpgrade(CancelNodeUpgradeRequest) returns (CancelNodeUpgradeResponse);
  // 节点的镜像加速地址。
  rpc GetNodeMirrors(NodeRef) returns (Mirrors);
  rpc SetNodeMirrors(SetNodeMirrorsRequest) returns (Mirrors);
  // 立即清理节点上每个容器的快照仓库，回收没有快照用到的数据。只有管理员能用。
  rpc ReclaimNodeSnapshots(NodeRef) returns (stream DeployEvent);
  // 节点的项目根目录：容器目录默认是 <项目根目录>/<项目名的拼音>/<容器名>。
  rpc SetNodeProjectsRoot(SetNodeProjectsRootRequest) returns (SetProjectsRootResponse);
  // 生成一条添加节点的安装命令，里面带一次性令牌（1 小时内有效）。
  rpc CreateEnrollCommand(CreateEnrollCommandRequest) returns (CreateEnrollCommandResponse);
  rpc QueryNodeMetrics(QueryNodeMetricsRequest) returns (QueryMetricsResponse);
  // 节点的磁盘占用明细（只读）。只有管理员能看：内容涉及节点上所有项目。
  rpc GetNodeStorage(NodeRef) returns (NodeStorage);
  // 移除节点：面板忘记它并拒绝它再连接。节点上还有容器时拒绝。
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  // 批准用接入码加入的节点。接入码可以多次使用、还会经过别的面板转交，泄露了别人也能用它加入节点，
  // 所以这样加入的节点要管理员确认。
  rpc ApproveNode(ApproveNodeRequest) returns (ApproveNodeResponse);
  // 修改节点在面板上显示的名称（加入时是节点的主机名）。只存在面板上，不改节点本机的主机名。
  rpc RenameNode(RenameNodeRequest) returns (RenameNodeResponse);
  // 把节点上面板不认识的容器按节点的缓存加入项目（见 Node.unknown_containers）。
  rpc AdoptNodeContainer(AdoptNodeContainerRequest) returns (AdoptNodeContainerResponse);
  // 以节点为准重建项目（见 Node.stale_projects）：删掉面板上的记录，按节点缓存拼回。
  rpc AdoptStaleProject(AdoptStaleProjectRequest) returns (AdoptStaleProjectResponse);
  // 预览节点上一个现有的 compose 目录能不能导入（见 docs/agent.md#现有目录）。只有管理员能用，要先确认身份。
  rpc InspectComposeDir(NodeFileRef) returns (ComposeDirPreview);
}

message NodeRef {
  string node_id = 1;
}

message SetNodeProjectsRootRequest {
  string node_id = 1;
  string root = 2;
}

message ApproveNodeRequest {
  string node_id = 1;
}

message ApproveNodeResponse {}

message RenameNodeRequest {
  string node_id = 1;
  string name = 2;
}

message RenameNodeResponse {}

message QueryNodeMetricsRequest {
  string node_id = 1;
  string prefix = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  // 聚合步长（秒），见 QueryMetricsRequest.step。
  int64 step = 5;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {}

message CreateEnrollCommandRequest {}

message GetNodeMeshRequest {
  string node_id = 1;
}

message PingNodeMeshRequest {
  string node_id = 1;
  bytes public_key = 2;
  // 只用于测速，界面分步测：path 只走当前的路径，wireguard 只经 WireGuard 隧道（用来和 QUIC 对比）。
  // 为空时先走当前的路径，走的是 QUIC 再经 WireGuard 测一次。v0.20.0 以前的节点不认识，按为空处理。
  string speed_via = 3;
}

message SetNodeMeshOptionsRequest {
  string node_id = 1;
  MeshOptions options = 2;
}

message GetPanelMeshRequest {}

message UpgradeNodeRequest {
  string node_id = 1;
}

message UpgradeAllNodesRequest {}

message CancelNodeUpgradeRequest {
  // 为空时取消所有排队和下载中的升级。
  string node_id = 1;
}

message CancelNodeUpgradeResponse {}

message UpgradeAllNodesResponse {
  // 要升级的节点，按升级的顺序。
  repeated string node_ids = 1;
  // 升级到的版本。
  string version = 2;
}

message SetNodeMirrorsRequest {
  string node_id = 1;
  repeated string mirrors = 2;
}

message ListNodePanelsRequest {
  string node_id = 1;
}

message ListNodePanelsResponse {
  repeated TrustedPanel panels = 1;
}

message ListNodeReplicasResponse {
  repeated NodeReplica replicas = 1;
}

message NodeReplica {
  Replica replica = 1;
  // 面板上还有容器以这个节点为备份节点或热备。
  bool in_use = 2;
}

message DeleteNodeReplicaRequest {
  string node_id = 1;
  string project_id = 2;
  string container = 3;
}

message DeleteNodeReplicaResponse {}

message HandoverNodesRequest {
  repeated string node_ids = 1;
  // 新面板生成的接入码。
  string invite = 2;
}

message HandoverNodesResponse {
  repeated HandoverResult results = 1;
}

message HandoverResult {
  string node_id = 1;
  // 为空表示成功。
  string error = 2;
}

message RemoveNodePanelRequest {
  string node_id = 1;
  string fingerprint = 2;
}

message RemoveNodePanelResponse {}

message CreateEnrollCommandResponse {
  string command = 1;
  google.protobuf.Timestamp expires_at = 2;
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // 绑定面板域名（为空表示取消），自动申请正式证书。节点的控制连接和安装命令仍然用 IP:端口 + 公钥指纹。
  rpc SetPanelDomain(SetPanelDomainApiRequest) returns (UpdateSettingsResponse);
  rpc GetAlertConfig(GetAlertConfigRequest) returns (GetAlertConfigResponse);
  rpc UpdateAlertConfig(UpdateAlertConfigRequest) returns (UpdateAlertConfigResponse);
  // 用面板发一条测试消息到某个渠道。
  rpc TestAlertChannel(TestAlertChannelRequest) returns (TestAlertChannelResponse);
  // 生成接入码：其他面板用它把节点交给本面板。1 小时内可以给多个节点用。
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // 还在有效期内的接入码。
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // 提前作废接入码。
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // 主备面板（见 docs/standby.md）：生成配对码、列出和移除备用面板；备用面板上返回自己的同步状态。
  rpc CreateStandbyCode(CreateStandbyCodeRequest) returns (CreateStandbyCodeResponse);
  rpc GetStandbys(GetStandbysRequest) returns (GetStandbysResponse);
  rpc RemoveStandby(RemoveStandbyRequest) returns (RemoveStandbyResponse);
  // 把本面板（备用面板）提升为主面板：任期加一，面板按主面板重新启动（见 docs/standby.md#提升）。
  rpc PromoteStandby(PromoteStandbyRequest) returns (PromoteStandbyResponse);
  // 检查 GitHub Release 上有没有比本面板新的版本（见 docs/panel.md#更新面板）。
  rpc CheckPanelUpdate(CheckPanelUpdateRequest) returns (CheckPanelUpdateResponse);
  // 把本面板更新到最新发布的版本：在后台下载并核对后替换可执行文件，然后原地重启。备用面板上也可以用。
  rpc UpdatePanel(UpdatePanelRequest) returns (UpdatePanelResponse);
  // 本面板到最新版本之间各版本的更新日志，按界面语言取（见 docs/panel.md#更新面板）。
  rpc GetPanelReleaseNotes(GetPanelReleaseNotesRequest) returns (GetPanelReleaseNotesResponse);
  // 面板和节点的更新进度。记在面板上，刷新页面和面板重启后都还在（见 docs/panel.md#更新状态）。
  rpc GetUpdateStatus(GetUpdateStatusRequest) returns (GetUpdateStatusResponse);
  // 账号安全：两步验证和安全入口。
  rpc GetSecurity(GetSecurityRequest) returns (Security);
  // 开始设置两步验证：返回密钥和验证器 App 扫码用的地址，10 分钟内用 EnableTOTP 确认。
  rpc BeginTOTP(BeginTOTPRequest) returns (BeginTOTPResponse);
  rpc EnableTOTP(EnableTOTPRequest) returns (Security);
  // 关闭两步验证，需要当前的验证码或者密码。
  rpc DisableTOTP(DisableTOTPRequest) returns (Security);
  // 开启（生成新的随机路径）或关闭安全入口。
  rpc SetEntrance(SetEntranceRequest) returns (Security);
  // 活动记录：用户的操作和告警，新的在前。
  rpc ListActivity(ListActivityRequest) returns (ListActivityResponse);
  // 成员（只有管理员能用）。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (PanelUser);
  // 修改角色、重置密码、清除两步验证。重置密码后这个用户已有的登录全部失效。
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // 当前用户自己的登录会话。
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // 访问令牌（见 docs/mcp.md#登录）。user_id 为 0 时是自己的；管理员可以查看、吊销其他成员的。
  rpc ListAccessTokens(ListAccessTokensRequest) returns (ListAccessTokensResponse);
  // 生成个人访问令牌，只能给自己生成，要先做高权限确认。
  rpc CreateAccessToken(CreateAccessTokenRequest) returns (CreateAccessTokenResponse);
  rpc RevokeAccessToken(RevokeAccessTokenRequest) returns (RevokeAccessTokenResponse);
}

message AccessToken {
  int64 id = 1;
  // 个人令牌是成员起的名字，OAuth 是客户端的名称。
  string name = 2;
  // personal、oauth。
  string source = 3;
  bool allow_write = 4;
  bool allow_exec = 5;
  google.protobuf.Timestamp created_at = 6;
  // 为空表示不过期。OAuth 是整个授权的有效期。
  google.protobuf.Timestamp expires_at = 7;
  // 没用过时为空。
  google.protobuf.Timestamp last_used_at = 8;
  string last_ip = 9;
  // 可以在节点上执行命令（MCP 的 node_exec），只有管理员的个人访问令牌能有。
  bool allow_node_exec = 10;
}

message ListAccessTokensRequest {
  int64 user_id = 1;
}

message ListAccessTokensResponse {
  repeated AccessToken tokens = 1;
}

message CreateAccessTokenRequest {
  string name = 1;
  // 有效期（天），0 表示不过期。
  uint32 days = 2;
  bool allow_write = 3;
  bool allow_exec = 4;
  // 可以在节点上执行命令（等于节点的 root）。只有管理员能勾选。
  bool allow_node_exec = 5;
}

message CreateAccessTokenResponse {
  AccessToken token = 1;
  // 令牌本身，只在这里出现一次。
  string secret = 2;
}

message RevokeAccessTokenRequest {
  int64 id = 1;
}

message RevokeAccessTokenResponse {}

message GetSecurityRequest {}

message Security {
  bool totp_enabled = 1;
  // 安全入口路径（不含 /），没开启时为空。开启后要先打开 https://<面板>/<路径> 才能看到登录页。
  string entrance = 2;
  // 开没开安全入口。入口路径只给管理员，其他成员只知道开了：MCP 的地址要带着入口（见 docs/mcp.md#入口），要向管理员要。
  bool entrance_enabled = 3;
}

message BeginTOTPRequest {}

message BeginTOTPResponse {
  string secret = 1;
  string uri = 2;
}

message EnableTOTPRequest {
  string code = 1;
}

message DisableTOTPRequest {
  string code = 1;
  string password = 2;
}

message SetEntranceRequest {
  bool enabled = 1;
}

message CreateInviteRequest {}

message CreateInviteResponse {
  string invite = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListInvitesRequest {}

message Invite {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  // 已经用它加入的节点数。
  uint32 uses = 4;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string id = 1;
}

message RevokeInviteResponse {}

message GetAlertConfigRequest {}

message GetAlertConfigResponse {
  AlertConfig config = 1;
  // 告警配置随面板主密钥一起丢了（用 --new-master-key 启动过），还没有重新保存。
  // 在那之前面板不给节点下发，节点继续按原来的配置发告警。
  bool lost = 2;
}

message UpdateAlertConfigRequest {
  AlertConfig config = 1;
}

message UpdateAlertConfigResponse {
  AlertConfig config = 1;
}

message TestAlertChannelRequest {
  AlertChannel channel = 1;
}

message TestAlertChannelResponse {}

message PanelSettings {
  // 面板对外地址（IP 或域名，不含端口），安装命令和节点连接都用它，必须能被所有节点访问。
  string public_address = 1;
  // 以下只读
  uint32 port = 2;
  string fingerprint = 3;
  // 面板的版本，节点版本和它不一样时可以升级。
  string version = 4;
  // 面板绑定的域名，为空表示没绑定。
  string domain = 5;
  // 面板主密钥文件的路径。数据库里的密钥都用它加密，要单独备份。
  string master_key_path = 6;
}

message GetSettingsRequest {}

message SetPanelDomainApiRequest {
  string domain = 1;
}

message GetSettingsResponse {
  PanelSettings settings = 1;
}

message UpdateSettingsRequest {
  string public_address = 1;
}

message UpdateSettingsResponse {
  PanelSettings settings = 1;
}

message Node {
  string id = 1;
  string name = 2;
  bool online = 3;
  google.protobuf.Timestamp last_seen = 4;
  NodeInfo info = 5;
  // 访问这个节点上的服务用的地址：面板看到的节点来源 IP；面板自带的节点用面板的对外地址。
  // 节点在 NAT 后面时是 NAT 的出口地址，不一定能从外面访问。
  string address = 6;
  // 用接入码加入、还没有批准的节点：不进 mesh、不下发告警配置、不能操作，在节点页批准后才可用。
  bool pending = 7;
  // 当前的资源占用（节点在线时）。
  NodeUsage usage = 8;
  // 面板上运行在这个节点上的容器数。
  int32 containers = 9;
  // 节点上有、面板却不认识的容器（所属项目在面板上是建好的，不是从节点缓存拼回的，所以不自动加进去）。
  // 管理员确认是自己的以后可以加入项目（AdoptNodeContainer）。
  repeated UnknownContainer unknown_containers = 10;
  // 本面板自带的节点：和本面板在同一台机器上。概览据此把节点和面板之间的流量算到这台机器上。
  bool own_embedded = 11;
  // 节点报告配置由别的面板写过的项目：面板上的记录可能旧了。节点可能被攻破，所以不自动以节点为准，
  // 管理员确认后才重建（AdoptStaleProject）。
  repeated StaleProject stale_projects = 12;
}

message StaleProject {
  string project_id = 1;
  string project_name = 2;
}

message AdoptStaleProjectRequest {
  string node_id = 1;
  string project_id = 2;
}

message AdoptStaleProjectResponse {}

message UnknownContainer {
  string project_id = 1;
  string project_name = 2;
  string container = 3;
}

message AdoptNodeContainerRequest {
  string node_id = 1;
  string project_id = 2;
  string container = 3;
}

message AdoptNodeContainerResponse {}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
  // 访问范围外、但范围内项目的容器用到的节点（所在节点、备份节点、热备、见证人）：只有 ID、名称和是否在线，
  // 用来在项目页显示节点名称。成员能访问全部节点时为空。见 docs/panel.md#访问范围。
  repeated Node other_nodes = 2;
}

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // 新建项目，可以同时带上第一个容器（只保存，不部署）。
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(ProjectRef) returns (ProjectSummary);
  // 修改项目设置：名称、网络名、快照间隔、内部端口，立即生效。共享变量不在这里改。
  rpc UpdateProjectSettings(UpdateProjectSettingsRequest) returns (Project);
  // 保存共享变量的草稿，返回引用了改动变量的容器（部署共享变量时默认一起部署）。
  rpc SaveSharedEnv(SaveSharedEnvRequest) returns (SaveSharedEnvResponse);
  rpc DiscardSharedEnv(ProjectRevisionRef) returns (Project);
  // 删除项目：删除所有容器，容器目录默认保留。
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // 往项目里加一个容器（只保存，不部署）。
  rpc AddContainer(AddContainerRequest) returns (Project);
  // 把节点上一个现有的 compose 目录导入为容器组，数据留在原处（见 docs/agent.md#现有目录）。只保存，不部署；
  // 部署时停掉目录里原来运行的容器，由面板接管。只有管理员能用，要先确认身份。
  rpc ImportComposeDir(ImportComposeDirRequest) returns (Project);
  // 删除容器：停止并删除它，目录默认保留。
  rpc DeleteContainer(DeleteContainerApiRequest) returns (Project);
  // 手动启动、停止或重启容器：不改配置，不生成版本。设置了顶替的容器不能停止。
  rpc ControlContainer(ControlContainerRequest) returns (stream DeployEvent);
  rpc SaveDraft(SaveDraftRequest) returns (Project);
  rpc DiscardDraft(ContainerRevisionRef) returns (Project);
  // 部署一个或多个容器：有草稿的容器把草稿记为新版本，没有的重新部署最新版本。
  // 按依赖顺序逐个部署，某个失败就停下。整次部署记一条部署记录。
  rpc Deploy(DeployRequest) returns (stream DeployEvent);
  rpc ListVersions(ContainerRef) returns (ListVersionsResponse);
  // 这个容器最近的事件：操作和告警，新的在前。所有角色都能看；只读角色看不到失败的详细信息。
  rpc ListContainerEvents(ContainerRef) returns (ListActivityResponse);
  // 项目的活动记录（操作和告警），新的在前，可以按容器、只看失败的筛选，用 before 翻页。
  rpc ListProjectEvents(ListProjectEventsRequest) returns (ListActivityResponse);
  // 回滚容器到某个版本：用它的配置、文件和镜像生成这个容器的新版本并部署，可选同时恢复数据。
  rpc Rollback(RollbackRequest) returns (stream DeployEvent);
  rpc ListDeployments(ProjectRef) returns (ListDeploymentsResponse);
  // 回到某次部署时的状态：版本不一样的容器都回滚到那次记录的版本，作为一次一起部署执行。
  rpc RestoreDeployment(RestoreDeploymentRequest) returns (stream DeployEvent);
  rpc StreamLogs(StreamLogsApiRequest) returns (stream LogLine);

  // 端口映射，立即生效。
  rpc SaveRoute(SaveRouteRequest) returns (Project);
  rpc DeleteRoute(DeleteRouteRequest) returns (Project);
  // 检查映射绑定的域名：是否解析到入口节点、证书状态。映射可以还没保存（编辑时用）。
  rpc CheckDomains(CheckDomainsRequest) returns (CheckDomainsResponse);
  // 让入口节点立刻重新申请证书，不用等 Caddy 的下一次自动重试。
  rpc RetryDomainCert(RetryDomainCertRequest) returns (RetryDomainCertResponse);

  // 备份节点、迁移（按容器，见 docs/failover.md）。
  // 设置或取消备份节点（node_id 为空表示取消）。
  rpc SetBackupNode(SetBackupNodeRequest) returns (Project);
  // 修改容器的显示名称（为空表示改回显示容器名）。容器名本身不能改。
  rpc SetContainerDisplayName(SetContainerDisplayNameRequest) returns (Project);
  // 立即同步到备份节点，同步完才返回。
  rpc SyncBackup(ContainerRef) returns (Project);
  // 备份节点上副本里的快照。
  rpc ListBackupSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  // 原节点离线时，在备份节点上把容器恢复出来。
  rpc RestoreFromBackup(RestoreFromBackupRequest) returns (stream DeployEvent);
  // 把容器迁移到另一个节点（两个节点都在线），不丢数据。
  rpc MigrateContainer(MoveContainerRequest) returns (stream DeployEvent);
  // 原节点离线又没有副本时，把容器换到另一个节点重新部署（数据和旧版本的文件都没有）。
  rpc RedeployElsewhere(MoveContainerRequest) returns (stream DeployEvent);

  // 顶替（按容器，见 docs/failover.md#节点故障指定顶替节点）。
  rpc SetFailover(SetFailoverApiRequest) returns (Project);
  rpc ClearFailover(ContainerRef) returns (Project);
  // 更换见证人，顶替照常进行。
  rpc ChangeWitness(ChangeWitnessRequest) returns (Project);
  // 有状态容器的所在节点失联时，确认由热备顶替。
  rpc ConfirmTakeover(ContainerRef) returns (Project);

  // 项目连接（双向，立即生效）：连上以后两个项目的容器用"容器.网络名"访问对方。
  rpc ConnectProject(ConnectProjectRequest) returns (Project);
  rpc DisconnectProject(ConnectProjectRequest) returns (Project);

  // 容器的存储：data/、命名 volume，大小和挂载位置。
  rpc ListVolumes(ContainerRef) returns (ListVolumesResponse);
  // 卷里的文件。只读角色不能用；下载和上传走 /api/volume-file。
  rpc ListVolumeFiles(VolumeFileRef) returns (ListVolumeFilesResponse);
  rpc DeleteVolumeFile(VolumeFileRef) returns (VolumeFileOpResponse);
  rpc CreateVolumeDir(VolumeFileRef) returns (VolumeFileOpResponse);
  rpc RestoreVolumeFile(VolumeFileRef) returns (VolumeFileOpResponse);

  // 快照（按容器）。
  rpc ListSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  // 给容器做一份手动快照；container 为空时给项目里所有部署过的容器各做一份。
  rpc CreateSnapshot(ContainerRef) returns (stream DeployEvent);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (stream DeployEvent);
  // 删除一份定时、手动或部署前快照。版本文件不能删（回滚要用）。
  rpc DeleteSnapshot(RestoreSnapshotRequest) returns (ListSnapshotsResponse);
  // 面板保存的容器快照仓库密码。节点坏了只剩备份文件时，用 kopia 打开仓库要用到。
  rpc GetBackupKey(ContainerRef) returns (GetBackupKeyResponse);

  // 私有仓库认证：每个项目自己的登录信息。
  rpc ListRegistries(ProjectRef) returns (RegistriesResponse);
  rpc LoginRegistry(LoginRegistryApiRequest) returns (RegistriesResponse);
  rpc LogoutRegistry(LogoutRegistryRequest) returns (RegistriesResponse);
  // 立即检查项目的镜像有没有新版本。
  rpc CheckImages(ProjectRef) returns (CheckImagesResponse);
}

message SetBackupNodeRequest {
  string project_id = 1;
  string container = 2;
  string node_id = 3;
  // 取消时同时删除备份节点上的副本。
  bool delete_replica = 4;
