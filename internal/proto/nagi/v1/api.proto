  // 映射名，还没保存的映射为空。
  string route = 1;
  string domain = 2;
  // 域名解析到的地址（面板上查的）。
  repeated string addresses = 3;
  repeated DomainEntryCheck entries = 4;
}

// DomainEntryCheck 是域名在一个入口节点上的情况。
message DomainEntryCheck {
  string node_id = 1;
  string node_name = 2;
  // 节点地址，不知道时为空。
  string address = 3;
  // ok（解析到了这台节点）、mismatch（解析到了别的地址，例如前面有 CDN）、unresolved（解析不到）、
  // unknown（节点离线或者是内网地址，没法比对）。
  string dns = 4;
  // obtained、pending、failed，或者 not_needed（只开 HTTP）、unknown（节点离线、版本较旧或没有 Caddy）。
  string cert = 5;
  string cert_error = 6;
  google.protobuf.Timestamp cert_not_after = 7;
}

