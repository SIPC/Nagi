syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";
import "nagi/v1/agent.proto";
import "nagi/v1/common.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// 以下服务供浏览器调用（Connect-RPC）。

service SetupService {
  rpc GetSetupState(GetSetupStateRequest) returns (GetSetupStateResponse);
  rpc Setup(SetupRequest) returns (SetupResponse);
}

message GetSetupStateRequest {}

message GetSetupStateResponse {
  bool initialized = 1;
}

message SetupRequest {
  // 启动日志里初始化链接带的一次性令牌。
  string token = 1;
  string username = 2;
  string password = 3;
}

message SetupResponse {}

service AuthService {
  // 开启了两步验证时，没带验证码会返回 failed_precondition，界面据此显示验证码输入框。
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  // 修改密码。成功后其他地方的登录全部失效。
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // 两步验证码（开启了才需要）。
  string totp_code = 3;
}

message ChangePasswordRequest {
  string current = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message LoginResponse {}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  string username = 1;
  bool totp_enabled = 2;
}

service NodeService {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // 节点信任的面板列表。
  rpc ListNodePanels(ListNodePanelsRequest) returns (ListNodePanelsResponse);
  // 用另一个面板的接入码，让节点加入那个面板；随后把本面板从节点上移除并忘记节点（移交）。
  rpc AddNodePanel(AddNodePanelRequest) returns (AddNodePanelResponse);
  // 从节点的信任列表移除一个面板。移除的是本面板时，本面板同时忘记这个节点。
  rpc RemoveNodePanel(RemoveNodePanelRequest) returns (RemoveNodePanelResponse);
  // 节点的 mesh 状态。
  rpc GetNodeMesh(GetNodeMeshRequest) returns (MeshStatus);
  // 让节点经 mesh 连一下某个成员。
  rpc PingNodeMesh(PingNodeMeshRequest) returns (MeshPingResponse);
  // 面板自己的 mesh 状态。
  rpc GetPanelMesh(GetPanelMeshRequest) returns (MeshStatus);
  // 把节点升级到面板提供的版本（面板自带的节点随面板升级，不能单独升级）。
  rpc UpgradeNode(UpgradeNodeRequest) returns (UpgradeResponse);
  // 节点的镜像加速地址。
  rpc GetNodeMirrors(NodeRef) returns (Mirrors);
  rpc SetNodeMirrors(SetNodeMirrorsRequest) returns (Mirrors);
  // 节点的项目根目录：容器目录默认是 <项目根目录>/<网络名>/<容器名>。
  rpc SetNodeProjectsRoot(SetNodeProjectsRootRequest) returns (SetProjectsRootResponse);
  // 生成一条添加节点的安装命令，里面带一次性令牌（1 小时内有效）。
  rpc CreateEnrollCommand(CreateEnrollCommandRequest) returns (CreateEnrollCommandResponse);
  rpc QueryNodeMetrics(QueryNodeMetricsRequest) returns (QueryMetricsResponse);
  // 移除节点：面板忘记它并拒绝它再连接。节点上还有容器时拒绝。
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
  // 批准用接入码加入的节点。接入码可以多次使用、还会经过别的面板转交，泄露了别人也能用它加入节点，
  // 所以这样加入的节点要管理员确认。
  rpc ApproveNode(ApproveNodeRequest) returns (ApproveNodeResponse);
}

message NodeRef {
  string node_id = 1;
}

message SetNodeProjectsRootRequest {
  string node_id = 1;
  string root = 2;
}

message ApproveNodeRequest {
  string node_id = 1;
}

message ApproveNodeResponse {}

message QueryNodeMetricsRequest {
  string node_id = 1;
  string prefix = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {}

message CreateEnrollCommandRequest {}

message GetNodeMeshRequest {
  string node_id = 1;
}

message PingNodeMeshRequest {
  string node_id = 1;
  bytes public_key = 2;
}

message GetPanelMeshRequest {}

message UpgradeNodeRequest {
  string node_id = 1;
}

message SetNodeMirrorsRequest {
  string node_id = 1;
  repeated string mirrors = 2;
}

message ListNodePanelsRequest {
  string node_id = 1;
}

message ListNodePanelsResponse {
  repeated TrustedPanel panels = 1;
}

message AddNodePanelRequest {
  string node_id = 1;
  // 新面板生成的接入码。
  string invite = 2;
}

message AddNodePanelResponse {}

message RemoveNodePanelRequest {
  string node_id = 1;
  string fingerprint = 2;
}

message RemoveNodePanelResponse {}

message CreateEnrollCommandResponse {
  string command = 1;
  google.protobuf.Timestamp expires_at = 2;
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // 绑定面板域名（为空表示取消），自动申请正式证书。节点的控制连接和安装命令仍然用 IP:端口 + 公钥指纹。
  rpc SetPanelDomain(SetPanelDomainApiRequest) returns (UpdateSettingsResponse);
  rpc GetAlertConfig(GetAlertConfigRequest) returns (GetAlertConfigResponse);
  rpc UpdateAlertConfig(UpdateAlertConfigRequest) returns (UpdateAlertConfigResponse);
  // 用面板发一条测试消息到某个渠道。
  rpc TestAlertChannel(TestAlertChannelRequest) returns (TestAlertChannelResponse);
  // 生成接入码：其他面板用它把节点交给本面板。1 小时内可以给多个节点用。
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // 还在有效期内的接入码。
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // 提前作废接入码。
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // 账号安全：两步验证和安全入口。
  rpc GetSecurity(GetSecurityRequest) returns (Security);
  // 开始设置两步验证：返回密钥和验证器 App 扫码用的地址，10 分钟内用 EnableTOTP 确认。
  rpc BeginTOTP(BeginTOTPRequest) returns (BeginTOTPResponse);
  rpc EnableTOTP(EnableTOTPRequest) returns (Security);
  // 关闭两步验证，需要当前的验证码或者密码。
  rpc DisableTOTP(DisableTOTPRequest) returns (Security);
  // 开启（生成新的随机路径）或关闭安全入口。
  rpc SetEntrance(SetEntranceRequest) returns (Security);
}

message GetSecurityRequest {}

message Security {
  bool totp_enabled = 1;
  // 安全入口路径（不含 /），没开启时为空。开启后要先打开 https://<面板>/<路径> 才能看到登录页。
  string entrance = 2;
}

message BeginTOTPRequest {}

message BeginTOTPResponse {
  string secret = 1;
  string uri = 2;
}

message EnableTOTPRequest {
  string code = 1;
}

message DisableTOTPRequest {
  string code = 1;
  string password = 2;
}

message SetEntranceRequest {
  bool enabled = 1;
}

message CreateInviteRequest {}

message CreateInviteResponse {
  string invite = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListInvitesRequest {}

message Invite {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  // 已经用它加入的节点数。
  uint32 uses = 4;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string id = 1;
}

message RevokeInviteResponse {}

message GetAlertConfigRequest {}

message GetAlertConfigResponse {
  AlertConfig config = 1;
  // 告警配置随面板主密钥一起丢了（用 --new-master-key 启动过），还没有重新保存。
  // 在那之前面板不给节点下发，节点继续按原来的配置发告警。
  bool lost = 2;
}

message UpdateAlertConfigRequest {
  AlertConfig config = 1;
}

message UpdateAlertConfigResponse {
  AlertConfig config = 1;
}

message TestAlertChannelRequest {
  AlertChannel channel = 1;
}

message TestAlertChannelResponse {}

message PanelSettings {
  // 面板对外地址（IP 或域名，不含端口），安装命令和节点连接都用它，必须能被所有节点访问。
  string public_address = 1;
  // 以下只读
  uint32 port = 2;
  string fingerprint = 3;
  // 面板的版本，节点版本和它不一样时可以升级。
  string version = 4;
  // 面板绑定的域名，为空表示没绑定。
  string domain = 5;
  // 面板主密钥文件的路径。数据库里的密钥都用它加密，要单独备份。
  string master_key_path = 6;
}

message GetSettingsRequest {}

message SetPanelDomainApiRequest {
  string domain = 1;
}

message GetSettingsResponse {
  PanelSettings settings = 1;
}

message UpdateSettingsRequest {
  string public_address = 1;
}

message UpdateSettingsResponse {
  PanelSettings settings = 1;
}

message Node {
  string id = 1;
  string name = 2;
  bool online = 3;
  google.protobuf.Timestamp last_seen = 4;
  NodeInfo info = 5;
  // 访问这个节点上的服务用的地址：面板看到的节点来源 IP；面板自带的节点用面板的对外地址。
  // 节点在 NAT 后面时是 NAT 的出口地址，不一定能从外面访问。
  string address = 6;
  // 用接入码加入、还没有批准的节点：不进 mesh、不下发告警配置、不能操作，在节点页批准后才可用。
  bool pending = 7;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // 新建项目，可以同时带上第一个容器（只保存，不部署）。
  rpc CreateProject(CreateProjectRequest) returns (Project);
  rpc GetProject(ProjectRef) returns (ProjectSummary);
  // 修改项目设置：名称、网络名、快照间隔、内部端口，立即生效。共享变量不在这里改。
  rpc UpdateProjectSettings(UpdateProjectSettingsRequest) returns (Project);
  // 保存共享变量的草稿，返回引用了改动变量的容器（部署共享变量时默认一起部署）。
  rpc SaveSharedEnv(SaveSharedEnvRequest) returns (SaveSharedEnvResponse);
  rpc DiscardSharedEnv(ProjectRevisionRef) returns (Project);
  // 删除项目：删除所有容器，容器目录默认保留。
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // 往项目里加一个容器（只保存，不部署）。
  rpc AddContainer(AddContainerRequest) returns (Project);
  // 删除容器：停止并删除它，目录默认保留。
  rpc DeleteContainer(DeleteContainerApiRequest) returns (Project);
  rpc SaveDraft(SaveDraftRequest) returns (Project);
  rpc DiscardDraft(ContainerRevisionRef) returns (Project);
  // 部署一个或多个容器：有草稿的容器把草稿记为新版本，没有的重新部署最新版本。
  // 按依赖顺序逐个部署，某个失败就停下。整次部署记一条部署记录。
  rpc Deploy(DeployRequest) returns (stream DeployEvent);
  rpc ListVersions(ContainerRef) returns (ListVersionsResponse);
  // 回滚容器到某个版本：用它的配置、文件和镜像生成这个容器的新版本并部署，可选同时恢复数据。
  rpc Rollback(RollbackRequest) returns (stream DeployEvent);
  rpc ListDeployments(ProjectRef) returns (ListDeploymentsResponse);
  // 回到某次部署时的状态：版本不一样的容器都回滚到那次记录的版本，作为一次一起部署执行。
  rpc RestoreDeployment(RestoreDeploymentRequest) returns (stream DeployEvent);
  rpc StreamLogs(StreamLogsApiRequest) returns (stream LogLine);

  // 端口映射，立即生效。
  rpc SaveRoute(SaveRouteRequest) returns (Project);
  rpc DeleteRoute(DeleteRouteRequest) returns (Project);

  // 备份节点、迁移（按容器，见 docs/failover.md）。
  // 设置或取消备份节点（node_id 为空表示取消）。
  rpc SetBackupNode(SetBackupNodeRequest) returns (Project);
  // 立即同步到备份节点，同步完才返回。
  rpc SyncBackup(ContainerRef) returns (Project);
  // 备份节点上副本里的快照。
  rpc ListBackupSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  // 原节点离线时，在备份节点上把容器恢复出来。
  rpc RestoreFromBackup(RestoreFromBackupRequest) returns (stream DeployEvent);
  // 把容器迁移到另一个节点（两个节点都在线），不丢数据。
  rpc MigrateContainer(MoveContainerRequest) returns (stream DeployEvent);
  // 原节点离线又没有副本时，把容器换到另一个节点重新部署（数据和旧版本的文件都没有）。
  rpc RedeployElsewhere(MoveContainerRequest) returns (stream DeployEvent);

  // 顶替（按容器，见 docs/failover.md#节点故障指定顶替节点）。
  rpc SetFailover(SetFailoverApiRequest) returns (Project);
  rpc ClearFailover(ContainerRef) returns (Project);
  // 更换见证人，顶替照常进行。
  rpc ChangeWitness(ChangeWitnessRequest) returns (Project);
  // 有状态容器的所在节点失联时，确认由热备顶替。
  rpc ConfirmTakeover(ContainerRef) returns (Project);

  // 项目连接（双向，立即生效）：连上以后两个项目的容器用"容器.网络名"访问对方。
  rpc ConnectProject(ConnectProjectRequest) returns (Project);
  rpc DisconnectProject(ConnectProjectRequest) returns (Project);

  // 快照（按容器）。
  rpc ListSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  // 给容器做一份手动快照；container 为空时给项目里所有部署过的容器各做一份。
  rpc CreateSnapshot(ContainerRef) returns (stream DeployEvent);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (stream DeployEvent);
  // 面板保存的容器快照仓库密码。节点坏了只剩备份文件时，用 kopia 打开仓库要用到。
  rpc GetBackupKey(ContainerRef) returns (GetBackupKeyResponse);

  // 私有仓库认证：每个项目自己的登录信息。
  rpc ListRegistries(ProjectRef) returns (RegistriesResponse);
  rpc LoginRegistry(LoginRegistryApiRequest) returns (RegistriesResponse);
  rpc LogoutRegistry(LogoutRegistryRequest) returns (RegistriesResponse);
  // 立即检查项目的镜像有没有新版本。
  rpc CheckImages(ProjectRef) returns (CheckImagesResponse);
}

message SetBackupNodeRequest {
  string project_id = 1;
  string container = 2;
  string node_id = 3;
  // 取消时同时删除备份节点上的副本。
  bool delete_replica = 4;
}

message SetFailoverApiRequest {
  string project_id = 1;
  string container = 2;
  string standby_node_id = 3;
  // 容器在顶替节点上的目录，为空时按顶替节点的项目根目录生成。
  string standby_dir = 4;
  // 见证人：为空表示面板。
  string witness_node_id = 5;
  // 租约时长（秒），0 表示默认 30。
  uint32 lease_seconds = 6;
  bool auto_stateful = 7;
  bool auto_failback = 8;
}

message ChangeWitnessRequest {
  string project_id = 1;
  string container = 2;
  // 为空表示面板。
  string witness_node_id = 3;
}

message RestoreFromBackupRequest {
  string project_id = 1;
  string container = 2;
  // 为空时用最新的定时或手动快照。
  string snapshot_id = 3;
  // 容器在备份节点上的目录，为空时按备份节点的项目根目录生成。
  string dir = 4;
}

message MoveContainerRequest {
  string project_id = 1;
  string container = 2;
  string node_id = 3;
  // 容器在目标节点上的目录，为空时按目标节点的项目根目录生成。
  string dir = 4;
}

message ConnectProjectRequest {
  string project_id = 1;
  string other_project_id = 2;
}

message ProjectRef {
  string project_id = 1;
}

message ProjectRevisionRef {
  string project_id = 1;
  int64 base_revision = 2;
}

message ContainerRevisionRef {
  string project_id = 1;
  string container = 2;
  int64 base_revision = 3;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated ProjectSummary projects = 1;
}

message CreateProjectRequest {
  string name = 1;
  // 为空时由项目名生成。
  string network_name = 2;
  ProjectSettings settings = 3;
  // 可选：第一个容器。
  string container_name = 4;
  ContainerConfig container = 5;
  string node_id = 6;
  // 为空时用 <节点的项目根目录>/<网络名>/<容器名>。
  string dir = 7;
}

message UpdateProjectSettingsRequest {
  string project_id = 1;
  int64 base_revision = 2;
  string name = 3;
  string network_name = 4;
  // shared_env 在这里不生效（共享变量走草稿）。
  ProjectSettings settings = 5;
}

message SaveSharedEnvRequest {
  string project_id = 1;
  int64 base_revision = 2;
  repeated EnvVar vars = 3;
}

message SaveSharedEnvResponse {
  Project project = 1;
  // 引用了改动变量的容器（部署共享变量时默认一起部署）。
  repeated string affected = 2;
}

message DeleteProjectRequest {
  string project_id = 1;
  int64 base_revision = 2;
  // 同时删除容器目录（数据、快照都会删掉）。为 true 时 confirm_name 必须等于项目名。
  bool delete_dir = 3;
  string confirm_name = 4;
}

message DeleteProjectResponse {}

message AddContainerRequest {
  string project_id = 1;
  string name = 2;
  ContainerConfig config = 3;
  string node_id = 4;
  // 为空时用 <节点的项目根目录>/<网络名>/<容器名>。
  string dir = 5;
}

message DeleteContainerApiRequest {
  string project_id = 1;
  string container = 2;
  int64 base_revision = 3;
  // 同时删除容器目录（数据会删掉）。
  bool delete_dir = 4;
}

message SaveDraftRequest {
  string project_id = 1;
  string container = 2;
  // 容器的修订号。
  int64 base_revision = 3;
  ContainerConfig config = 4;
}

// DeployTarget 是一起部署里的一个容器。
message DeployTarget {
  string container = 1;
  // 基于的容器修订号；面板上已经不是这个修订号时拒绝。0 表示不检查。
  int64 base_revision = 2;
}

message DeployRequest {
  string project_id = 1;
  repeated DeployTarget targets = 2;
  // 部署前先从 git 拉取文件。
  bool pull = 3;
  // 用刚上传的压缩包替换容器的 data/（先 POST /api/upload，只能部署一个容器）。
  bool use_upload = 4;
  // 先拉取最新的镜像（更新镜像）。
  bool pull_images = 5;
  // 先把共享变量的草稿生效。
  bool apply_shared_env = 6;
  int64 settings_revision = 7;
}

message ListVersionsResponse {
  repeated Version versions = 1;
}

message RollbackRequest {
  string project_id = 1;
  string container = 2;
  int64 version = 3;
  // 同时把数据（volumes/ 和保留路径）恢复到这个版本被替换之前。
  bool restore_data = 4;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}

message RestoreDeploymentRequest {
  string project_id = 1;
  int64 deployment_id = 2;
}

message StreamLogsApiRequest {
  string project_id = 1;
  string container = 2;
  string service = 3;
  int32 tail = 4;
  bool follow = 5;
}

message SaveRouteRequest {
  string project_id = 1;
  // name 为空表示新建。
  Exposure route = 2;
}

message DeleteRouteRequest {
  string project_id = 1;
  string name = 2;
}

message GetBackupKeyResponse {
  string key = 1;
}

message RegistriesResponse {
  // 登录过的仓库地址（不返回密码）。
  repeated string registries = 1;
}

message LoginRegistryApiRequest {
  string project_id = 1;
  string registry = 2;
  string username = 3;
  string password = 4;
}

message LogoutRegistryRequest {
  string project_id = 1;
  string registry = 2;
}
