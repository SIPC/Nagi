syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";
import "nagi/v1/agent.proto";
import "nagi/v1/common.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// 以下服务供浏览器调用（Connect-RPC）。

service SetupService {
  rpc GetSetupState(GetSetupStateRequest) returns (GetSetupStateResponse);
  rpc Setup(SetupRequest) returns (SetupResponse);
}

message GetSetupStateRequest {}

message GetSetupStateResponse {
  bool initialized = 1;
}

message SetupRequest {
  // 启动日志里初始化链接带的一次性令牌。
  string token = 1;
  string username = 2;
  string password = 3;
}

message SetupResponse {}

service AuthService {
  // 开启了两步验证时，没带验证码会返回 failed_precondition，界面据此显示验证码输入框。
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  // 修改密码。成功后其他地方的登录全部失效。
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // 两步验证码（开启了才需要）。
  string totp_code = 3;
}

message ChangePasswordRequest {
  string current = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message LoginResponse {}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  string username = 1;
  bool totp_enabled = 2;
}

service NodeService {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // 节点信任的面板列表。
  rpc ListNodePanels(ListNodePanelsRequest) returns (ListNodePanelsResponse);
  // 用另一个面板的接入码，让节点加入那个面板。remove_self 时随后把本面板从节点上移除并忘记节点（移交）。
  rpc AddNodePanel(AddNodePanelRequest) returns (AddNodePanelResponse);
  // 从节点的信任列表移除一个面板。移除的是本面板时，本面板同时忘记这个节点。
  rpc RemoveNodePanel(RemoveNodePanelRequest) returns (RemoveNodePanelResponse);
  // 节点的 mesh 状态。
  rpc GetNodeMesh(GetNodeMeshRequest) returns (MeshStatus);
  // 让节点经 mesh 连一下某个成员。
  rpc PingNodeMesh(PingNodeMeshRequest) returns (MeshPingResponse);
  // 面板自己的 mesh 状态。
  rpc GetPanelMesh(GetPanelMeshRequest) returns (MeshStatus);
  // 节点作为备份节点保存的项目副本。
  rpc ListNodeReplicas(ListNodeReplicasRequest) returns (ListReplicasResponse);
  rpc ListNodeReplicaSnapshots(NodeProjectRef) returns (ListSnapshotsResponse);
  // 把副本恢复成这个节点上的项目。
  rpc RestoreNodeReplica(RestoreNodeReplicaRequest) returns (stream DeployEvent);
  rpc DeleteNodeReplica(NodeProjectRef) returns (DeleteReplicaResponse);
  // 节点参与的顶替设置（运行、热备或见证）。
  rpc ListNodeFailovers(ListNodeReplicasRequest) returns (ListFailoversResponse);
  // 在热备节点上确认顶替。
  rpc ConfirmNodeTakeover(NodeProjectRef) returns (FailoverStatus);
  // 把节点升级到面板提供的版本（面板自带的节点随面板升级，不能单独升级）。
  rpc UpgradeNode(UpgradeNodeRequest) returns (UpgradeResponse);
  // 节点的镜像加速地址。
  rpc GetNodeMirrors(ListNodeReplicasRequest) returns (Mirrors);
  rpc SetNodeMirrors(SetNodeMirrorsRequest) returns (Mirrors);
  // 生成一条添加节点的安装命令，里面带一次性令牌（1 小时内有效）。
  rpc CreateEnrollCommand(CreateEnrollCommandRequest) returns (CreateEnrollCommandResponse);
  rpc QueryNodeMetrics(QueryNodeMetricsRequest) returns (QueryMetricsResponse);
  // 移除节点：面板忘记它并拒绝它再连接。节点上的项目照常运行。
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
}

message QueryNodeMetricsRequest {
  string node_id = 1;
  string prefix = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {}

message CreateEnrollCommandRequest {}

message GetNodeMeshRequest {
  string node_id = 1;
}

message PingNodeMeshRequest {
  string node_id = 1;
  bytes public_key = 2;
}

message GetPanelMeshRequest {}

message ListNodeReplicasRequest {
  string node_id = 1;
}

message UpgradeNodeRequest {
  string node_id = 1;
}

message SetNodeMirrorsRequest {
  string node_id = 1;
  repeated string mirrors = 2;
}

message RestoreNodeReplicaRequest {
  string node_id = 1;
  string project_id = 2;
  string dir = 3;
  string snapshot_id = 4;
}

message ListNodePanelsRequest {
  string node_id = 1;
}

message ListNodePanelsResponse {
  repeated TrustedPanel panels = 1;
}

message AddNodePanelRequest {
  string node_id = 1;
  // 新面板生成的接入码。
  string invite = 2;
  bool remove_self = 3;
}

message AddNodePanelResponse {}

message RemoveNodePanelRequest {
  string node_id = 1;
  string fingerprint = 2;
}

message RemoveNodePanelResponse {}

message CreateEnrollCommandResponse {
  string command = 1;
  google.protobuf.Timestamp expires_at = 2;
}

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc GetAlertConfig(GetAlertConfigRequest) returns (GetAlertConfigResponse);
  rpc UpdateAlertConfig(UpdateAlertConfigRequest) returns (UpdateAlertConfigResponse);
  // 用面板发一条测试消息到某个渠道。
  rpc TestAlertChannel(TestAlertChannelRequest) returns (TestAlertChannelResponse);
  // 生成接入码：其他面板用它把节点交给本面板。1 小时内可以给多个节点用。
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // 还在有效期内的接入码。
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // 提前作废接入码。
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // 账号安全：两步验证和安全入口。
  rpc GetSecurity(GetSecurityRequest) returns (Security);
  // 开始设置两步验证：返回密钥和验证器 App 扫码用的地址，10 分钟内用 EnableTOTP 确认。
  rpc BeginTOTP(BeginTOTPRequest) returns (BeginTOTPResponse);
  rpc EnableTOTP(EnableTOTPRequest) returns (Security);
  // 关闭两步验证，需要当前的验证码或者密码。
  rpc DisableTOTP(DisableTOTPRequest) returns (Security);
  // 开启（生成新的随机路径）或关闭安全入口。
  rpc SetEntrance(SetEntranceRequest) returns (Security);
}

message GetSecurityRequest {}

message Security {
  bool totp_enabled = 1;
  // 安全入口路径（不含 /），没开启时为空。开启后要先打开 https://<面板>/<路径> 才能看到登录页。
  string entrance = 2;
}

message BeginTOTPRequest {}

message BeginTOTPResponse {
  string secret = 1;
  string uri = 2;
}

message EnableTOTPRequest {
  string code = 1;
}

message DisableTOTPRequest {
  string code = 1;
  string password = 2;
}

message SetEntranceRequest {
  bool enabled = 1;
}

message CreateInviteRequest {}

message CreateInviteResponse {
  string invite = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListInvitesRequest {}

message Invite {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3;
  // 已经用它加入的节点数。
  uint32 uses = 4;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message RevokeInviteRequest {
  string id = 1;
}

message RevokeInviteResponse {}

message GetAlertConfigRequest {}

message GetAlertConfigResponse {
  AlertConfig config = 1;
}

message UpdateAlertConfigRequest {
  AlertConfig config = 1;
}

message UpdateAlertConfigResponse {
  AlertConfig config = 1;
}

message TestAlertChannelRequest {
  AlertChannel channel = 1;
}

message TestAlertChannelResponse {}

message PanelSettings {
  // 面板对外地址（IP 或域名，不含端口），安装命令和节点连接都用它，必须能被所有节点访问。
  string public_address = 1;
  // 以下只读
  uint32 port = 2;
  string fingerprint = 3;
  // 面板的版本，节点版本和它不一样时可以升级。
  string version = 4;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  PanelSettings settings = 1;
}

message UpdateSettingsRequest {
  string public_address = 1;
}

message UpdateSettingsResponse {
  PanelSettings settings = 1;
}

message Node {
  string id = 1;
  string name = 2;
  bool online = 3;
  google.protobuf.Timestamp last_seen = 4;
  NodeInfo info = 5;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

service ProjectService {
  rpc ListAllProjects(ListAllProjectsRequest) returns (ListAllProjectsResponse);
  rpc CreateNodeProject(CreateNodeProjectRequest) returns (CreateNodeProjectResponse);
  rpc GetNodeProject(GetNodeProjectRequest) returns (GetNodeProjectResponse);
  rpc SaveNodeProjectDraft(SaveNodeProjectDraftRequest) returns (SaveNodeProjectDraftResponse);
  rpc DiscardNodeProjectDraft(DiscardNodeProjectDraftRequest) returns (DiscardNodeProjectDraftResponse);
  rpc DeleteNodeProject(DeleteNodeProjectRequest) returns (DeleteNodeProjectResponse);
  rpc ListNodeProjectVersions(NodeProjectRef) returns (ListVersionsResponse);
  rpc RollbackNodeProject(RollbackNodeProjectRequest) returns (stream DeployEvent);
  rpc ListNodeProjectSnapshots(NodeProjectRef) returns (ListSnapshotsResponse);
  rpc CreateNodeProjectSnapshot(NodeProjectRef) returns (stream DeployEvent);
  rpc RestoreNodeProjectSnapshot(RestoreNodeProjectSnapshotRequest) returns (stream DeployEvent);
  rpc SaveNodeProjectRoute(SaveNodeProjectRouteRequest) returns (SaveNodeProjectRouteResponse);
  rpc DeleteNodeProjectRoute(DeleteNodeProjectRouteRequest) returns (DeleteNodeProjectRouteResponse);
  rpc DeployNodeProject(DeployNodeProjectRequest) returns (stream DeployEvent);
  rpc StreamNodeProjectLogs(StreamNodeProjectLogsRequest) returns (stream LogLine);
  // 设置项目的备份节点（backup_node_id 为空表示取消，备份节点上已有的副本保留）。
  rpc SetNodeProjectBackup(SetNodeProjectBackupRequest) returns (BackupStatus);
  rpc GetNodeProjectBackup(NodeProjectRef) returns (BackupStatus);
  rpc SyncNodeProjectBackup(NodeProjectRef) returns (BackupStatus);
  // 面板保存的项目快照仓库密码（节点离线也能查）。节点坏了只剩备份文件时，用 kopia 打开仓库要用到。
  rpc GetNodeProjectBackupKey(NodeProjectRef) returns (GetNodeProjectBackupKeyResponse);
  // 私有仓库认证：每个项目自己的登录信息。
  rpc ListNodeProjectRegistries(NodeProjectRef) returns (RegistriesResponse);
  // 立即检查项目的镜像有没有新版本。
  rpc CheckNodeProjectImages(NodeProjectRef) returns (CheckImagesResponse);
  rpc LoginNodeProjectRegistry(LoginNodeProjectRegistryRequest) returns (RegistriesResponse);
  rpc LogoutNodeProjectRegistry(LogoutNodeProjectRegistryRequest) returns (RegistriesResponse);
  // 把项目迁移到另一个节点：项目 ID 不变，不丢数据，停机时间是最后一次增量同步加启动的时间。
  // 成功后原节点上的项目移出（目录保留）；失败时原节点重新启动项目。
  rpc MigrateNodeProject(MigrateNodeProjectRequest) returns (stream DeployEvent);
  // 设置顶替（standby_node_id 为空表示取消）。
  rpc SetNodeProjectFailover(SetNodeProjectFailoverRequest) returns (FailoverStatus);
  rpc GetNodeProjectFailover(NodeProjectRef) returns (FailoverStatus);
}

message SetNodeProjectFailoverRequest {
  string node_id = 1;
  string project_id = 2;
  string standby_node_id = 3;
  // 项目在顶替节点上的目录。
  string standby_dir = 4;
  // 见证人节点；为空表示由本面板担任。
  string witness_node_id = 5;
  bool auto_stateful = 6;
  // 租约时长（秒），0 表示默认 30。
  uint32 lease_seconds = 7;
}

message MigrateNodeProjectRequest {
  string node_id = 1;
  string project_id = 2;
  string target_node_id = 3;
  // 目标节点上的项目目录。
  string dir = 4;
}

message LoginNodeProjectRegistryRequest {
  string node_id = 1;
  string project_id = 2;
  string registry = 3;
  string username = 4;
  string password = 5;
}

message LogoutNodeProjectRegistryRequest {
  string node_id = 1;
  string project_id = 2;
  string registry = 3;
}

message GetNodeProjectBackupKeyResponse {
  string key = 1;
}

message SetNodeProjectBackupRequest {
  string node_id = 1;
  string project_id = 2;
  string backup_node_id = 3;
}

message NodeProject {
  string node_id = 1;
  ProjectSummary project = 2;
}

message ListAllProjectsRequest {}

message ListAllProjectsResponse {
  repeated NodeProject projects = 1;
}

message CreateNodeProjectRequest {
  string node_id = 1;
  string name = 2;
  string dir = 3;
  reserved 4;
  ProjectConfig config = 5;
}

message SaveNodeProjectDraftRequest {
  string node_id = 1;
  string project_id = 2;
  int64 base_revision = 3;
  ProjectConfig config = 4;
}

message SaveNodeProjectDraftResponse {
  Project project = 1;
}

message DiscardNodeProjectDraftRequest {
  string node_id = 1;
  string project_id = 2;
  int64 base_revision = 3;
}

message DiscardNodeProjectDraftResponse {
  Project project = 1;
}

message SaveNodeProjectRouteRequest {
  string node_id = 1;
  string project_id = 2;
  Exposure route = 3;
}

message SaveNodeProjectRouteResponse {
  Project project = 1;
}

message DeleteNodeProjectRouteRequest {
  string node_id = 1;
  string project_id = 2;
  string name = 3;
}

message DeleteNodeProjectRouteResponse {
  Project project = 1;
}

message NodeProjectRef {
  string node_id = 1;
  string project_id = 2;
}

message RollbackNodeProjectRequest {
  string node_id = 1;
  string project_id = 2;
  int64 version = 3;
  bool restore_data = 4;
}

message RestoreNodeProjectSnapshotRequest {
  string node_id = 1;
  string project_id = 2;
  string snapshot_id = 3;
}

message DeleteNodeProjectRequest {
  string node_id = 1;
  string project_id = 2;
  int64 base_revision = 3;
  bool delete_dir = 4;
  string confirm_name = 5;
}

message DeleteNodeProjectResponse {}

message CreateNodeProjectResponse {
  Project project = 1;
}

message GetNodeProjectRequest {
  string node_id = 1;
  string project_id = 2;
}

message GetNodeProjectResponse {
  ProjectSummary project = 1;
}

message DeployNodeProjectRequest {
  string node_id = 1;
  string project_id = 2;
  int64 base_revision = 3;
  // 部署前先从 git 拉取文件。
  bool pull = 4;
  // 用刚上传的压缩包替换 data/（先 POST /api/upload）。
  bool use_upload = 5;
  // 先拉取最新的镜像（更新镜像）。
  bool pull_images = 6;
}

message StreamNodeProjectLogsRequest {
  string node_id = 1;
  string project_id = 2;
  string service = 3;
  int32 tail = 4;
  bool follow = 5;
}
