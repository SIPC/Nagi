  string kind = 3;
  // 操作的用户，或发出告警的节点。
  string actor = 4;
  // 操作是接口方法名（例如 Deploy），告警是 firing 或 resolved。
  string action = 5;
  string project_id = 6;
  string target = 7;
  // 告警的标题；操作失败时的错误信息。
  string detail = 8;
  bool failed = 9;
  // 操作的来源：网页为空，MCP 是 mcp:<令牌名>（见 docs/mcp.md#调用方式）。
  string via = 10;
}

