syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";
import "nagi/v1/common.proto";
import "nagi/v1/panel.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// AgentService：面板调用节点（反向 gRPC），走控制连接。
// 容器的配置以面板为准：面板把完整配置（ContainerSpec）下发给容器所在的节点，节点照着运行并缓存在本地。
service AgentService {
  // ---- 容器 ----
  // 更新节点上缓存的容器配置（端口映射、快照间隔等改了立即生效），不部署。容器第一次放到本节点时检查目录。
  rpc PutContainer(PutContainerRequest) returns (PutContainerResponse);
  // 部署一个容器：写好容器目录里的文件、执行 compose、观察 10 秒，成功后缓存这份配置。
  rpc DeployContainer(DeployContainerRequest) returns (stream DeployEvent);
  // 删除容器：停止并删除它的容器，删除缓存；目录默认保留。
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  // 手动启动、停止或重启容器：不改配置，不生成版本。
  rpc ControlContainer(ControlContainerRequest) returns (stream DeployEvent);
  // 容器的存储：data/、命名 volume，大小和挂载位置。
  rpc ListVolumes(ContainerRef) returns (ListVolumesResponse);
  // 卷里的文件管理，都经 os.Root，不跟随符号链接。snapshot_id 不为空时读快照里的。
  rpc ListVolumeFiles(VolumeFileRef) returns (ListVolumeFilesResponse);
  // 下载和上传走 MeshService，大文件不占用控制连接。写操作要持有顶替租约（有顶替时）。
  rpc DeleteVolumeFile(VolumeFileRef) returns (VolumeFileOpResponse);
  rpc CreateVolumeDir(VolumeFileRef) returns (VolumeFileOpResponse);
  // 把快照里的文件或目录恢复到卷里原来的位置，只覆盖快照里有的文件。
  rpc RestoreVolumeFile(VolumeFileRef) returns (VolumeFileOpResponse);
  // 卷里的改名、移动、复制（同一个卷内）、压缩、解压，都在节点本地进行。每隔一会儿发一条进度，最后一条带结果。
  rpc TransferVolumeFiles(VolumeTransferRequest) returns (stream FileOpEvent);
  rpc CompressVolumeFiles(VolumeCompressRequest) returns (stream FileOpEvent);
  rpc ExtractVolumeFile(VolumeExtractRequest) returns (stream FileOpEvent);
  // 目录的大小：在时间和文件数的限额内统计，超出时标记为不完整。
  rpc ListVolumeDirSizes(VolumeDirSizesRequest) returns (DirSizesResponse);
  rpc ListSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(ContainerRef) returns (stream DeployEvent);
  // 从定时或手动快照恢复容器的 data/ 和 volumes/：停止、恢复、重新启动。配置不变。
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (stream DeployEvent);
  // 删除一份定时、手动或部署前快照。版本文件不能删（回滚要用）。
  rpc DeleteSnapshot(RestoreSnapshotRequest) returns (VolumeFileOpResponse);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
  // 在服务的容器里打开一个交互式终端。第一条输入必须是 start。
  rpc Exec(stream ExecInput) returns (stream ExecOutput);

  // ---- 节点访问：节点的终端和文件（见 docs/node-access.md） ----
  rpc NodeShell(stream NodeShellInput) returns (stream ExecOutput);
  // 在节点上执行一条命令并等它结束（MCP 的 node_exec）：和终端一样的 shell 和环境变量，不分配终端、没有输入。
  rpc NodeExec(NodeExecRequest) returns (stream ExecOutput);
  // 立即清理本节点上每个容器的快照仓库，回收没有快照用到的数据（见 docs/snapshot.md#立即清理）。
  rpc ReclaimSnapshots(ReclaimSnapshotsRequest) returns (stream DeployEvent);
  // 读取节点上一个现有的 compose 目录（导入用，见 docs/agent.md#现有目录）：compose 文件、.env，
  // 以及在这个目录里运行着的 compose 项目。只读。
  rpc InspectComposeDir(InspectComposeDirRequest) returns (InspectComposeDirResponse);
  rpc ListNodeDir(NodeFileRef) returns (ListNodeDirResponse);
  rpc ReadNodeFile(NodeFileRef) returns (ReadNodeFileResponse);
  rpc WriteNodeFile(WriteNodeFileRequest) returns (WriteNodeFileResponse);
  rpc DeleteNodeFile(DeleteNodeFileRequest) returns (NodeFileOpResponse);
  rpc CreateNodeDir(NodeFileRef) returns (NodeFileOpResponse);
  rpc ListNodeFileBackups(NodeFileRef) returns (ListNodeFileBackupsResponse);
  rpc RestoreNodeFileBackup(RestoreNodeFileBackupRequest) returns (WriteNodeFileResponse);
  rpc TransferNodeFiles(NodeTransferRequest) returns (stream FileOpEvent);
  rpc CompressNodeFiles(NodeCompressRequest) returns (stream FileOpEvent);
  rpc ExtractNodeFile(NodeExtractRequest) returns (stream FileOpEvent);
  rpc ListNodeDirSizes(NodeDirSizesRequest) returns (DirSizesResponse);
  // 立即检查容器的镜像有没有新版本。
  rpc CheckImages(ContainerRef) returns (CheckImagesResponse);
  // 向仓库验证账号，返回登录后的 docker 配置（config.json），由面板保存。
  rpc LoginRegistry(LoginRegistryRequest) returns (LoginRegistryResponse);

  // ---- 备份节点、迁移（见 docs/snapshot.md#异地副本、docs/failover.md#手动迁移） ----
  // 源节点：立即同步一次到备份节点（备份节点在 ContainerSpec.backups 里），同步完才返回，返回这个备份节点的状态。
  // target_node_id 为空时同步到第一个（旧版本的节点只认第一个）。
  rpc SyncBackup(SyncBackupRequest) returns (BackupStatus);
  // 目标节点：登记接收一个容器的副本，只接受 source_key 的同步。spec 是容器在本节点上恢复时用的配置（目录是本节点上的）。
  rpc AcceptReplica(AcceptReplicaRequest) returns (AcceptReplicaResponse);
  rpc ListReplicas(ListReplicasRequest) returns (ListReplicasResponse);
  rpc ListReplicaSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  // 目标节点：检查容器能不能放到本节点上（目录可用、端口和域名不冲突），不做任何改动。
  rpc CheckContainer(PutContainerRequest) returns (CheckContainerResponse);
  // 目标节点：把副本恢复成本节点上的容器并启动（按 spec 里部署过的版本，不生成新版本），成功后删除副本。
  // snapshot_id 为空时用最新的定时或手动快照。
  rpc RestoreReplica(RestoreReplicaRequest) returns (stream DeployEvent);
  rpc DeleteReplica(ContainerRef) returns (DeleteReplicaResponse);
  // 源节点：迁移的前半段。容器运行时先同步一次，然后停止并移除容器、保存最后一次快照、再增量同步一次。
  rpc MigrateOut(MigrateOutRequest) returns (stream DeployEvent);
  // 源节点：迁移失败时撤销，重新启动容器。
  rpc MigrateResume(ContainerRef) returns (stream DeployEvent);
  // 副本的存放位置（见 docs/snapshot.md#副本的存放位置）。节点自己校验路径，移动完、核对无误才切换。
  // 修改节点保存副本的默认目录，把在默认目录里的副本移过去。dir 为空表示 <节点目录>/replicas。
  rpc SetReplicaDir(SetReplicaDirRequest) returns (stream DeployEvent);
  // 把一个副本移到 dir 下面；dir 为空表示移回节点的默认目录。
  rpc MoveReplica(MoveReplicaRequest) returns (stream DeployEvent);

  // ---- 顶替（见 docs/failover.md） ----
  // 保存或删除容器的顶替设置（A、B、见证人各一份）。本节点是 A 或 B 时开始续约或热备。
  rpc SetFailover(SetFailoverRequest) returns (FailoverStatus);
  // 热备：确认顶替有状态容器（接受丢失最后一次同步之后的数据）。
  rpc ConfirmTakeover(ContainerRef) returns (FailoverStatus);

  // 节点上的全部缓存：容器的配置、顶替设置、代理计划。新面板（或换了主密钥的面板）据此把项目拼回来（见 docs/panel.md#项目数据）。
  rpc GetCache(GetCacheRequest) returns (NodeCache);

  // 代理计划（整个替换）：本节点放哪些代理、哪些节点可以连进来。节点缓存在本地。
  rpc SetLinks(LinkPlan) returns (SetLinksResponse);
  // 入口节点：检查映射要用的端口有没有被节点上的其他程序占用，不做任何改动。
  rpc CheckPorts(CheckPortsRequest) returns (CheckPortsResponse);
  // 让 Caddy 立刻重新申请还没拿到的证书，并清掉 domains 的失败记录。
  rpc RetryCerts(RetryCertsRequest) returns (RetryCertsResponse);

  // ---- 节点 ----
  // 面板下发告警配置（渠道和规则）。节点保存在本地，面板挂了也能照常告警。
  rpc SetAlertConfig(SetAlertConfigRequest) returns (SetAlertConfigResponse);
  // 查询监控数据。24 小时以内是 10 秒精度，更长是 5 分钟精度。
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  // 磁盘占用：Docker 的镜像、容器、数据卷、构建缓存，以及 Nagi 的容器目录和副本。只读，不清理任何东西。
  rpc GetStorage(GetStorageRequest) returns (NodeStorage);
  // 修改项目根目录（之后新放到本节点的容器默认用它）。
  rpc SetProjectsRoot(SetProjectsRootRequest) returns (SetProjectsRootResponse);
  // 信任的面板列表。
  rpc ListPanels(ListPanelsRequest) returns (ListPanelsResponse);
  // 让节点加入另一个面板（用新面板的令牌），加入后节点同时连接它。
  rpc AddPanel(AddPanelRequest) returns (AddPanelResponse);
  // 从信任列表移除一个面板（可以是调用者自己）。不能移除最后一个面板。
  rpc RemovePanel(RemovePanelRequest) returns (RemovePanelResponse);
  // mesh 状态：到每个成员走哪条路径。
  rpc GetMeshStatus(MeshStatusRequest) returns (MeshStatus);
  // 经 mesh 连一下某个成员，测往返时间。
  rpc MeshPing(MeshPingRequest) returns (MeshPingResponse);
  // 经 mesh 和某个成员互传数据，测两个方向的吞吐。对方正在测时返回 Unavailable。
  rpc MeshSpeedTest(MeshPingRequest) returns (MeshSpeedResponse);
  // 修改组网设置，返回修改后的设置。
  rpc SetMeshOptions(MeshOptions) returns (MeshOptions);
  // 立即更新 mesh 成员列表（隔离节点时用，见 docs/mesh.md#隔离），平时随上报的回复下发。
  rpc SetMesh(MeshConfig) returns (SetMeshResponse);
  // 节点的镜像加速地址（写在 /etc/docker/daemon.json，重启 Docker 后生效）。
  rpc GetMirrors(GetMirrorsRequest) returns (Mirrors);
  rpc SetMirrors(Mirrors) returns (Mirrors);
  // 面板绑定的域名（只发给面板自带的节点）：节点的 Caddy 把这个域名反代到面板，证书由 Caddy 申请。为空表示取消。
  rpc SetPanelDomain(SetPanelDomainRequest) returns (SetPanelDomainResponse);
  // 升级节点：从 GitHub Release（或安装时指定的镜像）下载 UpgradeRequest.version 指定的 nagi，校验后替换自己并原地重启（容器不受影响）。
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
  // 取消正在下载、校验的升级，Upgrade 返回 Canceled，节点还是原来的版本。没有在升级时返回 NotFound，
  // 已经开始替换时返回 FailedPrecondition。v0.20.0 起支持，更早的节点返回 Unimplemented。
  rpc CancelUpgrade(CancelUpgradeRequest) returns (CancelUpgradeResponse);
  // 旧版本的面板用它把外送目标（带凭据）下发给节点。v0.29.1 起节点不再保存，收到后删掉以前保存的；
  // 新面板只发空列表，让旧版本的节点删掉凭据（见 docs/audit.md#节点本地审计）。
  rpc SetAuditSink(SetAuditSinkRequest) returns (SetAuditSinkResponse);
  // 读取节点本地审计，由面板代为外送（见 docs/audit.md#节点本地审计）。v0.29.1 起支持，更早的节点返回 Unimplemented。
  rpc ReadAuditLog(ReadAuditLogRequest) returns (ReadAuditLogResponse);
  // ---- 节点镜像（见 docs/agent.md#节点镜像），v0.31.0 起支持（NodeInfo.image_ops），更早的节点返回 Unimplemented ----
  // 列出镜像、使用它们的容器和 Nagi 要用的原因，以及一键清理会删除哪些。
  rpc ListImages(ListImagesRequest) returns (NodeImages);
  // 删除镜像或标签。节点自己判断：有容器使用的、Nagi 要用的都拒绝，不强制删除。
  rpc DeleteImages(DeleteImagesRequest) returns (DeleteImagesResponse);
  // 一键清理：只删除请求里列出、而且节点重新判断后仍然可以清理的镜像，可选清理构建缓存。
  rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);
  // 拉取镜像，只用节点全局的 Docker 登录信息。调用方取消时停止拉取。
  rpc PullImage(PullImageRequest) returns (stream ImagePullEvent);
}

// ---- 节点镜像（见 docs/agent.md#节点镜像） ----

message ListImagesRequest {}

message NodeImages {
  repeated NodeImage images = 1;
  // 一键清理会删除的镜像（没有容器使用、Nagi 也不用的）。
  repeated string prune_ids = 2;
  // 清理这些镜像至少能释放的空间：按各镜像独占的层计算，它们之间共用的层不计入。
  int64 prune_bytes = 3;
  // 构建缓存中可以回收的大小。
  int64 build_cache_bytes = 4;
}

message NodeImage {
  // 完整的镜像 ID（sha256:...）。
  string id = 1;
  // 仓库:标签，悬空镜像没有。
  repeated string tags = 2;
  // 仓库@摘要。
  repeated string digests = 3;
  int64 size = 4;
  // 只属于这个镜像的大小（不含和别的镜像共用的层），删除它至少能释放这么多。
  int64 unique_size = 5;
  google.protobuf.Timestamp created = 6;
  // 使用这个镜像的容器（包括已停止的）。
  repeated ImageUser users = 7;
  // Nagi 要用它的原因：有任何一条时不能删除，也不会被清理。
  repeated ImageHold holds = 8;
}

message ImageUser {
  // Docker 里的容器名。
  string name = 1;
  bool running = 2;
  // Nagi 管理的容器：所属项目、容器名和容器组里的服务名。
  string project_id = 3;
  string project_name = 4;
  string container = 5;
  string service = 6;
  // Nagi 自己的容器（项目内网的代理）。
  bool system = 7;
}

message ImageHold {
  // deployed：本节点上的容器部署的版本；standby：热备提前拉取的；backup：在本节点从备份恢复时要用的；system：Nagi 自己用的。
  string kind = 1;
  string project_id = 2;
  string project_name = 3;
  string container = 4;
}

// ImageRef 是要删除的一个镜像或标签。
message ImageRef {
  // 完整的镜像 ID（sha256:...），节点核对标签确实属于它。
  string id = 1;
  // 只删除这个标签（镜像还有别的标签时只去掉它）；为空时删除整个镜像。
  string tag = 2;
}

message DeleteImagesRequest {
  repeated ImageRef images = 1;
}

message ImageDeleteResult {
  string id = 1;
  string tag = 2;
  // 删除失败的原因，成功时为空。
  string error = 3;
}

message DeleteImagesResponse {
  repeated ImageDeleteResult results = 1;
}

message PruneImagesRequest {
  // 预览时列出的镜像 ID（NodeImages.prune_ids）。
  repeated string ids = 1;
  bool build_cache = 2;
}

message PruneImagesResponse {
  int32 deleted = 1;
  // 删除失败的镜像。
  repeated ImageDeleteResult failed = 2;
  // 预览以后不能再清理的（例如已经被容器或 Nagi 用上）、已经不在的，没有删除。
  int32 skipped = 3;
  int64 build_cache_freed = 4;
}

message PullImageRequest {
  // 镜像引用，例如 nginx:1.27、ghcr.io/owner/app@sha256:...。
  string image = 1;
}

// ImagePullEvent 是拉取进度，节点最多每 0.25 秒发一条。
message ImagePullEvent {
  // Docker 的状态说明，例如 "Pulling from library/nginx"。
  string status = 1;
  // 已知大小的层合计的已下载、总字节数。
  int64 current = 2;
  int64 total = 3;
  // 已完成（下载并解压，或本地已有）的层数和总层数。
  int32 layers_done = 4;
  int32 layers = 5;
  // 最后一条：拉取完成，镜像 ID。
  bool done = 6;
  string id = 7;
}

message SetLinksResponse {}

message CheckPortsRequest {
  repeated Exposure routes = 1;
}

message CheckPortsResponse {}

message RetryCertsRequest {
  repeated string domains = 1;
}

message RetryCertsResponse {}

message GetCacheRequest {}

message NodeCache {
  repeated ContainerSpec containers = 1;
  repeated FailoverStatus failovers = 2;
  LinkPlan links = 3;
}

message SetFailoverRequest {
  FailoverConfig config = 1;
  // 删除这个容器的顶替设置。
  bool clear = 2;
  string project_id = 3;
  string container = 6;
  // 更换见证人时，新见证人从当前的持有者和轮次开始投票（不填时初始租约归 A、第 1 轮）。
  // 已经有设置的参与者忽略这两项，保留自己的持有者和轮次。
  bytes seed_holder = 4;
  uint64 seed_epoch = 5;
}

message AcceptReplicaRequest {
  ContainerSpec spec = 1;
  bytes source_key = 2;
  string source_node_id = 3;
  string source_name = 4;
  // 也接受这些节点的同步：设置了顶替时，持有租约、运行容器的节点可能是另一个参与者。
  repeated bytes extra_source_keys = 5;
  // 副本的存放位置，只在新登记时使用；为空时用节点的默认目录，已有的副本留在原处。旧版本的节点不认识，面板不发给它们。
  string replica_dir = 6;
}

message SyncBackupRequest {
  string project_id = 1;
  string container = 2;
  string target_node_id = 3;
}

message AcceptReplicaResponse {}

message ListReplicasRequest {}

message ListReplicasResponse {
  repeated Replica replicas = 1;
}

message CheckContainerResponse {}

message RestoreReplicaRequest {
  ContainerSpec spec = 1;
  string snapshot_id = 2;
}

message DeleteReplicaResponse {}

message MigrateOutRequest {
  string project_id = 1;
  string container = 2;
  BackupTarget target = 3;
}

message ContainerRef {
  string project_id = 1;
  string container = 2;
}

message PutContainerRequest {
  ContainerSpec spec = 1;
}

message PutContainerResponse {}

message DeployContainerRequest {
  // spec.version 是这次部署生成的版本号。
  ContainerSpec spec = 1;
  // 部署前先从 git 拉取文件。
  bool pull = 2;
  // 用面板刚上传的文件替换 data/（见 MeshService.Upload）。
  bool use_upload = 3;
  // 先拉取最新的镜像（更新镜像）。
  bool pull_images = 4;
  // 回滚：用这个版本保存的文件替换 data/。
  int64 files_from = 5;
  // 回滚并恢复数据：把运行数据恢复到这个版本被替换之前（找部署前快照）。
  int64 restore_data_from = 6;
  // 容器之前部署过的版本（0 表示第一次部署），用于部署前快照和失败提示。
  int64 previous_version = 7;
}

message DeleteContainerRequest {
  string project_id = 1;
  string container = 2;
  // 同时删除容器目录（数据会删掉）。
  bool delete_dir = 3;
  // 容器已经在别的节点上恢复（原节点离线时）：目录改名为 <目录>.replaced-<时间> 保留。
  bool retire = 4;
}

message DeleteContainerResponse {}

// ContainerAction 是对容器的手动操作。
enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
}

message ControlContainerRequest {
  string project_id = 1;
  string container = 2;
  ContainerAction action = 3;
}

message VolumeMount {
  // 哪个容器（compose 服务）。
  string service = 1;
  // 容器内的路径。
  string target = 2;
}

message VolumeInfo {
  string name = 1;
  // data：容器的 data/；managed：Nagi 管理的命名 volume；unmanaged：不在快照范围（external 或自定义 driver）；
  // orphan：配置里已经没有，目录还在。
  string kind = 2;
  // 节点上的目录，unmanaged 没有。
  string host_path = 3;
  int64 size_bytes = 4;
  int64 files = 5;
  google.protobuf.Timestamp modified = 6;
  repeated VolumeMount mounts = 7;
  // 文件太多或太慢，大小和文件数只统计了一部分。
  bool partial = 8;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
  // 容器目录所在磁盘的总量和可用量。
  int64 disk_total_bytes = 2;
  int64 disk_free_bytes = 3;
}

message VolumeFileRef {
  string project_id = 1;
  string container = 2;
  // 卷名，.data 表示容器的 data/ 目录。
  string volume = 3;
  // 相对卷根目录的路径，/ 分隔，空表示根目录。
  string path = 4;
  string snapshot_id = 5;
  // 下载时只读一段（断点续传、多线程下载，见 internal/pkg/byterange）：只用于普通文件，目录照常打包。
  // offset 小于 0 表示最后 -offset 个字节；length 为 0 表示读到末尾。都是 0 时读整个文件。
  int64 offset = 6;
  int64 length = 7;
}

message VolumeFileEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_symlink = 3;
  int64 size = 4;
  google.protobuf.Timestamp modified = 5;
  string mode = 6;
}

message ListVolumeFilesResponse {
  repeated VolumeFileEntry entries = 1;
  // 目录里的文件太多，只列了一部分。
  bool truncated = 2;
}

message VolumeFileChunk {
  bytes data = 1;
  // 下面几个只在第一条里有。
  string name = 2;
  int64 size = 3;
  // 目录打包成了 tar.gz，大小事先不知道。
  bool archive = 4;
  // 按请求的 offset、length 只发了一段（旧版本的节点不认识，总是发整个文件）。size 仍是整个文件的大小，
  // 实际的起点和长度按 byterange.Resolve 算；起点超出文件时没有内容。
  bool ranged = 5;
  // 文件的修改时间（Unix 纳秒），面板据此生成 ETag，续传前核对文件没有变。
  int64 modified_unix_nano = 6;
}

message VolumeUploadChunk {
  VolumeFileRef ref = 1;
  bytes data = 2;
  // 下面两个只在第一条里有。现在文件的 SHA-256，对不上就拒绝；空表示不检查。
  string expected_sha256 = 3;
  // 只新建：已经存在就拒绝。
  bool create_only = 4;
}

message VolumeUploadResponse {
  int64 size = 1;
}

message VolumeFileOpResponse {}

// 文件的改名、移动、复制、压缩、解压（见 docs/agent.md#存储）。
// conflict：目标已经存在时怎么办。空：不做任何改动，在结果的 conflicts 里列出已存在的名字；
// overwrite：替换；rename：保留两者，新的加「 (2)」这样的后缀；skip：跳过。
message VolumeTransferRequest {
  string project_id = 1;
  string container = 2;
  string volume = 3;
  // 要移动或复制的文件和目录，相对卷根目录。
  repeated string paths = 4;
  // 目标目录，相对卷根目录，空表示根目录。必须已经存在。
  string dest_dir = 5;
  // true 复制，false 移动。面板按调用的接口填写。
  bool copy = 6;
  // 只有一项时可以指定新的名字（改名）。
  string new_name = 7;
  string conflict = 8;
}

message VolumeCompressRequest {
  string project_id = 1;
  string container = 2;
  string volume = 3;
  repeated string paths = 4;
  // 压缩包的路径，相对卷根目录。
  string dest = 5;
  // zip 或 tar.gz。
  string format = 6;
  string conflict = 7;
}

message VolumeExtractRequest {
  string project_id = 1;
  string container = 2;
  string volume = 3;
  // 压缩包：zip、tar.gz（.tgz）、tar。
  string path = 4;
  string dest_dir = 5;
  // true：dest_dir 是新建的目录（以压缩包命名），已经存在时按 conflict 处理这个目录；
  // false：解压到已有的 dest_dir 里，压缩包顶层的每一项按 conflict 处理。
  bool into_new_dir = 6;
  string conflict = 7;
}

message VolumeDirSizesRequest {
  string project_id = 1;
  string container = 2;
  string volume = 3;
  // 所在目录，相对卷根目录。
  string path = 4;
  // 要统计的子目录名。
  repeated string names = 5;
}

message FileOpResult {
  // 已经存在的目标（名字），这时没有做任何改动。
  repeated string conflicts = 1;
  // 完成后各项的路径。
  repeated string paths = 2;
  // 按 skip 跳过的同名项。
  int32 skipped = 3;
  // 没有处理的符号链接、硬链接和特殊文件。
  int32 skipped_links = 4;
}

// FileOpEvent：长操作的进度。result 只在最后一条里。
message FileOpEvent {
  int64 bytes = 1;
  int64 files = 2;
  FileOpResult result = 3;
}

message DirSize {
  string name = 1;
  int64 size = 2;
  int64 files = 3;
  // false：超出了时间或文件数的限额，size 只是已经统计到的部分。
  bool complete = 4;
}

message DirSizesResponse {
  repeated DirSize sizes = 1;
}

// 分块上传（断点续传）：先 Begin 拿到上传 ID 和已经收到的长度，再从这个位置按块发，最后 Commit 核对大小和 SHA-256。
// volume 和 node 二选一，分别是卷里和节点上的目标。
message UploadBeginRequest {
  VolumeFileRef volume = 1;
  NodeFileRef node = 2;
  int64 size = 3;
  // 客户端对文件的标识（名字、大小、修改时间、首尾内容的哈希）。同一个目标、同样大小和标识的上传接着传。
  string key = 4;
  bool confirmed = 5;
}

message UploadSession {
  string id = 1;
  // 已经收到并核对过的长度，下一块从这里开始。
  int64 offset = 2;
  int64 size = 3;
}

// UploadPart 的第一条带 id、offset、sha256 和目标，之后是内容。
message UploadPartChunk {
  VolumeFileRef volume = 1;
  NodeFileRef node = 2;
  string id = 3;
  int64 offset = 4;
  bytes data = 5;
  // 这一块的 SHA-256，对不上就丢掉这一块。
  string sha256 = 6;
}

message UploadCommitRequest {
  VolumeFileRef volume = 1;
  NodeFileRef node = 2;
  string id = 3;
  // 整个文件的 SHA-256。
  string sha256 = 4;
  bool confirmed = 5;
}

message UploadAbortRequest {
  VolumeFileRef volume = 1;
  NodeFileRef node = 2;
  string id = 3;
}

message RestoreSnapshotRequest {
  string project_id = 1;
  string container = 2;
  string snapshot_id = 3;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message StreamLogsRequest {
  string project_id = 1;
  string container = 2;
  // 为空时返回容器组里所有容器的日志。
  string service = 3;
  // 先返回最近多少行。
  int32 tail = 4;
  bool follow = 5;
}

message CheckImagesResponse {
  repeated ImageUpdate updates = 1;
}

message LoginRegistryRequest {
  string registry = 1;
  string username = 2;
  string password = 3;
}

message LoginRegistryResponse {
  // 只有这个仓库的 docker 配置（config.json），面板合并进项目的配置里。
  bytes docker_config = 1;
}

message SetProjectsRootRequest {
  string root = 1;
}

message SetProjectsRootResponse {}

message SetReplicaDirRequest {
  string dir = 1;
}

message MoveReplicaRequest {
  string project_id = 1;
  string container = 2;
  string dir = 3;
}

message SetPanelDomainRequest {
  string domain = 1;
  // 节点的 Caddy 反代面板时带上的请求头 X-Nagi-Proxy 的值：面板据此确认请求是自带节点的 Caddy 转发的，
  // 才相信 X-Forwarded-For 里的客户端地址（登录限速用）。
  string proxy_secret = 2;
}

message SetPanelDomainResponse {}

message UpgradeRequest {
  // 不再使用：面板以前自己提供二进制时发的 SHA-256。
  string sha256 = 1;
  // 要升级到的版本（面板自己的版本，例如 v0.1.0）。节点从这个版本的 GitHub Release
  // （或安装时指定的镜像）下载，按 SHA256SUMS 核对。
  string version = 2;
}

message UpgradeResponse {
  // 新二进制的版本号，节点替换完成后重启。
  string version = 1;
}

message CancelUpgradeRequest {}

message CancelUpgradeResponse {}

message GetMirrorsRequest {}

message Mirrors {
  // 写在 daemon.json 里的地址。
  repeated string mirrors = 1;
  // Docker 当前生效的地址（只读）。和 mirrors 不一样说明还没有重启 Docker。
  repeated string active = 2;
}

message MeshStatusRequest {}

message ListPanelsRequest {}

message ListPanelsResponse {
  repeated TrustedPanel panels = 1;
}

message AddPanelRequest {
  string address = 1;
  string fingerprint = 2;
  string token = 3;
}

message AddPanelResponse {}

message RemovePanelRequest {
  string fingerprint = 1;
}

message RemovePanelResponse {}

message ExecInput {
  oneof input {
    ExecStart start = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
  }
}

message ExecStart {
  string project_id = 1;
  string service = 2;
  string container = 5;
  // 为空时优先用 bash，没有 bash 就用 sh。
  repeated string command = 3;
  TerminalSize size = 4;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecOutput {
  oneof output {
    bytes stdout = 1;
    // 进程退出，终端结束。
    int32 exit_code = 2;
  }
}

message NodeShellInput {
  oneof input {
    NodeShellStart start = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
  }
}

message ReclaimSnapshotsRequest {}

message InspectComposeDirRequest {
  string path = 1;
}

message InspectComposeDirResponse {
  // 规范后的绝对路径。
  string path = 1;
  // 找到的 compose 文件名（按 compose 的顺序：compose.yaml、compose.yml、docker-compose.yaml、docker-compose.yml）和内容。
  string compose_file = 2;
  string compose = 3;
  // 目录里的 .env 原文，没有时为空。
  string env = 4;
  // compose 会自动叠加、但导入时不会带上的文件，例如 docker-compose.override.yml。
  repeated string ignored_files = 5;
  // 在这个目录里运行过的 compose 项目（不含 Nagi 自己的），以及它的容器。
  string project = 6;
  repeated ComposeDirContainer containers = 7;
  // 这个项目的命名卷：compose 里的名字到 Docker 里的名字。
  map<string, string> volumes = 8;
}

message ComposeDirContainer {
  string name = 1;
  string service = 2;
  string state = 3;
}

message NodeExecRequest {
  // 用 shell -lc 执行。
  string command = 1;
  // 工作目录，不存在时用 root 的主目录。
  string cwd = 2;
  // 超时（秒），到时结束整个进程组。
  uint32 timeout_seconds = 3;
  // 面板上的用户名和令牌名，只用于节点本地日志。
  string actor = 4;
  // 发起人的来源地址，只用于节点本地审计。
  string ip = 5;
}

message NodeShellStart {
  TerminalSize size = 1;
  // 起始目录，不存在时用 root 的主目录。
  string cwd = 2;
  // 面板上的用户名，只用于节点本地日志。
  string actor = 3;
  // 发起人的来源地址，只用于节点本地审计。
  string ip = 4;
}

// NodeFileRef 指向节点上的一个路径。path 是绝对路径。node_id 面板用，节点不看。
message NodeFileRef {
  string node_id = 1;
  string path = 2;
  // 下载时只读一段，同 VolumeFileRef 的 offset、length。
  int64 offset = 3;
  int64 length = 4;
}

message NodeFileEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_symlink = 3;
  // 符号链接的目标，原样显示。
  string link_target = 4;
  int64 size = 5;
  google.protobuf.Timestamp modified = 6;
  string mode = 7;
  string owner = 8;
  // normal、confirm（保存前要确认）、readonly（容器目录）、denied（禁止访问）。
  string access = 9;
}

message ListNodeDirResponse {
  // 解开符号链接后的真实路径。
  string path = 1;
  repeated NodeFileEntry entries = 2;
  bool truncated = 3;
  string access = 4;
}

message ReadNodeFileResponse {
  string path = 1;
  bytes content = 2;
  // 内容的 SHA-256（十六进制），保存时带回来，用来发现文件被别人改过。
  string sha256 = 3;
  google.protobuf.Timestamp modified = 4;
  string mode = 5;
  string owner = 6;
  string access = 7;
  // 不是文本（含 0 字节或不是合法的 UTF-8），这时没有 content。
  bool binary = 8;
  int64 size = 9;
}

message WriteNodeFileRequest {
  string node_id = 1;
  string path = 2;
  bytes content = 3;
  // 打开时内容的 SHA-256。文件已经变了就拒绝。空表示不检查（用户确认覆盖）。
  string expected_sha256 = 4;
  // 新建文件：已经存在就拒绝。
  bool create = 5;
  // 用户确认过要改敏感文件。
  bool confirmed = 6;
}

message WriteNodeFileResponse {
  string sha256 = 1;
  // 没能原子写入（挂载的单个文件），改为原地写入。
  bool in_place = 2;
}

message DeleteNodeFileRequest {
  string node_id = 1;
  string path = 2;
  // 删目录时要写目录名。
  string confirm_name = 3;
}

message NodeFileOpResponse {}

message NodeFileBackup {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  int64 size = 3;
}

message ListNodeFileBackupsResponse {
  repeated NodeFileBackup backups = 1;
}

message RestoreNodeFileBackupRequest {
  string node_id = 1;
  string path = 2;
  string id = 3;
  bool confirmed = 4;
}

// 节点上的改名、移动、复制、压缩、解压，路径都是绝对路径，conflict 同 VolumeTransferRequest。
// confirmed：用户确认过要动敏感路径。
message NodeTransferRequest {
  string node_id = 1;
  repeated string paths = 2;
  string dest_dir = 3;
  bool copy = 4;
  string new_name = 5;
  string conflict = 6;
  bool confirmed = 7;
}

message NodeCompressRequest {
  string node_id = 1;
  repeated string paths = 2;
  string dest = 3;
  string format = 4;
  string conflict = 5;
  bool confirmed = 6;
}

message NodeExtractRequest {
  string node_id = 1;
  string path = 2;
  string dest_dir = 3;
  bool into_new_dir = 4;
  string conflict = 5;
  bool confirmed = 6;
}

message NodeDirSizesRequest {
  string node_id = 1;
  string path = 2;
  repeated string names = 3;
}

// NodeFileUploadChunk 第一条带 ref 和 confirmed，之后是内容。
message NodeFileUploadChunk {
  NodeFileRef ref = 1;
  bytes data = 2;
  bool confirmed = 3;
}

message SetAlertConfigRequest {
  AlertConfig config = 1;
}

message SetAlertConfigResponse {}

message QueryMetricsRequest {
  // 序列名前缀，例如 "node:"、"c:<项目 ID>/"。
  string prefix = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // 聚合步长（秒）。大于数据精度时，每条序列按步长合并成一个点（时间取窗口起点）：
  // 名字以 :p95、:p99 结尾的取最大值，其余取平均值。0 表示不聚合。
  int64 step = 4;
}

message QueryMetricsResponse {
  repeated MetricSeries series = 1;
}

message GetStorageRequest {}

// StorageTotal 是 Docker 一类对象（镜像、容器、数据卷、构建缓存）的合计（docker system df）。
message StorageTotal {
  int64 count = 1;
  int64 active = 2;
  int64 bytes = 3;
  // Docker 认为可以回收的部分（没被用到的）。数据卷里可能是业务数据，不能据此清理。
  int64 reclaimable_bytes = 4;
}

message StorageImage {
  string name = 1;
  int64 bytes = 2;
  // 有容器在用。
  int64 containers = 3;
}

// ContainerDirUsage 是本节点上一个容器的目录占用（见 docs/agent.md#容器目录）。
message ContainerDirUsage {
  string project_id = 1;
  string project_name = 2;
  string container = 3;
  string dir = 4;
  int64 data_bytes = 5;
  int64 volumes_bytes = 6;
  // 快照仓库（backups/）。
  int64 backups_bytes = 7;
  // 文件太多或太慢，没算完。
  bool partial = 8;
}

message NodeStorage {
  repeated DiskUsage disks = 1;
  StorageTotal images = 2;
  StorageTotal containers = 3;
  StorageTotal volumes = 4;
  StorageTotal build_cache = 5;
  // 最大的几个镜像。
  repeated StorageImage largest_images = 6;
  repeated ContainerDirUsage container_dirs = 7;
  // 作为备份节点、热备收到的副本。
  int64 replicas_bytes = 8;
  // 取 Docker 的统计失败时的原因，其余部分照常返回。
  string docker_error = 9;
}

message SetMeshResponse {}

// ---- 节点本地审计（见 docs/audit.md#节点本地审计） ----

// NodeAuditSink 是一个外送目标，字段同面板的 AuditSink（不含录制和状态）。
message NodeAuditSink {
  string id = 1;
  string name = 2;
  // syslog、http、s3。
  string type = 3;
  string address = 4;
  string ca = 5;
  string url = 6;
  map<string, string> headers = 7 [debug_redact = true];
  string endpoint = 8;
  string region = 9;
  string bucket = 10;
  string prefix = 11;
  string access_key = 12 [debug_redact = true];
  string secret_key = 13 [debug_redact = true];
}

message SetAuditSinkRequest {
  repeated NodeAuditSink sinks = 1;
}

message SetAuditSinkResponse {}

message ReadAuditLogRequest {
  // 返回序号大于 after 的记录。小于 0 时不返回记录，只返回 start。
  int64 after = 1;
  // 最多返回的条数，节点另外限制总大小。
  int32 limit = 2;
}

message ReadAuditLogResponse {
  // 原样的 JSON 行，按序号排列。
  repeated bytes lines = 1;
  // 第一条和最后一条的序号，没有记录时为 0。
  int64 first = 2;
  int64 last = 3;
  // 面板第一次读时从哪里开始：升级前节点自己外送到的位置，没有时是最新的序号。
  int64 start = 4;
}
