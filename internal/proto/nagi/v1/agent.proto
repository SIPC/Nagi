syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";
import "nagi/v1/common.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// AgentService：面板调用节点（反向 gRPC），走控制连接。
// 容器的配置以面板为准：面板把完整配置（ContainerSpec）下发给容器所在的节点，节点照着运行并缓存在本地。
service AgentService {
  // ---- 容器 ----
  // 更新节点上缓存的容器配置（端口映射、快照间隔等改了立即生效），不部署。容器第一次放到本节点时检查目录。
  rpc PutContainer(PutContainerRequest) returns (PutContainerResponse);
  // 部署一个容器：写好容器目录里的文件、执行 compose、观察 10 秒，成功后缓存这份配置。
  rpc DeployContainer(DeployContainerRequest) returns (stream DeployEvent);
  // 删除容器：停止并删除它的容器，删除缓存；目录默认保留。
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  // 手动启动、停止或重启容器：不改配置，不生成版本。
  rpc ControlContainer(ControlContainerRequest) returns (stream DeployEvent);
  // 容器的存储：data/、命名 volume，大小和挂载位置。
  rpc ListVolumes(ContainerRef) returns (ListVolumesResponse);
  // 卷里的文件管理，都经 os.Root，不跟随符号链接。snapshot_id 不为空时读快照里的。
  rpc ListVolumeFiles(VolumeFileRef) returns (ListVolumeFilesResponse);
  // 下载和上传走 MeshService，大文件不占用控制连接。写操作要持有顶替租约（有顶替时）。
  rpc DeleteVolumeFile(VolumeFileRef) returns (VolumeFileOpResponse);
  rpc CreateVolumeDir(VolumeFileRef) returns (VolumeFileOpResponse);
  // 把快照里的文件或目录恢复到卷里原来的位置，只覆盖快照里有的文件。
  rpc RestoreVolumeFile(VolumeFileRef) returns (VolumeFileOpResponse);
  rpc ListSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(ContainerRef) returns (stream DeployEvent);
  // 从定时或手动快照恢复容器的 data/ 和 volumes/：停止、恢复、重新启动。配置不变。
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (stream DeployEvent);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
  // 在服务的容器里打开一个交互式终端。第一条输入必须是 start。
  rpc Exec(stream ExecInput) returns (stream ExecOutput);

  // ---- 节点访问：节点的终端和文件（见 docs/node-access.md） ----
  rpc NodeShell(stream NodeShellInput) returns (stream ExecOutput);
  rpc ListNodeDir(NodeFileRef) returns (ListNodeDirResponse);
  rpc ReadNodeFile(NodeFileRef) returns (ReadNodeFileResponse);
  rpc WriteNodeFile(WriteNodeFileRequest) returns (WriteNodeFileResponse);
  rpc DeleteNodeFile(DeleteNodeFileRequest) returns (NodeFileOpResponse);
  rpc CreateNodeDir(NodeFileRef) returns (NodeFileOpResponse);
  rpc ListNodeFileBackups(NodeFileRef) returns (ListNodeFileBackupsResponse);
  rpc RestoreNodeFileBackup(RestoreNodeFileBackupRequest) returns (WriteNodeFileResponse);
  // 立即检查容器的镜像有没有新版本。
  rpc CheckImages(ContainerRef) returns (CheckImagesResponse);
  // 向仓库验证账号，返回登录后的 docker 配置（config.json），由面板保存。
  rpc LoginRegistry(LoginRegistryRequest) returns (LoginRegistryResponse);

  // ---- 备份节点、迁移（见 docs/snapshot.md#异地副本、docs/failover.md#手动迁移） ----
  // 源节点：立即同步一次到备份节点（备份节点在 ContainerSpec.backup 里），同步完才返回。
  rpc SyncBackup(ContainerRef) returns (BackupStatus);
  // 目标节点：登记接收一个容器的副本，只接受 source_key 的同步。spec 是容器在本节点上恢复时用的配置（目录是本节点上的）。
  rpc AcceptReplica(AcceptReplicaRequest) returns (AcceptReplicaResponse);
  rpc ListReplicas(ListReplicasRequest) returns (ListReplicasResponse);
  rpc ListReplicaSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  // 目标节点：检查容器能不能放到本节点上（目录可用、端口和域名不冲突），不做任何改动。
  rpc CheckContainer(PutContainerRequest) returns (CheckContainerResponse);
  // 目标节点：把副本恢复成本节点上的容器并启动（按 spec 里部署过的版本，不生成新版本），成功后删除副本。
  // snapshot_id 为空时用最新的定时或手动快照。
  rpc RestoreReplica(RestoreReplicaRequest) returns (stream DeployEvent);
  rpc DeleteReplica(ContainerRef) returns (DeleteReplicaResponse);
  // 源节点：迁移的前半段。容器运行时先同步一次，然后停止并移除容器、保存最后一次快照、再增量同步一次。
  rpc MigrateOut(MigrateOutRequest) returns (stream DeployEvent);
  // 源节点：迁移失败时撤销，重新启动容器。
  rpc MigrateResume(ContainerRef) returns (stream DeployEvent);

  // ---- 顶替（见 docs/failover.md） ----
  // 保存或删除容器的顶替设置（A、B、见证人各一份）。本节点是 A 或 B 时开始续约或热备。
  rpc SetFailover(SetFailoverRequest) returns (FailoverStatus);
  // 热备：确认顶替有状态容器（接受丢失最后一次同步之后的数据）。
  rpc ConfirmTakeover(ContainerRef) returns (FailoverStatus);

  // 节点上的全部缓存：容器的配置、顶替设置、代理计划。新面板（或换了主密钥的面板）据此把项目拼回来（见 docs/panel.md#项目数据）。
  rpc GetCache(GetCacheRequest) returns (NodeCache);

  // 代理计划（整个替换）：本节点放哪些代理、哪些节点可以连进来。节点缓存在本地。
  rpc SetLinks(LinkPlan) returns (SetLinksResponse);
  // 入口节点：检查映射要用的端口有没有被节点上的其他程序占用，不做任何改动。
  rpc CheckPorts(CheckPortsRequest) returns (CheckPortsResponse);
  // 让 Caddy 立刻重新申请还没拿到的证书，并清掉 domains 的失败记录。
  rpc RetryCerts(RetryCertsRequest) returns (RetryCertsResponse);

  // ---- 节点 ----
  // 面板下发告警配置（渠道和规则）。节点保存在本地，面板挂了也能照常告警。
  rpc SetAlertConfig(SetAlertConfigRequest) returns (SetAlertConfigResponse);
  // 查询监控数据。24 小时以内是 10 秒精度，更长是 5 分钟精度。
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  // 修改项目根目录（之后新放到本节点的容器默认用它）。
  rpc SetProjectsRoot(SetProjectsRootRequest) returns (SetProjectsRootResponse);
  // 信任的面板列表。
  rpc ListPanels(ListPanelsRequest) returns (ListPanelsResponse);
  // 让节点加入另一个面板（用新面板的令牌），加入后节点同时连接它。
  rpc AddPanel(AddPanelRequest) returns (AddPanelResponse);
  // 从信任列表移除一个面板（可以是调用者自己）。不能移除最后一个面板。
  rpc RemovePanel(RemovePanelRequest) returns (RemovePanelResponse);
  // mesh 状态：到每个成员走哪条路径。
  rpc GetMeshStatus(MeshStatusRequest) returns (MeshStatus);
  // 经 mesh 连一下某个成员，测往返时间。
  rpc MeshPing(MeshPingRequest) returns (MeshPingResponse);
  // 节点的镜像加速地址（写在 /etc/docker/daemon.json，重启 Docker 后生效）。
  rpc GetMirrors(GetMirrorsRequest) returns (Mirrors);
  rpc SetMirrors(Mirrors) returns (Mirrors);
  // 面板绑定的域名（只发给面板自带的节点）：节点的 Caddy 把这个域名反代到面板，证书由 Caddy 申请。为空表示取消。
  rpc SetPanelDomain(SetPanelDomainRequest) returns (SetPanelDomainResponse);
  // 升级节点：从 GitHub Release（或安装时指定的镜像）下载 UpgradeRequest.version 指定的 nagi，校验后替换自己并原地重启（容器不受影响）。
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
}

message SetLinksResponse {}

message CheckPortsRequest {
  repeated Exposure routes = 1;
}

message CheckPortsResponse {}

message RetryCertsRequest {
  repeated string domains = 1;
}

message RetryCertsResponse {}

message GetCacheRequest {}

message NodeCache {
  repeated ContainerSpec containers = 1;
  repeated FailoverStatus failovers = 2;
  LinkPlan links = 3;
}

message SetFailoverRequest {
  FailoverConfig config = 1;
  // 删除这个容器的顶替设置。
  bool clear = 2;
  string project_id = 3;
  string container = 6;
  // 更换见证人时，新见证人从当前的持有者和轮次开始投票（不填时初始租约归 A、第 1 轮）。
  // 已经有设置的参与者忽略这两项，保留自己的持有者和轮次。
  bytes seed_holder = 4;
  uint64 seed_epoch = 5;
}

message AcceptReplicaRequest {
  ContainerSpec spec = 1;
  bytes source_key = 2;
  string source_node_id = 3;
  string source_name = 4;
}

message AcceptReplicaResponse {}

message ListReplicasRequest {}

message ListReplicasResponse {
  repeated Replica replicas = 1;
}

message CheckContainerResponse {}

message RestoreReplicaRequest {
  ContainerSpec spec = 1;
  string snapshot_id = 2;
}

message DeleteReplicaResponse {}

message MigrateOutRequest {
  string project_id = 1;
  string container = 2;
  BackupTarget target = 3;
}

message ContainerRef {
  string project_id = 1;
  string container = 2;
}

message PutContainerRequest {
  ContainerSpec spec = 1;
}

message PutContainerResponse {}

message DeployContainerRequest {
  // spec.version 是这次部署生成的版本号。
  ContainerSpec spec = 1;
  // 部署前先从 git 拉取文件。
  bool pull = 2;
  // 用面板刚上传的文件替换 data/（见 MeshService.Upload）。
  bool use_upload = 3;
  // 先拉取最新的镜像（更新镜像）。
  bool pull_images = 4;
  // 回滚：用这个版本保存的文件替换 data/。
  int64 files_from = 5;
  // 回滚并恢复数据：把运行数据恢复到这个版本被替换之前（找部署前快照）。
  int64 restore_data_from = 6;
  // 容器之前部署过的版本（0 表示第一次部署），用于部署前快照和失败提示。
  int64 previous_version = 7;
}

message DeleteContainerRequest {
  string project_id = 1;
  string container = 2;
  // 同时删除容器目录（数据会删掉）。
  bool delete_dir = 3;
  // 容器已经在别的节点上恢复（原节点离线时）：目录改名为 <目录>.replaced-<时间> 保留。
  bool retire = 4;
}

message DeleteContainerResponse {}

// ContainerAction 是对容器的手动操作。
enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
  CONTAINER_ACTION_RESTART = 3;
}

message ControlContainerRequest {
  string project_id = 1;
  string container = 2;
  ContainerAction action = 3;
}

message VolumeMount {
  // 哪个容器（compose 服务）。
  string service = 1;
  // 容器内的路径。
  string target = 2;
}

message VolumeInfo {
  string name = 1;
  // data：容器的 data/；managed：Nagi 管理的命名 volume；unmanaged：不在快照范围（external 或自定义 driver）；
  // orphan：配置里已经没有，目录还在。
  string kind = 2;
  // 节点上的目录，unmanaged 没有。
  string host_path = 3;
  int64 size_bytes = 4;
  int64 files = 5;
  google.protobuf.Timestamp modified = 6;
  repeated VolumeMount mounts = 7;
  // 文件太多或太慢，大小和文件数只统计了一部分。
  bool partial = 8;
}

message ListVolumesResponse {
  repeated VolumeInfo volumes = 1;
  // 容器目录所在磁盘的总量和可用量。
  int64 disk_total_bytes = 2;
  int64 disk_free_bytes = 3;
}

message VolumeFileRef {
  string project_id = 1;
  string container = 2;
  // 卷名，.data 表示容器的 data/ 目录。
  string volume = 3;
  // 相对卷根目录的路径，/ 分隔，空表示根目录。
  string path = 4;
  string snapshot_id = 5;
}

message VolumeFileEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_symlink = 3;
  int64 size = 4;
  google.protobuf.Timestamp modified = 5;
  string mode = 6;
}

message ListVolumeFilesResponse {
  repeated VolumeFileEntry entries = 1;
  // 目录里的文件太多，只列了一部分。
  bool truncated = 2;
}

message VolumeFileChunk {
  bytes data = 1;
  // 下面几个只在第一条里有。
  string name = 2;
  int64 size = 3;
  // 目录打包成了 tar.gz，大小事先不知道。
  bool archive = 4;
}

message VolumeUploadChunk {
  VolumeFileRef ref = 1;
  bytes data = 2;
}

message VolumeUploadResponse {
  int64 size = 1;
}

message VolumeFileOpResponse {}

message RestoreSnapshotRequest {
  string project_id = 1;
  string container = 2;
  string snapshot_id = 3;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message StreamLogsRequest {
  string project_id = 1;
  string container = 2;
  // 为空时返回容器组里所有容器的日志。
  string service = 3;
  // 先返回最近多少行。
  int32 tail = 4;
  bool follow = 5;
}

message CheckImagesResponse {
  repeated ImageUpdate updates = 1;
}

message LoginRegistryRequest {
  string registry = 1;
  string username = 2;
  string password = 3;
}

message LoginRegistryResponse {
  // 只有这个仓库的 docker 配置（config.json），面板合并进项目的配置里。
  bytes docker_config = 1;
}

message SetProjectsRootRequest {
  string root = 1;
}

message SetProjectsRootResponse {}

message SetPanelDomainRequest {
  string domain = 1;
  // 节点的 Caddy 反代面板时带上的请求头 X-Nagi-Proxy 的值：面板据此确认请求是自带节点的 Caddy 转发的，
  // 才相信 X-Forwarded-For 里的客户端地址（登录限速用）。
  string proxy_secret = 2;
}

message SetPanelDomainResponse {}

message UpgradeRequest {
  // 不再使用：面板以前自己提供二进制时发的 SHA-256。
  string sha256 = 1;
  // 要升级到的版本（面板自己的版本，例如 v0.1.0）。节点从这个版本的 GitHub Release
  // （或安装时指定的镜像）下载，按 SHA256SUMS 核对。
  string version = 2;
}

message UpgradeResponse {
  // 新二进制的版本号，节点替换完成后重启。
  string version = 1;
}

message GetMirrorsRequest {}

message Mirrors {
  // 写在 daemon.json 里的地址。
  repeated string mirrors = 1;
  // Docker 当前生效的地址（只读）。和 mirrors 不一样说明还没有重启 Docker。
  repeated string active = 2;
}

message MeshStatusRequest {}

message ListPanelsRequest {}

message ListPanelsResponse {
  repeated TrustedPanel panels = 1;
}

message AddPanelRequest {
  string address = 1;
  string fingerprint = 2;
  string token = 3;
}

message AddPanelResponse {}

message RemovePanelRequest {
  string fingerprint = 1;
}

message RemovePanelResponse {}

message ExecInput {
  oneof input {
    ExecStart start = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
  }
}

message ExecStart {
  string project_id = 1;
  string service = 2;
  string container = 5;
  // 为空时优先用 bash，没有 bash 就用 sh。
  repeated string command = 3;
  TerminalSize size = 4;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecOutput {
  oneof output {
    bytes stdout = 1;
    // 进程退出，终端结束。
    int32 exit_code = 2;
  }
}

message NodeShellInput {
  oneof input {
    NodeShellStart start = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
  }
}

message NodeShellStart {
  TerminalSize size = 1;
  // 起始目录，不存在时用 root 的主目录。
  string cwd = 2;
  // 面板上的用户名，只用于节点本地日志。
  string actor = 3;
}

// NodeFileRef 指向节点上的一个路径。path 是绝对路径。node_id 面板用，节点不看。
message NodeFileRef {
  string node_id = 1;
  string path = 2;
}

message NodeFileEntry {
  string name = 1;
  bool is_dir = 2;
  bool is_symlink = 3;
  // 符号链接的目标，原样显示。
  string link_target = 4;
  int64 size = 5;
  google.protobuf.Timestamp modified = 6;
  string mode = 7;
  string owner = 8;
  // normal、confirm（保存前要确认）、readonly（容器目录）、denied（禁止访问）。
  string access = 9;
}

message ListNodeDirResponse {
  // 解开符号链接后的真实路径。
  string path = 1;
  repeated NodeFileEntry entries = 2;
  bool truncated = 3;
  string access = 4;
}

message ReadNodeFileResponse {
  string path = 1;
  bytes content = 2;
  // 内容的 SHA-256（十六进制），保存时带回来，用来发现文件被别人改过。
  string sha256 = 3;
  google.protobuf.Timestamp modified = 4;
  string mode = 5;
  string owner = 6;
  string access = 7;
  // 不是文本（含 0 字节或不是合法的 UTF-8），这时没有 content。
  bool binary = 8;
  int64 size = 9;
}

message WriteNodeFileRequest {
  string node_id = 1;
  string path = 2;
  bytes content = 3;
  // 打开时内容的 SHA-256。文件已经变了就拒绝。空表示不检查（用户确认覆盖）。
  string expected_sha256 = 4;
  // 新建文件：已经存在就拒绝。
  bool create = 5;
  // 用户确认过要改敏感文件。
  bool confirmed = 6;
}

message WriteNodeFileResponse {
  string sha256 = 1;
  // 没能原子写入（挂载的单个文件），改为原地写入。
  bool in_place = 2;
}

message DeleteNodeFileRequest {
  string node_id = 1;
  string path = 2;
  // 删目录时要写目录名。
  string confirm_name = 3;
}

message NodeFileOpResponse {}

message NodeFileBackup {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  int64 size = 3;
}

message ListNodeFileBackupsResponse {
  repeated NodeFileBackup backups = 1;
}

message RestoreNodeFileBackupRequest {
  string node_id = 1;
  string path = 2;
  string id = 3;
  bool confirmed = 4;
}

// NodeFileUploadChunk 第一条带 ref 和 confirmed，之后是内容。
message NodeFileUploadChunk {
  NodeFileRef ref = 1;
  bytes data = 2;
  bool confirmed = 3;
}

message SetAlertConfigRequest {
  AlertConfig config = 1;
}

message SetAlertConfigResponse {}

message QueryMetricsRequest {
  // 序列名前缀，例如 "node:"、"c:<项目 ID>/"。
  string prefix = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // 聚合步长（秒）。大于数据精度时，每条序列按步长合并成一个点（时间取窗口起点）：
  // 名字以 :p95、:p99 结尾的取最大值，其余取平均值。0 表示不聚合。
  int64 step = 4;
}

message QueryMetricsResponse {
  repeated MetricSeries series = 1;
}
