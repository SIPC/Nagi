syntax = "proto3";

package nagi.v1;

import "google/protobuf/timestamp.proto";
import "nagi/v1/common.proto";

option go_package = "github.com/SIPC/nagi/internal/proto/nagi/v1;nagiv1";

// AgentService：面板调用节点（反向 gRPC），走控制连接。
// 容器的配置以面板为准：面板把完整配置（ContainerSpec）下发给容器所在的节点，节点照着运行并缓存在本地。
service AgentService {
  // ---- 容器 ----
  // 更新节点上缓存的容器配置（端口映射、快照间隔等改了立即生效），不部署。容器第一次放到本节点时检查目录。
  rpc PutContainer(PutContainerRequest) returns (PutContainerResponse);
  // 部署一个容器：写好容器目录里的文件、执行 compose、观察 10 秒，成功后缓存这份配置。
  rpc DeployContainer(DeployContainerRequest) returns (stream DeployEvent);
  // 删除容器：停止并删除它的容器，删除缓存；目录默认保留。
  rpc DeleteContainer(DeleteContainerRequest) returns (DeleteContainerResponse);
  rpc ListSnapshots(ContainerRef) returns (ListSnapshotsResponse);
  rpc CreateSnapshot(ContainerRef) returns (stream DeployEvent);
  // 从定时或手动快照恢复容器的 data/ 和 volumes/：停止、恢复、重新启动。配置不变。
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (stream DeployEvent);
  rpc StreamLogs(StreamLogsRequest) returns (stream LogLine);
  // 在服务的容器里打开一个交互式终端。第一条输入必须是 start。
  rpc Exec(stream ExecInput) returns (stream ExecOutput);
  // 立即检查容器的镜像有没有新版本。
  rpc CheckImages(ContainerRef) returns (CheckImagesResponse);
  // 向仓库验证账号，返回登录后的 docker 配置（config.json），由面板保存。
  rpc LoginRegistry(LoginRegistryRequest) returns (LoginRegistryResponse);

  // ---- 节点 ----
  // 面板下发告警配置（渠道和规则）。节点保存在本地，面板挂了也能照常告警。
  rpc SetAlertConfig(SetAlertConfigRequest) returns (SetAlertConfigResponse);
  // 查询监控数据。24 小时以内是 10 秒精度，更长是 5 分钟精度。
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  // 修改项目根目录（之后新放到本节点的容器默认用它）。
  rpc SetProjectsRoot(SetProjectsRootRequest) returns (SetProjectsRootResponse);
  // 信任的面板列表。
  rpc ListPanels(ListPanelsRequest) returns (ListPanelsResponse);
  // 让节点加入另一个面板（用新面板的令牌），加入后节点同时连接它。
  rpc AddPanel(AddPanelRequest) returns (AddPanelResponse);
  // 从信任列表移除一个面板（可以是调用者自己）。不能移除最后一个面板。
  rpc RemovePanel(RemovePanelRequest) returns (RemovePanelResponse);
  // mesh 状态：到每个成员走哪条路径。
  rpc GetMeshStatus(MeshStatusRequest) returns (MeshStatus);
  // 经 mesh 连一下某个成员，测往返时间。
  rpc MeshPing(MeshPingRequest) returns (MeshPingResponse);
  // 节点的镜像加速地址（写在 /etc/docker/daemon.json，重启 Docker 后生效）。
  rpc GetMirrors(GetMirrorsRequest) returns (Mirrors);
  rpc SetMirrors(Mirrors) returns (Mirrors);
  // 面板绑定的域名（只发给面板自带的节点）：节点的 Caddy 把这个域名反代到面板，证书由 Caddy 申请。为空表示取消。
  rpc SetPanelDomain(SetPanelDomainRequest) returns (SetPanelDomainResponse);
  // 升级节点：从发起请求的面板下载 nagi，校验后替换自己并原地重启（容器不受影响）。
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
}

message ContainerRef {
  string project_id = 1;
  string container = 2;
}

message PutContainerRequest {
  ContainerSpec spec = 1;
}

message PutContainerResponse {}

message DeployContainerRequest {
  // spec.version 是这次部署生成的版本号。
  ContainerSpec spec = 1;
  // 部署前先从 git 拉取文件。
  bool pull = 2;
  // 用面板刚上传的文件替换 data/（见 MeshService.Upload）。
  bool use_upload = 3;
  // 先拉取最新的镜像（更新镜像）。
  bool pull_images = 4;
  // 回滚：用这个版本保存的文件替换 data/。
  int64 files_from = 5;
  // 回滚并恢复数据：把运行数据恢复到这个版本被替换之前（找部署前快照）。
  int64 restore_data_from = 6;
  // 容器之前部署过的版本（0 表示第一次部署），用于部署前快照和失败提示。
  int64 previous_version = 7;
}

message DeleteContainerRequest {
  string project_id = 1;
  string container = 2;
  // 同时删除容器目录（数据会删掉）。
  bool delete_dir = 3;
}

message DeleteContainerResponse {}

message RestoreSnapshotRequest {
  string project_id = 1;
  string container = 2;
  string snapshot_id = 3;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message StreamLogsRequest {
  string project_id = 1;
  string container = 2;
  // 为空时返回容器组里所有容器的日志。
  string service = 3;
  // 先返回最近多少行。
  int32 tail = 4;
  bool follow = 5;
}

message CheckImagesResponse {
  repeated ImageUpdate updates = 1;
}

message LoginRegistryRequest {
  string registry = 1;
  string username = 2;
  string password = 3;
}

message LoginRegistryResponse {
  // 只有这个仓库的 docker 配置（config.json），面板合并进项目的配置里。
  bytes docker_config = 1;
}

message SetProjectsRootRequest {
  string root = 1;
}

message SetProjectsRootResponse {}

message SetPanelDomainRequest {
  string domain = 1;
}

message SetPanelDomainResponse {}

message UpgradeRequest {
  // 二进制的 SHA-256（十六进制），节点下载后核对。
  string sha256 = 1;
}

message UpgradeResponse {
  // 新二进制的版本号，节点替换完成后重启。
  string version = 1;
}

message GetMirrorsRequest {}

message Mirrors {
  // 写在 daemon.json 里的地址。
  repeated string mirrors = 1;
  // Docker 当前生效的地址（只读）。和 mirrors 不一样说明还没有重启 Docker。
  repeated string active = 2;
}

message MeshStatusRequest {}

message ListPanelsRequest {}

message ListPanelsResponse {
  repeated TrustedPanel panels = 1;
}

message AddPanelRequest {
  string address = 1;
  string fingerprint = 2;
  string token = 3;
}

message AddPanelResponse {}

message RemovePanelRequest {
  string fingerprint = 1;
}

message RemovePanelResponse {}

message ExecInput {
  oneof input {
    ExecStart start = 1;
    bytes stdin = 2;
    TerminalSize resize = 3;
  }
}

message ExecStart {
  string project_id = 1;
  string service = 2;
  string container = 5;
  // 为空时优先用 bash，没有 bash 就用 sh。
  repeated string command = 3;
  TerminalSize size = 4;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message ExecOutput {
  oneof output {
    bytes stdout = 1;
    // 进程退出，终端结束。
    int32 exit_code = 2;
  }
}

message SetAlertConfigRequest {
  AlertConfig config = 1;
}

message SetAlertConfigResponse {}

message QueryMetricsRequest {
  // 序列名前缀，例如 "node:"、"c:<项目 ID>/"。
  string prefix = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message QueryMetricsResponse {
  repeated MetricSeries series = 1;
}
